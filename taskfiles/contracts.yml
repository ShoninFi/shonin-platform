# The contracts: Solidity built and tested with Foundry (contracts/evm), and
# the Solana programs built with Anchor (contracts/solana).
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  build:
    desc: "Compile the EVM contracts"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge build

  sizes:
    desc: "Fail if any EVM contract is over the chain's contract-size limit"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge build --sizes --skip test --skip script

  test:
    desc: "Run the EVM contracts' tests and the Solana programs' tests"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge test
      - task: solana:test

  fmt:
    desc: "Format the EVM contracts and the Solana programs"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge fmt
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo fmt --all

  lint:
    desc: "Check the contracts' and the programs' formatting, and clippy the programs"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge fmt --check
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo fmt --all --check
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo clippy --workspace --all-targets -- -D warnings

  clean:
    desc: "Remove the contracts' and the programs' build output"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge clean
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo clean

  solana:check:
    desc: "Type-check the Solana programs (fast; no Solana toolchain needed)"
    cmds:
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo check --workspace

  solana:build:
    desc: "Build the Solana programs and their IDL with Anchor"
    cmds:
      # A program's address is its keypair's, under target/deploy, which is
      # never committed (see crates/shonin-program-id). Anchor makes any
      # keypair that is missing before it compiles.
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && anchor build

  solana:fixtures:
    desc: "Fetch the third-party programs the Solana tests load (Orca's, Pyth's receiver) from mainnet into .shonin/fixtures, each checked against the hash committed in contracts/solana/tests/fixtures/programs.txt"
    cmds:
      - '"{{.PATH_CONTRACTS_SOLANA}}/tests/fixtures/fetch.sh" "{{.PATH_FIXTURES}}"'

  solana:test:
    desc: "Build the Solana programs and run their tests in-process (LiteSVM)"
    cmds:
      - task: solana:build
      - task: solana:fixtures
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo test --workspace

  solana:test:deep:
    desc: "The Solana programs' property tests, deep, under several seeds (RUNS, SEEDS)"
    vars:
      RUNS: '{{.RUNS | default "500"}}'
      SEEDS: '{{.SEEDS | default "1 2 3"}}'
    cmds:
      - task: solana:build
      - task: solana:fixtures
      - |
        cd "{{.PATH_CONTRACTS_SOLANA}}"
        for seed in {{.SEEDS}}; do
          SHONIN_PROPERTY_RUNS={{.RUNS}} SHONIN_PROPERTY_SEED=$seed cargo test -p shonin-solana-tests --test platform_properties
        done

  solana:deploy:
    desc: "Deploy the Solana programs: to the local cluster, set up as the devnet sets it up, or with NETWORK=testnet every program to devnet. With NETWORK=mainnet the eight programs that ship, built --features mainnet with the ids of MAINNET_PROGRAM_KEYPAIRS=<dir> (<library name>-keypair.json each), set up with ADMIN=<the hardware key's Solana address> as admin and made final: alone a dry run printing the plan (stand-in ids without the keypairs); ON_FORK=1 rehearses on the local Surfpool fork contracts:solana:mainnet-fork runs (or SHONIN_RPC_SOLANA_MAINNET_BETA=http://127.0.0.1:<port>), writing under .shonin/mainnet-fork; DEPLOYER_KEYFILE=<keypair> CONFIRM_MAINNET=mainnet-beta sends for real, writes each program's mainnet-id and config/deployments/mainnet. A run stopped part way resumes: each program has its own buffer (kept in .shonin/mainnet/solana/buffers), any other buffer the deployer holds is closed, and a set-up already on the cluster is refused unless it holds this ADMIN and the mainnet settings; nothing is made final until every set-up account reads back as this deploy's. PROJECT=<id> adds the operator's project to the admin's steps"
    vars:
      DEPLOYER_KEYPAIR: '{{joinPath .PATH_ROOT ".shonin" .NETWORK "solana-deployer.json"}}'
      DEVNET_PROGRAMS: '{{joinPath .PATH_ROOT ".shonin" "testnet" "solana-programs"}}'
    cmds:
      - |
        set -e
        if [ "{{.NETWORK}}" = mainnet ]; then
          # Mainnet. The ids are the owner's keypairs' (checked against any
          # committed mainnet-id, none written yet), or a dry run's stand-ins;
          # the programs and the deploy tool are built with them, then the
          # deploy runs in the mode the flags give.
          state="{{.PATH_MAINNET_SOLANA}}"
          mkdir -p "$state"
          {{if .ON_FORK}}
          # The rehearsal's fork: contracts:solana:mainnet-fork's, unless set.
          export SHONIN_RPC_SOLANA_MAINNET_BETA="${SHONIN_RPC_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_RPC}}}"
          export SHONIN_WS_SOLANA_MAINNET_BETA="${SHONIN_WS_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_WS}}}"
          {{end}}
          {{.DEVNET}} --vault-chain solana mainnet-solana-ids {{.MAINNET_ARGS}} \
            {{if .MAINNET_PROGRAM_KEYPAIRS}}--program-keypairs {{shellQuote .MAINNET_PROGRAM_KEYPAIRS}}{{end}} \
            --program-sources "{{.PATH_CONTRACTS_SOLANA}}/programs" \
            --stand-ins "$state/stand-in-program-keypairs" --out "$state/program-ids"
          export SHONIN_MAINNET_IDS="$state/program-ids"
          out="$state/programs"
          rm -rf "$out" && mkdir -p "$out"
          cd "{{.PATH_CONTRACTS_SOLANA}}"
          grep -v '^#' "$SHONIN_MAINNET_IDS" | while read -r name id; do
            cargo build-sbf --manifest-path "programs/$(echo "$name" | tr _ -)/Cargo.toml" \
              --features mainnet --sbf-out-dir "$out" < /dev/null
          done
          # cargo build-sbf leaves a keypair of its own beside each program:
          # the ids are the owner's, so these are never used.
          rm -f "$out"/*-keypair.json
          cd "{{.PATH_ROOT}}"
          {{.DEVNET_MAINNET}} --vault-chain solana mainnet-solana-deploy {{.MAINNET_ARGS}} \
            {{if .MAINNET_PROGRAM_KEYPAIRS}}--program-keypairs {{shellQuote .MAINNET_PROGRAM_KEYPAIRS}}{{end}} \
            --programs-dir "$out" --program-sources "{{.PATH_CONTRACTS_SOLANA}}/programs" \
            --admin-steps-dir "{{.PATH_MAINNET_ADMIN_STEPS}}" --state-dir "$state" \
            {{if .PROJECT}}--project {{shellQuote .PROJECT}}{{end}}
          exit 0
        fi
        { read -r rpc; read -r record; } <<EOF
        $({{.DEVNET}} --vault-chain solana chain)
        EOF
        case "{{.NETWORK}}" in
          local)
            # The devnet deploys every program, sets the platform up and
            # writes the deployment file, as `task dev` does.
            cd "{{.PATH_CONTRACTS_SOLANA}}" && anchor build && cd "{{.PATH_ROOT}}"
            {{.DEVNET}} --vault-chain solana deploy
            exit 0 ;;
          testnet) ;;
          *)
            echo "NETWORK={{.NETWORK}} is not a network this task deploys to."
            exit 1 ;;
        esac
        # Devnet. The deployer and every program are keys of
        # SHONIN_TESTNET_SOLANA_MNEMONIC, each program at its fixed index
        # (packages/devnet/src/devnet_keys.rs), so everyone deploying from it
        # deploys the same ids. Fund the deployer first (`task chains:accounts
        # NETWORK=testnet` shows it). The keypairs go under .shonin, never into
        # target/deploy, whose keypairs are this machine's local ones.
        #
        # Each program's devnet-id is written from its key (and a different
        # one already there is refused: it was another mnemonic's), each
        # program is built with --features devnet beside its keypair, then
        # deployed: a final one once, an upgradeable one again on every run.
        # Their ids are recorded in the cluster's deployment file. Nothing is
        # set up: no dollar, markets, images, project or roles, so the
        # services still wait for a deployment that names its roles.
        deployer="{{.DEPLOYER_KEYPAIR}}"
        dir="{{.DEVNET_PROGRAMS}}"
        mkdir -p "$dir" "$(dirname "$deployer")"
        {{.DEVNET}} solana-keypair --role deployer --out "$deployer" >/dev/null
        {{.DEVNET}} solana-program-keypairs --out "$dir" > "$dir/programs"
        cd "{{.PATH_CONTRACTS_SOLANA}}"
        while read -r name id kind; do
          file="programs/$(echo "$name" | tr _ -)/devnet-id"
          if [ -s "$file" ]; then
            committed=$(tr -d '[:space:]' < "$file")
            if [ "$committed" != "$id" ]; then
              echo "$file holds $committed, and the mnemonic's key for $name is $id: is SHONIN_TESTNET_SOLANA_MNEMONIC the team's?"
              exit 1
            fi
          else
            echo "$id" > "$file"
            echo "wrote $file: commit it, so every devnet build has $name at $id"
          fi
        done < "$dir/programs"
        while read -r name id kind; do
          cargo build-sbf --manifest-path "programs/$(echo "$name" | tr _ -)/Cargo.toml" \
            --features devnet --sbf-out-dir "$dir" < /dev/null
        done < "$dir/programs"
        programs='{}'
        while read -r name id kind; do
          if [ "$kind" = final ] && solana program show "$id" --url "$rpc" < /dev/null >/dev/null 2>&1; then
            echo "$name is already at $id, final"
          else
            final=""
            [ "$kind" = final ] && final="--final"
            # An upgrade larger than the program's account fails: grow the
            # account first, with room for a few more upgrades.
            if [ "$kind" != final ]; then
              have=$(solana program show "$id" --url "$rpc" --output json < /dev/null 2>/dev/null | jq -r '.dataLen // 0')
              need=$(wc -c < "$dir/$name.so" | tr -d ' ')
              if [ "$have" -gt 0 ] && [ "$need" -gt "$have" ]; then
                solana program extend "$id" $((need - have + 32768)) --url "$rpc" \
                  --keypair "$deployer" --commitment confirmed < /dev/null
              fi
            fi
            # Straight to the cluster's leaders (QUIC), with a priority fee:
            # a program's hundreds of buffer writes sent through an RPC
            # endpoint stall at its rate limit on devnet.
            solana program deploy --commitment confirmed --url "$rpc" \
              --with-compute-unit-price 20000 --max-sign-attempts 50 \
              --keypair "$deployer" --program-id "$dir/$name-keypair.json" $final "$dir/$name.so" < /dev/null
            echo "$name is at $id"
          fi
          programs=$(echo "$programs" | jq --arg name "$name" --arg id "$id" '. + {($name): $id}')
        done < "$dir/programs"
        mkdir -p "$(dirname "$record")"
        [ -s "$record" ] || echo '{}' > "$record"
        jq --argjson programs "$programs" '.programs = $programs' "$record" > "$record.new"
        mv "$record.new" "$record"
        echo "(recorded in $record)"

  solana:mainnet-fork:
    desc: "A local Surfpool fork of mainnet-beta for ON_FORK=1 rehearsals of the Solana mainnet deploy, on 127.0.0.1:19210 (websocket 19211), the address the rehearsal tasks use by default. Its datasource is a read-only forwarder on 127.0.0.1:19209 that passes on reads alone (get… methods) to mainnet-beta's public endpoint, or SHONIN_FORK_UPSTREAM_SOLANA, one request each, and refuses everything else. Runs until stopped (needs surfpool)"
    cmds:
      - "{{.DEVNET}} solana-mainnet-fork --port 19210 --ws-port 19211 --proxy-port 19209"

  solana:admin-steps:
    desc: "Mainnet's Solana admin steps (proposing Orca's driver, and PROJECT's project): with ON_FORK=1 sent from the stand-in admin ADMIN_KEYFILE=<keypair> (which must be ADMIN) on the local fork, WARP=1 then moving its clock past the timelock; otherwise nothing is sent: each step still to do is printed (program, accounts, data) and written to .shonin/mainnet/admin-steps/admin-steps-solana-mainnet-beta.json for the hardware key (NETWORK=mainnet ADMIN=<address>)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "the admin's prepared steps are mainnet's (NETWORK={{.NETWORK}})."
    cmds:
      # On a fork the rehearsal's ids; on mainnet the committed mainnet-id
      # files the real send wrote.
      - >-
        {{if .ON_FORK}}SHONIN_RPC_SOLANA_MAINNET_BETA="${SHONIN_RPC_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_RPC}}}"
        SHONIN_WS_SOLANA_MAINNET_BETA="${SHONIN_WS_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_WS}}}"{{end}}
        SHONIN_MAINNET_IDS="{{if .ON_FORK}}{{.PATH_MAINNET_SOLANA}}/program-ids{{end}}"
        {{.DEVNET_MAINNET}} --vault-chain solana mainnet-solana-admin-steps {{.MAINNET_ARGS}}
        --admin-steps-dir "{{.PATH_MAINNET_ADMIN_STEPS}}"
        {{if .ADMIN_KEYFILE}}--admin-keyfile {{shellQuote .ADMIN_KEYFILE}}{{end}}
        {{if .PROJECT}}--project {{shellQuote .PROJECT}}{{end}}
        {{if .WARP}}--warp{{end}}

  solana:verify-deploy:
    desc: "Mainnet's Solana read-back, read-only: each of the eight programs final at its recorded id and running this build, the registry's admin ADMIN, its timelock and floor two days, the Confidential Space checker its only checker with its pins, no development checker, USDC everywhere, fees and the vault factory ADMIN's, thirty days' notice on prices, Orca's driver's pool and price account and whether it is proposed (IN_FORCE=1: in force, and PROJECT's project proposed). ON_FORK=1 reads the rehearsal's (NETWORK=mainnet ADMIN=<address>)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "the read-back is mainnet's (NETWORK={{.NETWORK}})."
    cmds:
      # On a fork the rehearsal's ids and build; on mainnet the committed
      # mainnet-id files and the build the real send deployed.
      - >-
        {{if .ON_FORK}}SHONIN_RPC_SOLANA_MAINNET_BETA="${SHONIN_RPC_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_RPC}}}"
        SHONIN_WS_SOLANA_MAINNET_BETA="${SHONIN_WS_SOLANA_MAINNET_BETA:-{{.SOLANA_FORK_WS}}}"{{end}}
        SHONIN_MAINNET_IDS="{{if .ON_FORK}}{{.PATH_MAINNET_SOLANA}}/program-ids{{end}}"
        {{.DEVNET_MAINNET}} --vault-chain solana mainnet-solana-verify {{.MAINNET_ARGS}}
        --programs-dir "{{if .ON_FORK}}{{.PATH_MAINNET_SOLANA}}{{else}}{{joinPath .PATH_ROOT ".shonin" "mainnet" "solana"}}{{end}}/programs"
        {{if .PROJECT}}--project {{shellQuote .PROJECT}}{{end}}
        {{if .IN_FORCE}}--expect-in-force{{end}}
