# The contracts: Solidity built and tested with Foundry (contracts/evm), and
# the Solana programs built with Anchor (contracts/solana).
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  build:
    desc: "Compile the EVM contracts"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge build

  sizes:
    desc: "Fail if any EVM contract is over the chain's contract-size limit"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge build --sizes --skip test --skip script

  test:
    desc: "Run the EVM contracts' tests"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge test

  fmt:
    desc: "Format the EVM contracts and the Solana programs"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge fmt
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo fmt --all

  lint:
    desc: "Check the contracts' and the programs' formatting"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge fmt --check
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo fmt --all --check

  clean:
    desc: "Remove the contracts' and the programs' build output"
    cmds:
      - cd "{{.PATH_CONTRACTS_EVM}}" && forge clean
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo clean

  solana:check:
    desc: "Type-check the Solana programs (fast; no Solana toolchain needed)"
    cmds:
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && cargo check --workspace

  solana:build:
    desc: "Build the Solana programs and their IDL with Anchor"
    cmds:
      # A program's address is its keypair's, under target/deploy, which is
      # never committed (see the program's build.rs).
      - cd "{{.PATH_CONTRACTS_SOLANA}}" && anchor build

  solana:deploy:
    desc: "Deploy the Solana programs: to the local validator, or with NETWORK=testnet to devnet (mainnet refuses)"
    vars:
      PROGRAM_KEYPAIR: '{{joinPath .PATH_CONTRACTS_SOLANA "target" "deploy" "shonin_registry-keypair.json"}}'
      DEPLOYER_KEYPAIR: '{{joinPath .PATH_ROOT ".shonin" .NETWORK "solana-deployer.json"}}'
    cmds:
      - |
        set -e
        { read -r rpc; read -r record; } <<EOF
        $({{.DEVNET}} --vault-chain solana chain)
        EOF
        program="{{.PROGRAM_KEYPAIR}}"
        deployer="{{.DEPLOYER_KEYPAIR}}"
        mkdir -p "$(dirname "$program")" "$(dirname "$deployer")"
        case "{{.NETWORK}}" in
          local)
            # Throwaway keys, and coin from the validator's own faucet.
            [ -f "$program" ] || solana-keygen new --no-bip39-passphrase --silent -o "$program"
            [ -f "$deployer" ] || solana-keygen new --no-bip39-passphrase --silent -o "$deployer"
            solana airdrop 10 "$(solana-keygen pubkey "$deployer")" --url "$rpc" ;;
          testnet)
            # Both from SHONIN_TESTNET_SOLANA_MNEMONIC, so everyone deploying
            # from it deploys the same program id. Fund the deployer first.
            {{.DEVNET}} solana-keypair --role program --out "$program" >/dev/null
            {{.DEVNET}} solana-keypair --role deployer --out "$deployer" >/dev/null ;;
          *)
            echo "This task does not deploy to mainnet. A program's mainnet id is committed in contracts/solana/programs/<name>/mainnet-id, and a mainnet build uses it with --features mainnet."
            exit 1 ;;
        esac
        cd "{{.PATH_CONTRACTS_SOLANA}}"
        anchor build
        anchor deploy --provider.cluster "$rpc" --provider.wallet "$deployer"
        id=$(solana-keygen pubkey "$program")
        mkdir -p "$(dirname "$record")"
        jq -n --arg id "$id" '{programs: {shonin_registry: $id}}' > "$record"
        echo "shonin_registry is at $id (recorded in $record)"
