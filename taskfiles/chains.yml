# The local chains: three anvils standing in for the EVM vault chains (base,
# hyperliquid, robinhood) and one Solana cluster (Surfpool). Their ids and ports match
# the `local` network in config/chains.toml.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  # The local chains exist only on the local network; on a public one there
  # is nothing to start.
  ONLY_LOCAL: >-
    if [ "{{.NETWORK}}" != "local" ]; then
    echo "NETWORK={{.NETWORK}} uses public chains: no local chain to start";
    exit 0; fi

tasks:
  default:
    desc: "Every local chain: three anvils and a Solana cluster"
    deps: [evm, solana]

  evm:
    desc: "Three anvils, standing in for base, hyperliquid and robinhood"
    deps:
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_BASE}}", CHAIN_ID: "{{.CHAIN_ID_EVM_BASE}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_HYPERLIQUID}}", CHAIN_ID: "{{.CHAIN_ID_EVM_HYPERLIQUID}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_ROBINHOOD}}", CHAIN_ID: "{{.CHAIN_ID_EVM_ROBINHOOD}}" }

  anvil:
    internal: true
    cmds:
      # Quiet, because three of them would drown everything else; the
      # dashboard shows each chain's head and time.
      - |
        {{.ONLY_LOCAL}}
        exec anvil --port {{.PORT}} --chain-id {{.CHAIN_ID}} --block-time 1 \
          --accounts 10 --balance 10000 --host 127.0.0.1 --silent

  solana:
    desc: "A Solana cluster (Surfpool, offline), fresh each time; the devnet deploys to it and drives its clock"
    cmds:
      # Offline: nothing is fetched from a public cluster, so every account
      # on it is one the devnet put there. Surfpool's clock can be moved,
      # which is how the devnet runs it an hour a second as it runs the
      # anvils'.
      - |
        {{.ONLY_LOCAL}}
        rm -rf "{{.PATH_SOLANA_LEDGER}}"
        mkdir -p "{{.PATH_SOLANA_LEDGER}}"
        cd "{{.PATH_SOLANA_LEDGER}}"
        exec "{{.SURFPOOL}}" start --offline --no-tui --no-studio --no-deploy -y \
          --host 127.0.0.1 --port {{.PORT_SOLANA_RPC}} --ws-port {{.PORT_SOLANA_WS}} \
          --studio-port {{.PORT_SOLANA_STUDIO}} \
          --log-path ./logs --log-level warn

  deploy:
    desc: "Deploy the EVM contracts to every EVM chain of the network, and locally the Solana programs (local, or NETWORK=testnet). With NETWORK=mainnet, exactly what ships on each EVM chain (or VAULT_CHAIN=<name>'s), with ADMIN=<the hardware key's address> and GENERATION=1 required on the command line (never taken from the environment; no other generation is accepted): alone a dry run printing every contract, its arguments and address and the admin's steps; ON_FORK=1 rehearses on local forks (SHONIN_RPC_EVM_<id>=http://127.0.0.1:<port>), writing under .shonin/mainnet-fork, with a throwaway deployer or DEPLOYER_KEYFILE naming one of anvil's public keys (OVERWRITE_FORK_RECORD=1 replaces a rehearsal's deployment file whose contracts are not on the fork); DEPLOYER_KEYFILE=<path> CONFIRM_MAINNET=<chain ids> sends for real and writes config/deployments/mainnet. PROJECT=<id> adds the operator's project to the admin's steps"
    cmds:
      - task: :contracts:build
      - >-
        {{if eq .NETWORK "mainnet"}}{{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-deploy {{.MAINNET_ARGS}}
        --admin-steps-dir "{{.PATH_MAINNET_ADMIN_STEPS}}"
        {{if .PROJECT}}--project {{shellQuote .PROJECT}}{{end}}
        {{if .OVERWRITE_FORK_RECORD}}--overwrite-fork-record{{end}}{{else}}{{.DEVNET}} deploy{{end}}

  admin-steps:
    desc: "Mainnet: the admin's steps the deploy prepared (initialising each station factory, proposing each driver and the project). With ON_FORK=1 sent as ADMIN, impersonated, on the local forks, and WARP=1 then moves the forks' clocks past the timelock; otherwise nothing is sent: each step still to do is printed as its command for the hardware wallet (cast send --ledger) and written to .shonin/mainnet/admin-steps/admin-steps-evm-<id>.sh (NETWORK=mainnet ADMIN=<address>)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "the admin's prepared steps are mainnet's (NETWORK={{.NETWORK}})."
    cmds:
      - >-
        {{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-admin-steps {{.MAINNET_ARGS}}
        --admin-steps-dir "{{.PATH_MAINNET_ADMIN_STEPS}}"
        {{if .WARP}}--warp{{end}}

  verify-deploy:
    desc: "Mainnet, read-only: every address and setting of each EVM chain's deployment read back and compared with its file, this build's plan and config/mainnet.toml: code present, admin and fees ADMIN, timelock and floor two days, thirty days' notice on prices, the generation, the checker's pins and no other checker, no development contract, each driver's listings and whether it is in force (IN_FORCE=1 requires it, and PROJECT's). ON_FORK=1 reads the rehearsal's; without it every endpoint must be the mainnet's, none local or anvil (NETWORK=mainnet ADMIN=<address> GENERATION=1)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "the read-back is mainnet's (NETWORK={{.NETWORK}}); the testnets have task chains:smoke."
    cmds:
      - task: :contracts:build
      - >-
        {{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-verify {{.MAINNET_ARGS}}
        {{if .PROJECT}}--project {{shellQuote .PROJECT}}{{end}}
        {{if .IN_FORCE}}--expect-in-force{{end}}

  record-keeper:
    desc: "Mainnet: record the keeper's hot EVM key (KEEPER=<address>) as the keeper in each EVM chain's deployment file (or VAULT_CHAIN=<name>'s), held to ADMIN, changing nothing else and sending nothing: alone it prints what it would write, WRITE=1 writes config/deployments/mainnet (commit it), ON_FORK=1 the rehearsal's files; a different keeper already recorded is replaced only with REPLACE=1. The keeper holds no other role; chains:verify-deploy checks it"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "recording the keeper is mainnet's (NETWORK={{.NETWORK}}); the testnets' roles come from the mnemonic."
    requires:
      vars: [KEEPER]
    cmds:
      - >-
        {{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-record-keeper {{.MAINNET_ARGS}}
        --keeper {{shellQuote .KEEPER}}
        {{if .REPLACE}}--replace{{end}}
        {{if .WRITE}}--write{{end}}

  verify-source:
    desc: "Mainnet: the source of every EVM contract the deploy created (the platform's contracts, the vault's libraries, the checker and its RISC Zero verifier, the driver, the contracts at one address on every chain) verified on each chain's explorers as config/mainnet.toml lists them (Etherscan's v2 API, Sourcify), from the deployment file, held to ADMIN, GENERATION and this build, with the compiler settings, libraries and constructor arguments the deploy used. Alone a dry run printing each submission and its command; ON_FORK=1 reads the rehearsal's file and checks its code on the forks, a dry run only (an explorer can't see a fork); SUBMIT=1 submits, from the committed config/deployments/mainnet alone, with ETHERSCAN_API_KEY from .env (never printed); a contract already verified is skipped. Sends no transaction (NETWORK=mainnet ADMIN=<address> GENERATION=1)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "mainnet" ]'
        msg: "source verification is mainnet's (NETWORK={{.NETWORK}})."
      - sh: '[ -z "{{.SUBMIT}}" ] || [ -z "{{.ON_FORK}}" ]'
        msg: "ON_FORK=1 with SUBMIT=1: an explorer can't see a fork. Nothing was submitted."
    env:
      # Read by forge alone, from its environment, on a submission.
      ETHERSCAN_API_KEY: '{{if .SUBMIT}}{{.ETHERSCAN_API_KEY}}{{end}}'
    cmds:
      - task: :contracts:build
      # An empty task-level value leaves a key exported in the shell in
      # place: without SUBMIT the key is taken out of the environment.
      - >-
        {{if not .SUBMIT}}unset ETHERSCAN_API_KEY;{{end}}
        {{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-verify-source {{.MAINNET_ARGS}}
        --venues "{{joinPath .PATH_ROOT "config" "mainnet.toml"}}"
        --contracts-root "{{.PATH_CONTRACTS_EVM}}"
        {{if .SUBMIT}}--submit{{end}}

  solana-setup:
    desc: "Set Solana devnet up from the programs task contracts:solana:deploy NETWORK=testnet deployed: every role funded by transfer from the deployer (config/funding.toml), Circle's devnet USDC as the dollar (no stand-in venue or driver, nothing minted: dollars come from Circle's faucet), the registry (no timelock, the development checker), the operator's project, the orca driver, every role's dollar account, then deployments/solana-devnet.json with the roles. Orca's pool is seeded and kept by testnet-market (task chains:testnet-market-setup STEPS=gas,pools). No image is proposed: propose the real digests with task chains:image. Safe to run again (NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "The Solana set-up is for devnet (NETWORK=testnet); the local cluster is set up with the chains (NETWORK={{.NETWORK}})."
      - sh: '[ -n "${SHONIN_TESTNET_SOLANA_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_SOLANA_MNEMONIC is empty in .env: the roles and the deployer are its keys."
    cmds:
      - "{{.DEVNET_SOLANA}} --vault-chain solana solana-setup --project {{.GCP_PROJECT_TESTNET}}"

  solana-migrate-stations:
    desc: "After task contracts:solana:deploy NETWORK=testnet upgrades the station program in place, rewrite every station the first station program wrote in the current layout: one migrate_station each, paid by the deployer, each read back with every value unchanged; sends nothing when none needs it, and DRY_RUN=1 only lists them. Safe to run again (NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "Rewriting the stations is for devnet (NETWORK=testnet); a local cluster is deployed fresh (NETWORK={{.NETWORK}})."
      - sh: '[ -n "${SHONIN_TESTNET_SOLANA_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_SOLANA_MNEMONIC is empty in .env: the deployer, who pays, is its key."
    cmds:
      - "{{.DEVNET_SOLANA}} --vault-chain solana migrate-stations{{if .DRY_RUN}} --dry-run{{end}}"

  accounts:
    desc: "Each role's account and gas on every EVM chain, the funders and what they need, and on Solana devnet the deployer (its funder), each role's SOL and what it is short, the dollar's mint and the programs (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} accounts"

  checker:
    desc: "Propose the Confidential Space checker beside the development checker on every EVM chain of the network (the one named in the deployments directory's attestation-<chain>.json if it is on the chain and pins this build's guest, root and Google keys, else a new one beside it) and on its Solana cluster once set up (the checker program's account for the pinned guest, Google's Confidential Space root and Google keys), SHONIN_VAULT_CHAIN=solana for Solana alone (local or NETWORK=testnet)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET_SOLANA}} propose-checker"

  image:
    desc: "Propose a real image digest on every chain's registry (each EVM chain's, and Solana's once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (DIGEST=sha256:<hex> KIND=executor|builder|reviewer|unwinder|holder; NETWORK=testnet); already proposed is done. With NETWORK=mainnet ADMIN=<the hardware key's address>, each EVM chain's proposal from its deployment file as the hardware key's step (cast send --ledger, printed and written to .shonin/mainnet/admin-steps/image-evm-<id>.sh, never sent), or with ON_FORK=1 sent as the impersonated admin on the forks (WARP=1 then past the timelock); Solana's mainnet image is task contracts:solana:admin-steps NETWORK=mainnet DIGEST=… KIND=…. Solana has no holder kind. The root key's test requester is proposed as KIND=reviewer: the canonical chain's registry is the one its exchange checks"
    requires:
      vars: [DIGEST, KIND]
    cmds:
      # On mainnet the hardware key proposes it: the image's admin step, from
      # the deployment files, prepared (cast send --ledger) or on a fork
      # (ON_FORK=1, WARP=1) sent as the impersonated admin. Solana's is
      # contracts:solana:admin-steps with DIGEST and KIND.
      - >-
        {{if eq .NETWORK "mainnet"}}{{.DEVNET}} {{.VAULT_CHAIN_ARG}} mainnet-image {{.MAINNET_ARGS}}
        --digest {{shellQuote .DIGEST}} --kind {{shellQuote .KIND}}
        --admin-steps-dir "{{.PATH_MAINNET_ADMIN_STEPS}}"
        {{if .WARP}}--warp{{end}}{{else}}{{.DEVNET_SOLANA}} propose-image --digest {{.DIGEST}} --kind {{.KIND}}{{end}}

  revoke-image:
    desc: "Revoke an image digest on every chain's registry (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (DIGEST=sha256:<hex>; NETWORK=testnet); already revoked is done. Revoked takes effect at once and for good: keys blessed from it stop counting, and a root key recorded from it stops being live, on the chains revoked"
    requires:
      vars: [DIGEST]
    cmds:
      - "{{.DEVNET_SOLANA}} revoke-image --digest {{.DIGEST}}"

  project:
    desc: "Propose an operator's Google Cloud project (its keccak256) on every chain's registry (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (PROJECT=<project id>; NETWORK=testnet); already proposed is done"
    requires:
      vars: [PROJECT]
    cmds:
      - "{{.DEVNET_SOLANA}} propose-project {{.PROJECT}}"

  retire-dev-checker:
    desc: "Retire the development checker on every chain (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin; refused where no other checker is allowed (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET_SOLANA}} retire-checker --dev"

  allow-dev-checker:
    desc: "Deploy and propose a fresh development checker on every chain (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, for a publish only it can bless; retire it again after (NETWORK=testnet)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET_SOLANA}} allow-dev-checker"

  fund:
    desc: "Top every role up on every EVM testnet from the funder, buying HYPE on HyperCore for HyperEVM; safe to run again (NETWORK=testnet only)"
    cmds:
      - "{{.DEVNET}} fund"

  testnet-market-setup:
    desc: "Set up what testnet-market needs on the testnets, from the funder (STEPS=feeds,gas,inventory by default; also pools and driver): the mirror feeds of the mainnet feeds the Robinhood Chain testnet's stocks are priced by (recorded in the deployments directory as mirror-feeds-evm-<chain>.json), the market account's gas (GAS=<coin>, or the funding file's market amount), its inventory (STOCK_TOKENS=10 of each stock token, WETH=0.01, USDC=50, from what the funder holds), POOL_TOKENS=<n> of each token added to its pool full-range (each time it runs), and the Robinhood driver built from the listings (PROPOSE=1 proposes it under the name config/drivers.toml lists for the chain: robinhood on Robinhood Chain, uniswap-base on Base); on Solana devnet, gas is the market's SOL (SOL=<n>, or the funding file's market amount) from the deployer, and pools creates Orca's pool the driver lists if it isn't there, brings it to Pyth's price and opens the market's position across it with ORCA_USDC=<n> of the market's devnet USDC (75 by default, from Circle's faucet) and as much SOL; ON_FORK=1 refuses any endpoint but a local fork. Each step but pools is safe to run again; VAULT_CHAIN=<name> for one chain (NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "testnet-market is for the testnets (NETWORK={{.NETWORK}})."
      - sh: '[ -n "${SHONIN_TESTNET_EVM_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_EVM_MNEMONIC is empty in .env: the funder and the market's account are its keys."
    cmds:
      - task: :contracts:build
      # Built with the devnet ids: Orca's pool and dollar are the ones the
      # devnet build of the driver lists.
      - >-
        {{.DEVNET_SOLANA}} {{.VAULT_CHAIN_ARG}} testnet-market-setup
        --steps {{.STEPS | default "feeds,gas,inventory"}}
        {{if .GAS}}--gas {{.GAS}}{{end}}
        {{if .STOCK_TOKENS}}--stock-tokens {{.STOCK_TOKENS}}{{end}}
        {{if .WETH}}--weth {{.WETH}}{{end}}
        {{if .USDC}}--usdc {{.USDC}}{{end}}
        {{if .POOL_TOKENS}}--pool-tokens {{.POOL_TOKENS}}{{end}}
        {{if .PROPOSE}}--propose{{end}}
        {{if .SOL}}--sol {{.SOL}}{{end}}
        {{if .ORCA_USDC}}--orca-usdc {{.ORCA_USDC}}{{end}}
        {{if .ON_FORK}}--on-fork{{end}}

  testnet-market:
    desc: "Run testnet-market here, with its key derived from the mnemonic: every EVERY seconds (60) the mainnet feeds posted to their mirrors and every testnet pool brought to its feed's price (DRY_RUN=1 sends nothing, ONCE=1 runs one round, ONLY=evm:<id> keeps one chain; NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "testnet-market keeps the testnets' pools alone (NETWORK={{.NETWORK}})."
    cmds:
      - >-
        cargo run -p shonin-testnet-market --features devnet --
        --network "{{.NETWORK}}"
        --chains "{{.PATH_CHAINS}}"
        --deployments-dir "{{.PATH_DEPLOYMENTS_DIR}}"
        {{if .EVERY}}--every {{.EVERY}}{{end}}
        {{if .ONLY}}--only {{.ONLY}}{{end}}
        {{if .DRY_RUN}}--dry-run{{end}}
        {{if .ONCE}}--once{{end}}

  hyperliquid-vaults:
    desc: "On Hyperliquid testnet: the Hyperliquid driver deployed and proposed as hyperliquid on HyperEVM's registry (a generation already in HyperEVM's USDC needs nothing more; an older one gets a USDC factory beside it), recorded as hyperliquid-998.json; with AGENT=<agent dir> (and API_URL=<the API>, the testnet's by default) that agent is then published, activated with a USDC tank, a depositor's DEPOSIT dollars (the factory's least by default; mm-quoter needs about 650) sent home from the funder's HyperCore balance and deposited, the station's HyperCore account funded with STATION_DOLLARS (30) from the funder, TRADE_MINUTES (10) of trading watched, then a claim booked and paid; the services that serve it are the network's own (the cloud's), none here. Each step is recorded beside the deployment and skipped when run again (NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "Hyperliquid's real book is on the testnet alone (NETWORK={{.NETWORK}})."
      - sh: '[ -n "${SHONIN_TESTNET_EVM_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_EVM_MNEMONIC is empty in .env: the funder, the author and the depositor are its keys."
    vars:
      HL_API: '{{.API_URL | default .URL_API_TESTNET}}'
    cmds:
      - task: :contracts:build
      - >-
        {{.DEVNET}} --vault-chain hyperliquid hyperliquid-vaults
        {{if .AGENT}}--api "{{.HL_API}}" --agent "{{.AGENT}}"{{end}}
        {{if .DEPOSIT}}--deposit {{.DEPOSIT}}{{end}}
        {{if .STATION_DOLLARS}}--station-dollars {{.STATION_DOLLARS}}{{end}}
        {{if .TRADE_MINUTES}}--trade-minutes {{.TRADE_MINUTES}}{{end}}

  fund-wallet:
    desc: "Top a person's own wallet up on the testnets to try the app's money flows: DOLLARS of the chain's dollar where anyone may mint it (the Robinhood Chain testnet's USDG, by the funder; Circle's USDC comes from its faucet alone), and with GAS=1 the chain's coin up to the funding file's default, from the funder and never past its reserve. On the Hyperliquid testnet (HyperEVM) the dollars are HyperEVM's USDC sent home from the funder's HyperCore balance, and the HYPE the funder's HyperEVM balance above its reserve can't cover is bought on HyperCore (at no more than the funding file's max_price) and brought across first; VAULT_CHAIN=<name> for one chain. Safe to run again (ADDRESS=<address> DOLLARS=<n> [GAS=1]; NETWORK=testnet only)"
    requires:
      vars: [ADDRESS]
    cmds:
      - "{{.DEVNET_SOLANA}} {{.VAULT_CHAIN_ARG}} fund-wallet --address {{shellQuote .ADDRESS}} --dollars {{.DOLLARS | default 0}} {{if .GAS}}--gas{{end}}"

  root-key:
    desc: "Print the root key's record on the network's canonical chain (`root` in config/chains.toml): its signer, when and through which checker it was recorded, its image and project, and whether it is live (local, or NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} root-key"

  clear-root-key:
    desc: "Clear the root key's record on the network's canonical chain, as the admin, and print the signer cleared: for a root that is lost (its executor replaced) or to rotate it. That signer is refused for good; the executor then makes a new root and the keeper records it, and everything sealed to the old one must be sealed again (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} clear-root-key"

  smoke:
    desc: "The smoke check a deploy ends with, read-only: each EVM chain's deployment read back from the chain (or only VAULT_CHAIN=<name>'s), and with API=<url> the API's health, each of those chains served with a fresh reading, and a vault priced (ALLOW_NO_VAULT=1 before any is). Fails if any check does (local, or NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} {{.VAULT_CHAIN_ARG}} smoke {{if .API}}--api {{.API}}{{end}} {{if .ALLOW_NO_VAULT}}--allow-no-vault{{end}}"
