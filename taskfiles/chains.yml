# The local chains: three anvils standing in for the EVM vault chains (base,
# hyperliquid, robinhood) and one Solana cluster (Surfpool). Their ids and ports match
# the `local` network in config/chains.toml.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  # The local chains exist only on the local network; on a public one there
  # is nothing to start.
  ONLY_LOCAL: >-
    if [ "{{.NETWORK}}" != "local" ]; then
    echo "NETWORK={{.NETWORK}} uses public chains: no local chain to start";
    exit 0; fi

tasks:
  default:
    desc: "Every local chain: three anvils and a Solana cluster"
    deps: [evm, solana]

  evm:
    desc: "Three anvils, standing in for base, hyperliquid and robinhood"
    deps:
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_BASE}}", CHAIN_ID: "{{.CHAIN_ID_EVM_BASE}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_HYPERLIQUID}}", CHAIN_ID: "{{.CHAIN_ID_EVM_HYPERLIQUID}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_ROBINHOOD}}", CHAIN_ID: "{{.CHAIN_ID_EVM_ROBINHOOD}}" }

  anvil:
    internal: true
    cmds:
      # Quiet, because three of them would drown everything else; the
      # dashboard shows each chain's head and time.
      - |
        {{.ONLY_LOCAL}}
        exec anvil --port {{.PORT}} --chain-id {{.CHAIN_ID}} --block-time 1 \
          --accounts 10 --balance 10000 --host 127.0.0.1 --silent

  solana:
    desc: "A Solana cluster (Surfpool, offline), fresh each time; the devnet deploys to it and drives its clock"
    cmds:
      # Offline: nothing is fetched from a public cluster, so every account
      # on it is one the devnet put there. Surfpool's clock can be moved,
      # which is how the devnet runs it an hour a second as it runs the
      # anvils'.
      - |
        {{.ONLY_LOCAL}}
        rm -rf "{{.PATH_SOLANA_LEDGER}}"
        mkdir -p "{{.PATH_SOLANA_LEDGER}}"
        cd "{{.PATH_SOLANA_LEDGER}}"
        exec "{{.SURFPOOL}}" start --offline --no-tui --no-studio --no-deploy -y \
          --host 127.0.0.1 --port {{.PORT_SOLANA_RPC}} --ws-port {{.PORT_SOLANA_WS}} \
          --log-path ./logs --log-level warn

  deploy:
    desc: "Deploy the EVM contracts to every EVM chain of the network, and locally the Solana programs (local, or NETWORK=testnet; mainnet refuses)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET}} deploy"

  accounts:
    desc: "Each role's account and gas on every EVM chain, and the Solana deployer: what to fund on a testnet"
    cmds:
      - "{{.DEVNET}} accounts"
