# The local chains: three anvils standing in for the EVM vault chains (base,
# hyperliquid, robinhood) and one Solana cluster (Surfpool). Their ids and ports match
# the `local` network in config/chains.toml.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  # The local chains exist only on the local network; on a public one there
  # is nothing to start.
  ONLY_LOCAL: >-
    if [ "{{.NETWORK}}" != "local" ]; then
    echo "NETWORK={{.NETWORK}} uses public chains: no local chain to start";
    exit 0; fi

tasks:
  default:
    desc: "Every local chain: three anvils and a Solana cluster"
    deps: [evm, solana]

  evm:
    desc: "Three anvils, standing in for base, hyperliquid and robinhood"
    deps:
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_BASE}}", CHAIN_ID: "{{.CHAIN_ID_EVM_BASE}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_HYPERLIQUID}}", CHAIN_ID: "{{.CHAIN_ID_EVM_HYPERLIQUID}}" }
      - task: anvil
        vars: { PORT: "{{.PORT_EVM_ROBINHOOD}}", CHAIN_ID: "{{.CHAIN_ID_EVM_ROBINHOOD}}" }

  anvil:
    internal: true
    cmds:
      # Quiet, because three of them would drown everything else; the
      # dashboard shows each chain's head and time.
      - |
        {{.ONLY_LOCAL}}
        exec anvil --port {{.PORT}} --chain-id {{.CHAIN_ID}} --block-time 1 \
          --accounts 10 --balance 10000 --host 127.0.0.1 --silent

  solana:
    desc: "A Solana cluster (Surfpool, offline), fresh each time; the devnet deploys to it and drives its clock"
    cmds:
      # Offline: nothing is fetched from a public cluster, so every account
      # on it is one the devnet put there. Surfpool's clock can be moved,
      # which is how the devnet runs it an hour a second as it runs the
      # anvils'.
      - |
        {{.ONLY_LOCAL}}
        rm -rf "{{.PATH_SOLANA_LEDGER}}"
        mkdir -p "{{.PATH_SOLANA_LEDGER}}"
        cd "{{.PATH_SOLANA_LEDGER}}"
        exec "{{.SURFPOOL}}" start --offline --no-tui --no-studio --no-deploy -y \
          --host 127.0.0.1 --port {{.PORT_SOLANA_RPC}} --ws-port {{.PORT_SOLANA_WS}} \
          --log-path ./logs --log-level warn

  deploy:
    desc: "Deploy the EVM contracts to every EVM chain of the network, and locally the Solana programs (local, or NETWORK=testnet; mainnet refuses)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET}} deploy"

  solana-setup:
    desc: "Set Solana devnet up from the programs task contracts:solana:deploy NETWORK=testnet deployed: every role funded by transfer from the deployer (config/funding.toml), the dollar's mint at its fixed index of the team's mnemonic, the registry (no timelock, the development checker), the operator's project, the stand-in driver and the venue's markets, every role's dollar account, then deployments/solana-devnet.json with the roles. No image is proposed: propose the real digests with task chains:image. Safe to run again (NETWORK=testnet)"
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "The Solana set-up is for devnet (NETWORK=testnet); the local cluster is set up with the chains (NETWORK={{.NETWORK}})."
      - sh: '[ -n "${SHONIN_TESTNET_SOLANA_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_SOLANA_MNEMONIC is empty in .env: the roles and the deployer are its keys."
    cmds:
      - "{{.DEVNET_SOLANA}} --vault-chain solana solana-setup --project {{.GCP_PROJECT_TESTNET}}"

  accounts:
    desc: "Each role's account and gas on every EVM chain, the funders and what they need, and on Solana devnet the deployer (its funder), each role's SOL and what it is short, the dollar's mint and the programs (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} accounts"

  checker:
    desc: "Propose the Confidential Space checker beside the development checker on every EVM chain of the network (the one named in the deployments directory's attestation-<chain>.json if it is on the chain, else a new one) and on its Solana cluster once set up (the checker program's account for the pinned guest and Google keys), SHONIN_VAULT_CHAIN=solana for Solana alone (local or NETWORK=testnet)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET_SOLANA}} propose-checker"

  image:
    desc: "Propose a real image digest on every chain's registry (each EVM chain's, and Solana's once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (DIGEST=sha256:<hex> KIND=executor|builder|reviewer|unwinder|holder; NETWORK=testnet); already proposed is done. Solana has no holder kind. The root key's test requester is proposed as KIND=reviewer: the canonical chain's registry is the one its exchange checks"
    requires:
      vars: [DIGEST, KIND]
    cmds:
      - "{{.DEVNET_SOLANA}} propose-image --digest {{.DIGEST}} --kind {{.KIND}}"

  revoke-image:
    desc: "Revoke an image digest on every chain's registry (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (DIGEST=sha256:<hex>; NETWORK=testnet); already revoked is done. Revoked takes effect at once and for good: keys blessed from it stop counting, and a root key recorded from it stops being live, on the chains revoked"
    requires:
      vars: [DIGEST]
    cmds:
      - "{{.DEVNET_SOLANA}} revoke-image --digest {{.DIGEST}}"

  project:
    desc: "Propose an operator's Google Cloud project (its keccak256) on every chain's registry (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin (PROJECT=<project id>; NETWORK=testnet); already proposed is done"
    requires:
      vars: [PROJECT]
    cmds:
      - "{{.DEVNET_SOLANA}} propose-project {{.PROJECT}}"

  retire-dev-checker:
    desc: "Retire the development checker on every chain (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, as the admin; refused where no other checker is allowed (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET_SOLANA}} retire-checker --dev"

  allow-dev-checker:
    desc: "Deploy and propose a fresh development checker on every chain (Solana's too, once it is set up), or only SHONIN_VAULT_CHAIN=<name>'s, for a publish only it can bless; retire it again after (NETWORK=testnet)"
    cmds:
      - task: :contracts:build
      - "{{.DEVNET_SOLANA}} allow-dev-checker"

  fund:
    desc: "Top every role up on every EVM testnet from the funder, buying HYPE on HyperCore for HyperEVM; safe to run again (NETWORK=testnet only)"
    cmds:
      - "{{.DEVNET}} fund"

  root-key:
    desc: "Print the root key's record on the network's canonical chain (`root` in config/chains.toml): its signer, when and through which checker it was recorded, its image and project, and whether it is live (local, or NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} root-key"

  clear-root-key:
    desc: "Clear the root key's record on the network's canonical chain, as the admin, and print the signer cleared: for a root that is lost (its executor replaced) or to rotate it. That signer is refused for good; the executor then makes a new root and the keeper records it, and everything sealed to the old one must be sealed again (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} clear-root-key"

  market:
    desc: "On the testnets, play the stand-in venue's market in real time as its operator, signed from the mnemonic on this machine (never in the cloud): every EVERY_MINUTES (10 by default) one post per chain of both markets' prices and the funding accrued since the last, from a tape like bitcoin's (spot about 0.6% an hour; funding about 10% a year, near 0.000295 a day outside a lull, sinking towards nothing for 8 hours about once every 4 days), minting the venue whatever its accounts are owed beyond what it holds. Resumable: it starts from the venue's prices. Every EVM testnet, or VAULT_CHAIN=<name>; logs each post's gas and the coin a day it comes to (NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} {{.VAULT_CHAIN_ARG}} market {{if .EVERY_MINUTES}}--every-minutes {{.EVERY_MINUTES}}{{end}}"

  smoke:
    desc: "The smoke check a deploy ends with, read-only: each EVM chain's deployment read back from the chain (or only VAULT_CHAIN=<name>'s), and with API=<url> the API's health, each of those chains served with a fresh reading, and a vault priced (ALLOW_NO_VAULT=1 before any is). Fails if any check does (local, or NETWORK=testnet)"
    cmds:
      - "{{.DEVNET}} {{.VAULT_CHAIN_ARG}} smoke {{if .API}}--api {{.API}}{{end}} {{if .ALLOW_NO_VAULT}}--allow-no-vault{{end}}"
