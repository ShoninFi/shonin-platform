# The frontends:
# - app: Rust -> wasm via Trunk (packages/frontend/app). Deployed as the
#   shonin-app Worker at app.shonin.fi, and for now also as shonin-landing at
#   shonin.fi, until the marketing site takes that.
# - marketing: static pages generated by a native binary
#   (packages/frontend/marketing). Its Worker, shonin-marketing, has no
#   public hostname yet.
# - ui: the design tokens both of them read (packages/frontend/ui).
# Each Worker is configured in cloudflare/<name>/wrangler.jsonc. The deploy
# tasks take the account API token from .env, never a global `wrangler login`;
# wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment directly.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  tokens:
    desc: "Write the design tokens as CSS (packages/frontend/ui/dist/tokens.css)"
    sources:
      - "{{.PATH_PACKAGE_UI}}/tokens.json"
      - "{{.PATH_PACKAGE_UI}}/src/**/*.rs"
    generates:
      - "{{.PATH_TOKENS_CSS}}"
    cmds:
      - cargo run -q -p shonin-ui --bin tokens -- --out "{{.PATH_TOKENS_CSS}}"

  # The app ------------------------------------------------------------------

  app:dev:
    desc: "The app: Trunk dev server with live reload, proxying /api to the local API"
    deps: [tokens]
    cmds:
      - >-
        cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk serve
        --port {{.PORT_APP_DEV}}
        --dist "{{.PATH_DIST_APP_DEV}}"
        --proxy-backend "{{.URL_API_DEV}}/api/"
        --watch "{{.PATH_ROOT_CARGO_TOML}}"
        --watch "{{.PATH_PACKAGE_SHARED}}"
        --watch "{{.PATH_PACKAGE_CHAIN}}"
        --watch "{{.PATH_PACKAGE_UI}}/dist"
        --watch .

  app:build:
    desc: "The app: release build into .trunk-dist/app"
    # Once per run, so `task deploy` builds the dist both Workers serve once.
    run: once
    deps: [tokens]
    vars:
      SEO_API_ARG: '{{if .API}}--api "{{.API}}"{{end}}'
    cmds:
      - cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk clean --dist "{{.PATH_DIST_APP}}"
      - cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk build --release --dist "{{.PATH_DIST_APP}}"
      # Per-route HTML (with 404.html), sitemap.xml and robots.txt, from src/route.rs.
      # Pass API=<url> to pre-render the pages that need data from a running API.
      - cargo run -q -p shonin-app --bin seo -- --dist "{{.PATH_DIST_APP}}" --base-url "{{.URL_SITE_PROD}}" {{.SEO_API_ARG}}

  app:deploy:
    desc: "Build the app and deploy it as shonin-app, at app.shonin.fi"
    requires:
      vars: [CLOUDFLARE_DEPLOY_WORKERS_TOKEN, CLOUDFLARE_ACCOUNT_ID]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_WORKERS_TOKEN}}"
    cmds:
      - task: app:build
      - npx wrangler deploy -c "{{.PATH_WRANGLER_APP}}"

  landing:deploy:
    desc: "Build the app and deploy it as shonin-landing, at shonin.fi (until the marketing site takes it)"
    requires:
      vars: [CLOUDFLARE_DEPLOY_WORKERS_TOKEN, CLOUDFLARE_ACCOUNT_ID]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_WORKERS_TOKEN}}"
    cmds:
      - task: app:build
      - npx wrangler deploy -c "{{.PATH_WRANGLER_LANDING}}"

  # The marketing site ------------------------------------------------------

  marketing:dev:
    desc: "The marketing site, built and served locally (rerun after a change)"
    deps: [tokens]
    cmds:
      - >-
        cargo run -q -p shonin-marketing -- serve
        --out "{{.PATH_DIST_MARKETING_DEV}}"
        --app-url "{{.URL_APP_DEV}}"
        --docs-url "{{.URL_DOCS_PROD}}"
        --port {{.PORT_MARKETING_DEV}}

  marketing:build:
    desc: "The marketing site: build into .trunk-dist/marketing"
    deps: [tokens]
    cmds:
      - >-
        cargo run -q -p shonin-marketing -- build
        --out "{{.PATH_DIST_MARKETING}}"
        --app-url "{{.URL_APP_PROD}}"
        --docs-url "{{.URL_DOCS_PROD}}"

  marketing:deploy:
    desc: "Build the marketing site and deploy it as shonin-marketing (workers.dev only; not part of `task deploy`)"
    requires:
      vars: [CLOUDFLARE_DEPLOY_WORKERS_TOKEN, CLOUDFLARE_ACCOUNT_ID]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_WORKERS_TOKEN}}"
    cmds:
      - task: marketing:build
      - npx wrangler deploy -c "{{.PATH_WRANGLER_MARKETING}}"

  # Everything ----------------------------------------------------------------

  build:
    desc: "Release builds of the app and the marketing site"
    cmds:
      - task: app:build
      - task: marketing:build

  deploy:
    desc: "Deploy the app to app.shonin.fi and shonin.fi (the marketing site is deployed on its own)"
    cmds:
      - task: app:deploy
      - task: landing:deploy
