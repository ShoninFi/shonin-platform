# The frontends:
# - app: Rust -> wasm via Trunk (packages/frontend/app). Deployed as the
#   shonin-app Worker at app.shonin.fi.
# - marketing: static pages generated by a native binary
#   (packages/frontend/marketing). Deployed as the shonin-landing Worker at
#   shonin.fi.
# - ui: the design tokens both of them read (packages/frontend/ui).
# Each Worker is configured in cloudflare/<name>/wrangler.jsonc. The deploy
# tasks take the account API token from .env, never a global `wrangler login`;
# wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment directly.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

tasks:
  tokens:
    desc: "Write the design system for both sites: tokens, fonts, the sh-* stylesheets and the logos (packages/frontend/ui/dist)"
    sources:
      - "{{.PATH_PACKAGE_UI}}/tokens.json"
      - "{{.PATH_PACKAGE_UI}}/src/**/*.rs"
      - "{{.PATH_PACKAGE_UI}}/styles/*.css"
      - "{{.PATH_PACKAGE_UI}}/fonts/*"
      - "{{.PATH_PACKAGE_UI}}/logos/*.svg"
    generates:
      - "{{.PATH_TOKENS_CSS}}"
      - "{{.PATH_PACKAGE_UI}}/dist/fonts.css"
      - "{{.PATH_PACKAGE_UI}}/dist/sh.css"
    cmds:
      - cargo run -q -p shonin-ui --bin tokens -- --out "{{.PATH_PACKAGE_UI}}/dist"

  # The app ------------------------------------------------------------------

  app:dev:
    desc: "The app: Trunk dev server with live reload and the dev-only pages (/_atoms), proxying /api to the local API (API=<url> to proxy another, e.g. the testnet API)"
    # Solana program ids: the local deploy keypairs' against the local API;
    # with API=<url> (the testnet API) the devnet ids (the `devnet` feature).
    deps: [tokens]
    cmds:
      - >-
        cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk serve
        --port {{.PORT_APP_DEV}}
        --dist "{{.PATH_DIST_APP_DEV}}"
        --features dev,dev-wallet{{if .API}},devnet{{end}}
        --proxy-backend "{{.API | default .URL_API_DEV}}/api/"
        --watch "{{.PATH_ROOT_CARGO_TOML}}"
        --watch "{{.PATH_PACKAGE_SHARED}}"
        --watch "{{.PATH_PACKAGE_CHAIN}}"
        --watch "{{.PATH_PACKAGE_UI}}/dist"
        --watch .

  app:build:
    desc: "The app: release build into .trunk-dist/app, pre-rendered from the testnet API (API=<api base, ending /api> to pre-render from another)"
    # Once per run, so `task deploy` builds the dist both Workers serve once.
    run: once
    deps: [tokens]
    vars:
      API: '{{.API | default (printf "%s/api" .URL_API_TESTNET)}}'
      SEO_API_ARG: '{{if .API}}--api "{{.API}}"{{end}}'
    env:
      # The API's address, compiled into the app (public config, not a secret).
      SHONIN_APP_API: "{{.URL_API_TESTNET}}/api"
      # The network the build is for: a test network offers the
      # recovery-phrase wallet; a build that names none leaves it out.
      SHONIN_APP_NETWORK: testnet
    cmds:
      - cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk clean --dist "{{.PATH_DIST_APP}}"
      # The testnet build: the Solana programs' devnet ids.
      - cd "{{.PATH_PACKAGE_APP}}" && NO_COLOR=true trunk build --release --dist "{{.PATH_DIST_APP}}" --features devnet
      # Per-route HTML (with 404.html), sitemap.xml and robots.txt, from src/route.rs.
      # Pass API=<url> to pre-render the pages that need data from another API.
      # It also moves Trunk's inline loader into a file and writes _headers'
      # Content-Security-Policy, naming the compiled-in API origin and the
      # public RPC origins of the testnet's chains in config/chains.toml.
      - >-
        cargo run -q -p shonin-app --bin seo --
        --dist "{{.PATH_DIST_APP}}"
        --base-url "{{.URL_APP_PROD}}"
        --app-api "{{.URL_API_TESTNET}}/api"
        --chains "{{.PATH_CHAINS}}"
        --network testnet
        {{.SEO_API_ARG}}
      # The development wallet's phrase is compiled in only by the
      # `dev-wallet` feature, which this build never turns on: refuse a dist
      # that carries it whole, or any two of its words in a row. Binary-safe,
      # so the wasm is read too. Prints only pass or fail, never a word.
      - cmd: |
          phrase="${SHONIN_DEV_WALLET_MNEMONIC:-}"
          if [ -z "$phrase" ] && [ -f "{{.PATH_ROOT}}/.env" ]; then
            phrase="$(grep -E '^SHONIN_DEV_WALLET_MNEMONIC=' "{{.PATH_ROOT}}/.env" | head -n 1 | cut -d= -f2- | tr -d "\"'")"
          fi
          found=0
          if [ -n "$phrase" ]; then
            if grep -r -a -F -q -- "$phrase" "{{.PATH_DIST_APP}}"; then found=1; fi
            previous=""
            for word in $phrase; do
              if [ -n "$previous" ] && grep -r -a -F -q -- "$previous $word" "{{.PATH_DIST_APP}}"; then found=1; fi
              previous="$word"
            done
          fi
          if [ "$found" -ne 0 ]; then
            echo "app dist phrase check: FAIL"
            exit 1
          fi
          echo "app dist phrase check: pass"
        silent: true

  app:deploy:
    desc: "Build the app and deploy it as shonin-app, at app.shonin.fi"
    requires:
      vars: [CLOUDFLARE_DEPLOY_WORKERS_TOKEN, CLOUDFLARE_ACCOUNT_ID]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_WORKERS_TOKEN}}"
    cmds:
      - task: app:build
      - npx wrangler deploy -c "{{.PATH_WRANGLER_APP}}"

  landing:deploy:
    desc: "Build the marketing site and deploy it as shonin-landing, at shonin.fi"
    requires:
      vars: [CLOUDFLARE_DEPLOY_WORKERS_TOKEN, CLOUDFLARE_ACCOUNT_ID]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_WORKERS_TOKEN}}"
    cmds:
      - task: marketing:build
      - npx wrangler deploy -c "{{.PATH_WRANGLER_LANDING}}"

  # The marketing site ------------------------------------------------------

  marketing:dev:
    desc: "The marketing site, built and served locally (rerun after a change)"
    deps: [tokens]
    cmds:
      - >-
        cargo run -q -p shonin-marketing -- serve
        --out "{{.PATH_DIST_MARKETING_DEV}}"
        --app-url "{{.URL_APP_DEV}}"
        --docs-url "{{.URL_DOCS_PROD}}"
        --site-url "{{.URL_MARKETING_DEV}}"
        --port {{.PORT_MARKETING_DEV}}

  marketing:build:
    desc: "The marketing site: build into .trunk-dist/marketing, then check it carries no wallet or API code and no secret"
    deps: [tokens]
    cmds:
      - >-
        cargo run -q -p shonin-marketing -- build
        --out "{{.PATH_DIST_MARKETING}}"
        --app-url "{{.URL_APP_PROD}}"
        --docs-url "{{.URL_DOCS_PROD}}"
        --site-url "{{.URL_SITE_PROD}}"
      # shonin.fi is static: no wallet code and no API calls. Binary-safe, so
      # the fonts and logos are read too. The lowercase "solana" may appear
      # only as the address of Solana's mark (/assets/chains/solana.<hash>.svg);
      # any other use (window.solana, @solana/, a solana: URI) fails.
      - cmd: |
          mark='/assets/chains/solana\.[0-9a-f]{10}\.svg'
          found=$(grep -r -a -o -h -E "$mark|solana|ethereum|phantom|wallet_|testnet-api" "{{.PATH_DIST_MARKETING}}" | grep -v -x -E "$mark" || true)
          if [ -n "$found" ]; then
            echo "marketing dist check: FAIL (wallet or API code found)"
            exit 1
          fi
          echo "marketing dist check: pass (no wallet or API code)"
        silent: true
      # No .env value longer than 16 characters may reach the dist. The check
      # reads .env itself and prints only pass or fail, never a value.
      - cmd: |
          found=0
          if [ -f "{{.PATH_ROOT}}/.env" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              case "$line" in *=*) ;; *) continue ;; esac
              value="${line#*=}"
              value="${value%\"}"; value="${value#\"}"
              value="${value%\'}"; value="${value#\'}"
              if [ "${#value}" -gt 16 ] && grep -r -a -F -q -- "$value" "{{.PATH_DIST_MARKETING}}"; then
                found=1
              fi
            done < "{{.PATH_ROOT}}/.env"
          fi
          if [ "$found" -ne 0 ]; then
            echo "marketing dist secret check: FAIL"
            exit 1
          fi
          echo "marketing dist secret check: pass"
        silent: true

  # Everything ----------------------------------------------------------------

  build:
    desc: "Release builds of the app and the marketing site"
    cmds:
      - task: app:build
      - task: marketing:build

  deploy:
    desc: "Deploy the app to app.shonin.fi (shonin-app) and the marketing site to shonin.fi (shonin-landing)"
    cmds:
      - task: app:deploy
      - task: landing:deploy
