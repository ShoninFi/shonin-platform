# The machines and services, and the devnet that drives the local chains
# (taskfiles/chains.yml starts those). Every service retries until its chain
# answers and its deployment file exists, so they can all start at once.
#
# Each takes the network (NETWORK, from SHONIN_NETWORK; `local` by default)
# and serves every EVM vault chain of it, or only VAULT_CHAIN when it is set.
# The seed publishes to VAULT_CHAIN, or base; VAULT_CHAIN=solana seeds the
# local Solana cluster.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  # The devnet binary's features for the seed and the demo: on a testnet's
  # Solana cluster it sends to the programs, so it carries their committed
  # devnet ids (see DEVNET_SOLANA).
  SEED_FEATURES: '{{if and .VAULT_CHAIN (eq .NETWORK "testnet")}}{{if eq .VAULT_CHAIN "solana"}}--features devnet{{end}}{{end}}'
  # Every service takes the same arguments, so one variable carries them.
  SERVICE_ARGS: >-
    --network "{{.NETWORK}}"
    --chains "{{.PATH_CHAINS}}"
    --deployments-dir "{{.PATH_DEPLOYMENTS_DIR}}"
    {{.VAULT_CHAIN_ARG}}
    --store "{{.PATH_STORE}}"

tasks:
  devnet:
    desc: "The ops dashboard; on the local network it also deploys the contracts and programs and drives every chain"
    cmds:
      - >-
        cargo run -q -p shonin-devnet --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        --solana-programs "{{.PATH_SOLANA_PROGRAMS}}"
        --port {{.PORT_DEVNET}}
        --seconds-per-block {{.CHAIN_SECONDS_PER_BLOCK}}
        --service "app=http://127.0.0.1:{{.PORT_APP_DEV}}/"
        --service "marketing=http://127.0.0.1:{{.PORT_MARKETING_DEV}}/"
        --service "api=http://127.0.0.1:{{.PORT_API}}/health"
        --service "indexer=http://127.0.0.1:{{.PORT_INDEXER}}/health"
        --service "reviewer=http://127.0.0.1:{{.PORT_REVIEWER}}/health"
        --service "builder=http://127.0.0.1:{{.PORT_BUILDER}}/health"
        --service "executor=http://127.0.0.1:{{.PORT_EXECUTOR}}/health"
        --service "unwinder=http://127.0.0.1:{{.PORT_UNWINDER}}/health"
        --service "keeper=http://127.0.0.1:{{.PORT_KEEPER}}/health"
        --gcp-project "testnet={{.GCP_PROJECT_TESTNET}}"
        --gcp-project "mainnet={{.GCP_PROJECT_MAINNET}}"
        --gcp-region "{{.GCP_REGION}}"

  seed:
    desc: "Publish the reference work through the real flows (AGENT=name for just one; LIVE=1 then deposits and books and pays a claim on its vault; PUBLISH_ONLY=1 publishes AGENT and stops; STRATEGY=<id> runs the live part on a registered strategy; TAKE_ON_SECONDS=<s>, 180 by default; API_URL=<url> for a remote API). VAULT_CHAIN=solana publishes on Solana: through the API and the services everywhere but the local cluster's full seed, an agent's own solana/ copy if it has one"
    vars:
      SEED_API: '{{.API_URL | default .URL_API_DEV}}'
      AGENT_ARG: >-
        {{if .STRATEGY}}--strategy {{.STRATEGY}}{{else}}{{if .AGENT}}--agent "{{.AGENT}}"{{end}}{{if .LIVE}} --live{{end}}{{if .PUBLISH_ONLY}} --publish-only{{end}}{{end}}
        {{if .TAKE_ON_SECONDS}}--take-on-seconds {{.TAKE_ON_SECONDS}}{{end}}
    cmds:
      - >-
        cargo run -q -p shonin-devnet {{.SEED_FEATURES}} --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        seed --api "{{.SEED_API}}" {{.AGENT_ARG}}

  demo:
    desc: "A demo that pays its own way on VAULT_CHAIN: a fresh vault for AGENT (funding-basis by default; published again, or STRATEGY=<id> published with PUBLISH_ONLY=1 and never activated), activated at the modest allowances with its tank filled to and kept at TANK_DAYS (30) days of the daily cap by auto-fill, a depositor's DEPOSIT dollars (25000) in and at work within WORK_MINUTES (30), then left running; prints the vault and how to watch it. Needs the market operator posting (task chains:market) and the services up; TAKE_ON_SECONDS=<s>; API_URL=<url> for a remote API"
    vars:
      SEED_API: '{{.API_URL | default .URL_API_DEV}}'
      DEMO_ARGS: >-
        {{if .AGENT}}--agent "{{.AGENT}}"{{end}}
        {{if .STRATEGY}}--strategy {{.STRATEGY}}{{end}}
        {{if .DEPOSIT}}--deposit {{.DEPOSIT}}{{end}}
        {{if .TANK_DAYS}}--tank-days {{.TANK_DAYS}}{{end}}
        {{if .WORK_MINUTES}}--work-minutes {{.WORK_MINUTES}}{{end}}
        {{if .TAKE_ON_SECONDS}}--take-on-seconds {{.TAKE_ON_SECONDS}}{{end}}
    cmds:
      - >-
        cargo run -q -p shonin-devnet {{.SEED_FEATURES}} --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        demo --api "{{.SEED_API}}" {{.DEMO_ARGS}}

  economics:
    desc: "Whether VAULT pays its own way, read from the chain alone (sends nothing): value and share price, the tank (balance, kept at, usage collected), the allowances and their daily cost, the fees owed and the high-water mark, the author's shares and their worth, the gas the vault's key and the keeper spent on it over HOURS (6) priced at the testnet's $0 and at a mainnet-like COIN_USD (ETH 2500, HYPE 25), the keeper's sends an hour, and a day projected: the bill against the author's fee at the funding quoted now and at the market's 10% a year, and the break-even deposit. CARRY_SHARE=<0..1> projects with that share short; JSON=1 for JSON (VAULT=<address> VAULT_CHAIN=<name>)"
    requires:
      vars: [VAULT]
    cmds:
      - >-
        cargo run -q -p shonin-devnet --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        economics --vault {{.VAULT}}
        {{if .HOURS}}--hours {{.HOURS}}{{end}}
        {{if .COIN_USD}}--coin-usd {{.COIN_USD}}{{end}}
        {{if .CARRY_SHARE}}--carry-share {{.CARRY_SHARE}}{{end}}
        {{if .JSON}}--json{{end}}

  api:
    desc: "The web app's API, running the indexer in-process"
    cmds:
      - >-
        cargo run -q -p shonin-api --
        {{.SERVICE_ARGS}}
        --port {{.PORT_API}}
        --internal-port {{.PORT_API_INTERNAL}}
        --builder-url "{{.URL_BUILDER_DEV}}"
        --executor-url "{{.URL_EXECUTOR_DEV}}"

  indexer:
    desc: "The reference indexer on its own: reads the chain into the record"
    cmds:
      - >-
        cargo run -q -p shonin-indexer --
        {{.SERVICE_ARGS}}
        --port {{.PORT_INDEXER}}
        --builder-url "{{.URL_BUILDER_DEV}}"

  builder:
    desc: "The build service (STATE=1 keeps its state on the API's internal port, as in the cloud; IDLE_EXIT=<seconds> makes it exit once idle that long)"
    vars:
      MACHINE_ARGS: '{{if .STATE}}--state-url "{{.URL_API_INTERNAL_DEV}}"{{end}} {{if .IDLE_EXIT}}--idle-exit-seconds {{.IDLE_EXIT}}{{end}}'
    cmds:
      - >-
        test -d "{{.PATH_VENDOR}}" ||
        cargo run -q -p shonin-builder -- --vendor-into "{{.PATH_VENDOR}}"
      - >-
        cargo run -q -p shonin-builder --
        {{.SERVICE_ARGS}}
        --port {{.PORT_BUILDER}}
        --builds "{{.PATH_BUILDS}}"
        --sdk "{{.PATH_PACKAGE_SDK}}"
        --vendor "{{.PATH_VENDOR}}"
        --reviewer-url "{{.URL_REVIEWER_DEV}}"
        {{.MACHINE_ARGS}}

  reviewer:
    desc: "The reviewer (STATE=1 keeps its state on the API's internal port, as in the cloud; IDLE_EXIT=<seconds> makes it exit once idle that long)"
    vars:
      MACHINE_ARGS: '{{if .STATE}}--state-url "{{.URL_API_INTERNAL_DEV}}"{{end}} {{if .IDLE_EXIT}}--idle-exit-seconds {{.IDLE_EXIT}}{{end}}'
    cmds:
      - >-
        cargo run -q -p shonin-reviewer --bin reviewer --
        {{.SERVICE_ARGS}}
        --port {{.PORT_REVIEWER}}
        {{.MACHINE_ARGS}}

  calibrate:
    desc: "Compare the prose reviewer with the battery (PROJECTS=dir... [INJECTION=1])"
    vars:
      INJECTION: '{{if .INJECTION}}--injection{{end}}'
    cmds:
      # Development tooling, not a service. Neither model is required: without
      # them it prints the battery it would ask and stops. Point PROJECTS at
      # the strategies to review, or set SHONIN_AGENTS_DIR and it reads the
      # agents in that checkout.
      - |
        projects="{{.PROJECTS}}"
        if [ -z "$projects" ] && [ -n "${SHONIN_AGENTS_DIR:-}" ]; then
          projects=$(find "${SHONIN_AGENTS_DIR}/packages/agents" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | tr '\n' ' ')
        fi
        cargo run -q -p shonin-reviewer --bin calibrate -- {{.INJECTION}} $projects

  executor:
    desc: "The executor"
    cmds:
      - >-
        cargo run -q -p shonin-executor --
        {{.SERVICE_ARGS}}
        --port {{.PORT_EXECUTOR}}
        --api-url "{{.URL_API_DEV}}"
        --attestation development

  unwinder:
    desc: "The unwinder"
    cmds:
      - >-
        cargo run -q -p shonin-unwinder --
        {{.SERVICE_ARGS}}
        --port {{.PORT_UNWINDER}}
        --api-url "{{.URL_API_DEV}}"

  keeper:
    desc: "The keeper: collects bills, values and settles, serves claims, stops and closes halted vaults, relays the executor's blessings and stocks its keys with gas"
    cmds:
      - >-
        cargo run -q -p shonin-keeper --
        {{.SERVICE_ARGS}}
        --port {{.PORT_KEEPER}}
        --api-url "{{.URL_API_DEV}}"
        --executor-url "{{.URL_EXECUTOR_DEV}}"
