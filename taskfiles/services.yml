# The local development stack: a chain, the contracts on it, and each service
# that reads or writes them. Every service retries until the chain answers and
# the deployment file exists, so they can all start at once.
#
# Commands `cd` explicitly rather than using `dir:`, so absolute templated
# paths behave the same in included taskfiles.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  # Every service takes the same three arguments, so one variable carries them.
  SERVICE_ARGS: >-
    --rpc-url "{{.URL_CHAIN_DEV}}"
    --deployments "{{.PATH_DEPLOYMENTS}}"
    --store "{{.PATH_STORE}}"

tasks:
  chain:
    desc: "Anvil: the local development chain"
    cmds:
      - >-
        anvil
        --port {{.PORT_CHAIN}}
        --chain-id {{.CHAIN_ID_LOCAL}}
        --block-time 1
        --accounts 10
        --balance 10000
        --host 127.0.0.1

  devnet:
    desc: "Deploy the contracts, then drive the chain's clock and its market"
    cmds:
      - >-
        cargo run -q -p shonin-devnet --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        --port {{.PORT_DEVNET}}
        --seconds-per-block {{.CHAIN_SECONDS_PER_BLOCK}}

  deploy:
    desc: "Deploy the contracts to the local chain and write the deployment file"
    cmds:
      - >-
        cargo run -q -p shonin-devnet --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        deploy

  seed:
    desc: "Publish the reference work to the local chain, through the real flows"
    cmds:
      - >-
        cargo run -q -p shonin-devnet --
        {{.SERVICE_ARGS}}
        --artifacts "{{.PATH_ARTIFACTS}}"
        seed --api "{{.URL_API_DEV}}"

  indexer:
    desc: "The indexer and the public API"
    cmds:
      - >-
        cargo run -q -p shonin-indexer --
        {{.SERVICE_ARGS}}
        --port {{.PORT_API}}
        --builder-url "{{.URL_BUILDER_DEV}}"

  builder:
    desc: "The build service"
    cmds:
      - >-
        cargo run -q -p shonin-builder --
        {{.SERVICE_ARGS}}
        --port {{.PORT_BUILDER}}
        --builds "{{.PATH_BUILDS}}"
        --sdk "{{.PATH_PACKAGE_SDK}}"

  reviewer:
    desc: "The reviewer"
    cmds:
      - >-
        cargo run -q -p shonin-reviewer --
        {{.SERVICE_ARGS}}
        --port {{.PORT_REVIEWER}}

  calibrate:
    desc: "Compare the prose reviewer with the battery (PROJECTS=dir... [INJECTION=1])"
    vars:
      INJECTION: '{{if .INJECTION}}--injection{{end}}'
    cmds:
      # Development tooling, not a service. Neither model is required: without
      # them it prints the battery it would ask and stops. Point PROJECTS at
      # the strategies to review, or set SHONIN_AGENTS_DIR and it reads the
      # agents in that checkout.
      - |
        projects="{{.PROJECTS}}"
        if [ -z "$projects" ] && [ -n "${SHONIN_AGENTS_DIR:-}" ]; then
          projects=$(find "${SHONIN_AGENTS_DIR}/packages/agents" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | tr '\n' ' ')
        fi
        cargo run -q -p shonin-reviewer --bin calibrate -- {{.INJECTION}} $projects

  executor:
    desc: "The executor"
    cmds:
      - >-
        cargo run -q -p shonin-executor --
        {{.SERVICE_ARGS}}
        --port {{.PORT_EXECUTOR}}
        --api-url "{{.URL_API_DEV}}"

  coordinator:
    desc: "The coordinator"
    cmds:
      - >-
        cargo run -q -p shonin-coordinator --
        {{.SERVICE_ARGS}}
        --port {{.PORT_COORDINATOR}}
        --api-url "{{.URL_API_DEV}}"
