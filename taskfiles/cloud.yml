# Google Cloud: building the images, pushing them, and running them.
#
# Two choices, made separately and always explicitly:
# - where the services run: here (`task dev`) or on Google Cloud (these tasks);
# - which chains they talk to: NETWORK=testnet or NETWORK=mainnet. The cloud
#   never runs against `local`.
# The project comes from NETWORK (GCP_PROJECT_TESTNET or GCP_PROJECT_MAINNET in
# config.yml), and every gcloud call passes --project, and --zone or --region
# where the resource has one, so nothing ever falls back to the gcloud default.
#
# The VMs of a network, all in GCP_ZONE:
# - shonin-executor-<network>: the executor, attested, on a Confidential Space
#   VM launched from its image's digest (the digest is what the attestation
#   measures). Its settings are baked into the image: nothing is passed to it
#   at launch.
# - shonin-builder-<network> and shonin-reviewer-<network>: the build service
#   and the reviewer, attested the same way, on demand: each exits once idle
#   and its VM powers off, and the waker starts it again when there is work.
# - shonin-services-<network>: a small plain VM (Container-Optimized OS)
#   running the API (the indexer inside), the keeper, the Cloudflare tunnel
#   that carries the API to its public name, and the waker that starts the
#   prover, the builder and the reviewer when they are wanted
#   (deploy/gcp/services).
# - shonin-prover-<network>: an on-demand VM that makes the attestation's proof
#   when woken and powers itself off when idle (deploy/gcp/prover).
# - shonin-testnet-market-testnet: the testnet alone; a small plain VM running
#   testnet-market, which keeps the testnets' pools at the mainnet feeds'
#   prices (deploy/gcp/testnet-market). Deleted when the testnets are.
version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true

vars:
  GCP_PROJECT: '{{if eq .NETWORK "testnet"}}{{.GCP_PROJECT_TESTNET}}{{else if eq .NETWORK "mainnet"}}{{.GCP_PROJECT_MAINNET}}{{end}}'
  GCP_REGISTRY: "{{.GCP_REGION}}-docker.pkg.dev/{{.GCP_PROJECT}}/{{.GCP_ARTIFACT_REPO}}"
  # The bucket Cloud Build reads a build's staged source from.
  GCP_CLOUDBUILD_BUCKET: "{{.GCP_PROJECT}}_cloudbuild"
  GIT_SHA:
    sh: git rev-parse --short=12 HEAD
  # The tag an image is built, pushed and launched under: the commit, unless
  # TAG names another.
  IMAGE_TAG: "{{.TAG | default .GIT_SHA}}"
  # The attested machines. `requester` is the root key service's test
  # requester, launched for a live exchange and deleted after.
  MACHINES: "reviewer builder executor unwinder requester"
  SERVICES: "api indexer keeper testnet-market"
  # B's image: the attestation's prover, run on its own VM, off when idle.
  PROVERS: "prover"
  # The VMs a network runs, by role: shonin-<role>-<network>.
  VMS: "executor services prover builder reviewer testnet-market"
  # The machines started on demand by the waker, and powered off when idle.
  ON_DEMAND: "builder reviewer"
  # The ports inside the VPC (fixed: the images bake them).
  CLOUD_PORT_API: "19081"
  CLOUD_PORT_API_INTERNAL: "19082"
  CLOUD_PORT_BUILDER: "19084"
  CLOUD_PORT_EXECUTOR: "19085"
  CLOUD_PORT_REVIEWER: "19086"
  CLOUD_PORT_KEEPER: "19087"
  CLOUD_PORT_TESTNET_MARKET: "19088"
  # Internal DNS names, so the images can name each other.
  GCP_INTERNAL: "{{.GCP_ZONE}}.c.{{.GCP_PROJECT}}.internal"
  CLOUD_URL_EXECUTOR: "http://shonin-executor-{{.NETWORK}}.{{.GCP_INTERNAL}}:{{.CLOUD_PORT_EXECUTOR}}"
  CLOUD_URL_API: "http://shonin-services-{{.NETWORK}}.{{.GCP_INTERNAL}}:{{.CLOUD_PORT_API}}"
  # The API's internal port: the builder's and the reviewer's state, their
  # built files, and their asks to be woken.
  CLOUD_URL_API_INTERNAL: "http://shonin-services-{{.NETWORK}}.{{.GCP_INTERNAL}}:{{.CLOUD_PORT_API_INTERNAL}}"
  CLOUD_URL_BUILDER: "http://shonin-builder-{{.NETWORK}}.{{.GCP_INTERNAL}}:{{.CLOUD_PORT_BUILDER}}"
  CLOUD_URL_REVIEWER: "http://shonin-reviewer-{{.NETWORK}}.{{.GCP_INTERNAL}}:{{.CLOUD_PORT_REVIEWER}}"
  # The content store's public copy (an R2 bucket): testnet only so far. The
  # API reads through to it.
  CLOUD_URL_STORE: '{{if eq .NETWORK "testnet"}}{{.URL_STORE_TESTNET}}{{end}}'
  # Where the executor reads the store's files: the API's store, which holds
  # what the cloud built and reads through to the public copy for the rest.
  CLOUD_URL_STORE_READ: "{{.CLOUD_URL_API}}/api/store"
  PROVER_INSTANCE: "projects/{{.GCP_PROJECT}}/zones/{{.GCP_ZONE}}/instances/shonin-prover-{{.NETWORK}}"
  BUILDER_INSTANCE: "projects/{{.GCP_PROJECT}}/zones/{{.GCP_ZONE}}/instances/shonin-builder-{{.NETWORK}}"
  REVIEWER_INSTANCE: "projects/{{.GCP_PROJECT}}/zones/{{.GCP_ZONE}}/instances/shonin-reviewer-{{.NETWORK}}"
  SERVICES_ACCOUNT: "{{.GCP_SERVICES_SERVICE_ACCOUNT}}@{{.GCP_PROJECT}}.iam.gserviceaccount.com"
  PROVER_ACCOUNT: "{{.GCP_PROVER_SERVICE_ACCOUNT}}@{{.GCP_PROJECT}}.iam.gserviceaccount.com"
  TESTNET_MARKET_ACCOUNT: "{{.GCP_TESTNET_MARKET_SERVICE_ACCOUNT}}@{{.GCP_PROJECT}}.iam.gserviceaccount.com"
  WORKLOAD_ACCOUNT: "{{.GCP_WORKLOAD_SERVICE_ACCOUNT}}@{{.GCP_PROJECT}}.iam.gserviceaccount.com"
  # The custom role that may start, stop and read one instance: bound to the
  # services VM's account on the prover's, the builder's and the reviewer's
  # instances alone.
  PROVER_STARTER_ROLE: "shoninProverStarter"
  PROVER_STARTER_PERMISSIONS: "compute.instances.start,compute.instances.stop,compute.instances.get"
  # What the waker on the services VM watches and starts, beside the prover:
  # the builder's and the reviewer's status ports and instances.
  WAKER_METADATA: "shonin-builder-url={{.CLOUD_URL_BUILDER}}~shonin-builder-instance={{.BUILDER_INSTANCE}}~shonin-reviewer-url={{.CLOUD_URL_REVIEWER}}~shonin-reviewer-instance={{.REVIEWER_INSTANCE}}"
  # The status ports the prover proves for, beside the executor's.
  PROVER_STATUS_URLS: "{{.CLOUD_URL_BUILDER}},{{.CLOUD_URL_REVIEWER}}"
  # How far back `task cloud:logs` looks.
  LOGS_FRESHNESS: "{{.FRESHNESS | default \"30m\"}}"
  # The image digest of NAME:IMAGE_TAG in the registry, for a shell to run.
  DIGEST_OF: >-
    gcloud artifacts docker images describe
    --project="{{.GCP_PROJECT}}" --format='value(image_summary.digest)'

tasks:
  build:
    desc: "Build an image locally for a network (NAME=reviewer|builder|executor|unwinder|requester|api|indexer|keeper|prover, NETWORK=testnet|mainnet; SEALED=<dir holding sealed.json> for the requester and the reviewer), tagged NAME:TAG (the commit by default), with the network's deployments and settings baked in"
    requires:
      vars: [NAME, NETWORK]
    preconditions:
      - sh: 'for n in {{.MACHINES}} {{.SERVICES}} {{.PROVERS}}; do [ "$n" = "{{.NAME}}" ] && exit 0; done; exit 1'
        msg: "No image is called {{.NAME}}: {{.MACHINES}} {{.SERVICES}} {{.PROVERS}}"
      - sh: '[ "{{.NETWORK}}" = "testnet" ] || [ "{{.NETWORK}}" = "mainnet" ]'
        msg: "Name the chains: NETWORK=testnet or NETWORK=mainnet. An image is built for one network, and the cloud never runs against local chains (NETWORK={{.NETWORK}})."
      - sh: 'ls "{{.PATH_DEPLOYMENTS_DIR}}"/evm-*.json >/dev/null 2>&1'
        msg: "No deployment files in {{.PATH_DEPLOYMENTS_DIR}}: deploy the network's contracts first (task chains:deploy NETWORK={{.NETWORK}}). An image carries its network's deployments."
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
      # The Solana program ids an image compiles in: a mainnet image the
      # committed mainnet ids, a testnet one the committed devnet ids once
      # they are committed. Until then a testnet image compiles in none and
      # serves the EVM chains alone (SHONIN_WITHOUT_SOLANA=1, baked in).
      DEVNET_IDS:
        sh: '[ -s "{{.PATH_CONTRACTS_SOLANA}}/programs/shonin-registry/devnet-id" ] && echo yes || echo no'
      NETWORK_FEATURE: '{{if eq .NETWORK "mainnet"}}mainnet{{else if eq .DEVNET_IDS "yes"}}devnet{{else}}none{{end}}'
      WITHOUT_SOLANA: '{{if eq .NETWORK_FEATURE "none"}}1{{end}}'
      # The prover's guest, built reproducibly beforehand
      # (SHONIN_ATTESTATION_BUILD_GUEST=1): the directory holding its ELF,
      # GUEST_DIR or found under the cargo target directory.
      GUEST_DIR:
        sh: |
          if [ -n "${GUEST_DIR:-}" ]; then echo "$GUEST_DIR"; exit 0; fi
          elf=$(find "${CARGO_TARGET_DIR:-{{.PATH_ROOT}}/target}/riscv-guest" -path '*docker*' -name shonin-attestation-guest.bin 2>/dev/null | head -1)
          [ -n "$elf" ] && dirname "$elf" || true
      GUEST_CONTEXT: '{{if eq .NAME "prover"}}--build-context guest="{{.GUEST_DIR}}"{{end}}'
      # The requester's sealed message (made with shonin-seal): the
      # directory holding its sealed.json.
      SEALED_CONTEXT: '{{if or (eq .NAME "requester") (eq .NAME "reviewer")}}--build-context sealed="{{.SEALED}}"{{end}}'
    cmds:
      - cmd: '[ "{{.NAME}}" != "prover" ] || [ -s "{{.GUEST_DIR}}/shonin-attestation-guest.bin" ] || { echo "no guest ELF: build it with SHONIN_ATTESTATION_BUILD_GUEST=1, or set GUEST_DIR"; exit 1; }'
      - cmd: '{ [ "{{.NAME}}" != "requester" ] && [ "{{.NAME}}" != "reviewer" ]; } || [ -s "{{.SEALED}}/sealed.json" ] || { echo "no sealed message: pass SEALED=<dir holding sealed.json>, made with task rootkey:seal"; exit 1; }'
      # Confidential Space and Compute Engine run linux/amd64. Every image
      # is handed the same settings and takes the ones it uses: the network,
      # the deployments directory (as the build context `deployments`; the
      # repository's own context leaves .shonin out), the store's public copy,
      # the API's and the executor's internal URLs. The chains' endpoints are
      # the committed public ones: no keyed URL reaches an image.
      # Only the public deployment files go in (each chain's addresses and
      # its checkers'), never a deploy's progress records.
      - |
        set -e
        deployments=$(mktemp -d)
        trap 'rm -rf "$deployments"' EXIT
        for file in "{{.PATH_DEPLOYMENTS_DIR}}"/*.json; do
          case "$(basename "$file")" in
            *.partial.json | *.run-*) ;;
            evm-[0-9]*.json | attestation-evm-[0-9]*.json | mirror-feeds-evm-[0-9]*.json | solana-*.json) cp "$file" "$deployments/" ;;
          esac
        done
        docker build --platform linux/amd64 \
          --build-arg NETWORK_FEATURE={{.NETWORK_FEATURE}} \
          --build-arg NETWORK={{.NETWORK}} \
          --build-arg WITHOUT_SOLANA={{.WITHOUT_SOLANA}} \
          --build-arg STORE_URL={{.CLOUD_URL_STORE}} \
          --build-arg API_URL={{.CLOUD_URL_API}} \
          --build-arg EXECUTOR_URL={{.CLOUD_URL_EXECUTOR}} \
          --build-arg BUILDER_URL={{.CLOUD_URL_BUILDER}} \
          --build-arg REVIEWER_URL={{.CLOUD_URL_REVIEWER}} \
          --build-arg STORE_READ_URL={{.CLOUD_URL_STORE_READ}} \
          --build-arg API_INTERNAL_URL={{.CLOUD_URL_API_INTERNAL}} \
          --build-context deployments="$deployments" \
          {{.GUEST_CONTEXT}} \
          {{.SEALED_CONTEXT}} \
          -f "{{.PATH_ROOT}}/deploy/gcp/Dockerfile.{{.NAME}}" \
          -t "{{.NAME}}:{{.IMAGE_TAG}}" \
          "{{.PATH_ROOT}}"

  push:
    desc: "Build and push an image to the network's Artifact Registry, and print its digest (NAME=..., NETWORK=testnet|mainnet; BUILDER=local, the default, cross-builds here with docker, BUILDER=cloud builds in Cloud Build with its layer cache: api, keeper, executor, prover)"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - &network
        sh: '[ "{{.NETWORK}}" = "testnet" ] || [ "{{.NETWORK}}" = "mainnet" ]'
        msg: "Name the chains: NETWORK=testnet or NETWORK=mainnet. The cloud never runs against local chains (NETWORK={{.NETWORK}})."
      - &project
        sh: '[ -n "{{.GCP_PROJECT}}" ]'
        msg: "No Google Cloud project for {{.NETWORK}}: set GCP_PROJECT_{{upper .NETWORK}} in taskfiles/config.yml. The gcloud default project is never used."
      - &builder
        sh: '[ "{{.BUILDER}}" = "local" ] || [ "{{.BUILDER}}" = "cloud" ]'
        msg: "BUILDER=local (docker here) or BUILDER=cloud (Cloud Build), not {{.BUILDER}}."
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
      BUILDER: '{{.BUILDER | default "local"}}'
    cmds:
      - task: images
        vars: { NAMES: "{{.NAME}}", NETWORK: "{{.NETWORK}}", TAG: "{{.IMAGE_TAG}}", BUILDER: "cloud" }
        if: '[ "{{.BUILDER}}" = "cloud" ]'
      - task: push:local
        vars: { NAME: "{{.NAME}}", NETWORK: "{{.NETWORK}}", TAG: "{{.IMAGE_TAG}}", SEALED: "{{.SEALED}}" }
        if: '[ "{{.BUILDER}}" = "local" ]'

  push:local:
    desc: "Build an image here with docker (linux/amd64) and push it: what cloud:push does with BUILDER=local (NAME=..., NETWORK=testnet|mainnet)"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      - task: build
        vars: { NAME: "{{.NAME}}", NETWORK: "{{.NETWORK}}", TAG: "{{.IMAGE_TAG}}", SEALED: "{{.SEALED}}" }
      - gcloud auth configure-docker "{{.GCP_REGION}}-docker.pkg.dev" --project="{{.GCP_PROJECT}}" --quiet
      - docker tag "{{.NAME}}:{{.IMAGE_TAG}}" "{{.GCP_REGISTRY}}/{{.NAME}}:{{.IMAGE_TAG}}"
      - docker push "{{.GCP_REGISTRY}}/{{.NAME}}:{{.IMAGE_TAG}}"
      - echo "{{.NAME}}:{{.IMAGE_TAG}} is $({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/{{.NAME}}:{{.IMAGE_TAG}}")"

  images:
    desc: "Build and push several images at once, side by side in one Cloud Build with its layer cache (BUILDER=cloud, the default here) or one after another here (BUILDER=local), and print each digest (NAMES=\"api keeper executor prover builder reviewer unwinder testnet-market\", NETWORK=testnet; the reviewer needs SEALED=<dir holding sealed.json>, its sealed model key; TAG= the commit by default; SKIP_PUSHED=1 leaves an image already pushed under TAG)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
      - *builder
      - sh: 'for n in {{.NAMES}}; do case " api keeper executor prover builder reviewer unwinder testnet-market " in *" $n "*) ;; *) exit 1 ;; esac; done'
        msg: "Cloud Build builds api, keeper, executor, prover, builder, reviewer, unwinder and testnet-market (NAMES={{.NAMES}})."
      - sh: 'case " {{.NAMES}} " in *" testnet-market "*) [ "{{.NETWORK}}" = "testnet" ] ;; esac'
        msg: "testnet-market is built for the testnet alone (NETWORK={{.NETWORK}})."
      - sh: 'case " {{.NAMES}} " in *" reviewer "*) [ -s "{{.SEALED}}/sealed.json" ] ;; esac'
        msg: "The reviewer's image carries its model key, sealed: pass SEALED=<dir holding sealed.json> (task cloud:reviewer makes it)."
      - sh: 'ls "{{.PATH_DEPLOYMENTS_DIR}}"/evm-*.json >/dev/null 2>&1'
        msg: "No deployment files in {{.PATH_DEPLOYMENTS_DIR}}: deploy the network's contracts first (task chains:deploy NETWORK={{.NETWORK}}). An image carries its network's deployments."
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
      NAMES: '{{.NAMES | default "api keeper executor prover"}}'
      BUILDER: '{{.BUILDER | default "cloud"}}'
      DEVNET_IDS:
        sh: '[ -s "{{.PATH_CONTRACTS_SOLANA}}/programs/shonin-registry/devnet-id" ] && echo yes || echo no'
      NETWORK_FEATURE: '{{if eq .NETWORK "mainnet"}}mainnet{{else if eq .DEVNET_IDS "yes"}}devnet{{else}}none{{end}}'
      WITHOUT_SOLANA: '{{if eq .NETWORK_FEATURE "none"}}1{{end}}'
      GUEST_DIR:
        sh: |
          if [ -n "${GUEST_DIR:-}" ]; then echo "$GUEST_DIR"; exit 0; fi
          elf=$(find "${CARGO_TARGET_DIR:-{{.PATH_ROOT}}/target}/riscv-guest" -path '*docker*' -name shonin-attestation-guest.bin 2>/dev/null | head -1)
          [ -n "$elf" ] && dirname "$elf" || true
    cmds:
      - |
        set -euo pipefail
        names=""
        for name in {{.NAMES}}; do
          if [ -n "{{.SKIP_PUSHED}}" ] && [ -n "$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/$name:{{.IMAGE_TAG}}" 2>/dev/null)" ]; then
            echo "$name:{{.IMAGE_TAG}} is already pushed"
          else
            names="$names $name"
          fi
        done
        names=${names# }
        [ -n "$names" ] || exit 0
        started=$(date +%s)
        if [ "{{.BUILDER}}" = "local" ]; then
          for name in $names; do
            task cloud:push:local NAME="$name" NETWORK={{.NETWORK}} TAG={{.IMAGE_TAG}} SEALED="{{.SEALED}}"
          done
        else
          case " $names " in
            *" prover "*) [ -s "{{.GUEST_DIR}}/shonin-attestation-guest.bin" ] || { echo "no guest ELF: build it with SHONIN_ATTESTATION_BUILD_GUEST=1, or set GUEST_DIR"; exit 1; }
                          guest="{{.GUEST_DIR}}" ;;
            *) guest="" ;;
          esac
          case " $names " in
            *" reviewer "*) sealed="{{.SEALED}}" ;;
            *) sealed="" ;;
          esac
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cd "{{.PATH_ROOT}}"
          deploy/gcp/cloudbuild/stage.sh "$scratch/source.tgz" "{{.PATH_DEPLOYMENTS_DIR}}" "$guest" "$sealed"
          object="gs://{{.GCP_CLOUDBUILD_BUCKET}}/source/{{.IMAGE_TAG}}-$(date +%s).tgz"
          gcloud storage cp "$scratch/source.tgz" "$object" --project="{{.GCP_PROJECT}}" --quiet
          # One build for them all, on one worker (the project's quota runs
          # one 8-CPU build at a time; a second would only queue behind it).
          gcloud builds submit "$object" \
            --project="{{.GCP_PROJECT}}" --region="{{.GCP_REGION}}" \
            --config=deploy/gcp/cloudbuild.yaml \
            --substitutions="^~^_NAMES=$names~_TAG={{.IMAGE_TAG}}~_REGISTRY={{.GCP_REGISTRY}}~_NETWORK={{.NETWORK}}~_NETWORK_FEATURE={{.NETWORK_FEATURE}}~_WITHOUT_SOLANA={{.WITHOUT_SOLANA}}~_STORE_URL={{.CLOUD_URL_STORE}}~_API_URL={{.CLOUD_URL_API}}~_EXECUTOR_URL={{.CLOUD_URL_EXECUTOR}}~_BUILDER_URL={{.CLOUD_URL_BUILDER}}~_REVIEWER_URL={{.CLOUD_URL_REVIEWER}}~_STORE_READ_URL={{.CLOUD_URL_STORE_READ}}~_API_INTERNAL_URL={{.CLOUD_URL_API_INTERNAL}}" \
            || { gcloud storage rm "$object" --project="{{.GCP_PROJECT}}" --quiet >/dev/null 2>&1; exit 1; }
          gcloud storage rm "$object" --project="{{.GCP_PROJECT}}" --quiet >/dev/null 2>&1 || true
        fi
        echo "built and pushed $names in $(( $(date +%s) - started )) s"
        for name in $names; do
          echo "$name:{{.IMAGE_TAG}} is $({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/$name:{{.IMAGE_TAG}}")"
        done

  vendor-groth16:
    desc: "Copy RISC Zero's Groth16 prover image (the linux/amd64 manifest, by digest) into the network's Artifact Registry, so the prover's VM never pulls it from Docker Hub; already there is done (NETWORK=testnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "Only the testnet runs a prover so far (NETWORK={{.NETWORK}})."
      - *project
    cmds:
      - |
        if gcloud artifacts docker images describe "{{.GCP_REGISTRY}}/risc0-groth16-prover:v2025-04-03.1" --project="{{.GCP_PROJECT}}" >/dev/null 2>&1; then
          echo "the Groth16 image is already in {{.GCP_REGISTRY}}"
        else
          gcloud builds submit --no-source --project="{{.GCP_PROJECT}}" --region="{{.GCP_REGION}}" \
            --config="{{.PATH_ROOT}}/deploy/gcp/cloudbuild-vendor.yaml" \
            --substitutions="_REGISTRY={{.GCP_REGISTRY}}"
        fi

  deploy:machine:
    desc: "Launch a machine on a Confidential Space VM (hardened image, Intel TDX) from its pushed image's digest, nothing passed to it (NAME=executor|builder|reviewer|unwinder|requester, NETWORK=..., TAG= the commit by default). The executor is restarted whenever it stops; the builder, the reviewer and the unwinder are not, and their VM powers off when they exit"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
      - sh: 'for n in {{.MACHINES}}; do [ "$n" = "{{.NAME}}" ] && exit 0; done; exit 1'
        msg: "{{.NAME}} is not a machine: {{.MACHINES}}"
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
      # The executor and the root key's test requester run until stopped; the
      # machines that run on demand (and the unwinder's one-off check) exit,
      # and the hardened image then powers the VM off.
      RESTART_POLICY: '{{if or (eq .NAME "executor") (eq .NAME "requester")}}Always{{else}}Never{{end}}'
      # The builder compiles (the toolchain image and its target directories
      # on the boot disk); the reviewer mostly waits on its model.
      MACHINE_TYPE: '{{if eq .NAME "reviewer"}}{{.GCP_REVIEWER_MACHINE_TYPE}}{{else}}{{.GCP_MACHINE_TYPE}}{{end}}'
      BOOT_DISK: '{{if eq .NAME "builder"}}--boot-disk-size=30GB{{end}}'
    cmds:
      # The digest, not the tag: it is what the attestation measures. No
      # tee-env- and no tee-cmd: the image carries its settings, and the
      # attestation refuses any override of either. The other launcher
      # settings are not overrides: the container's lines go to Cloud
      # Logging (the image allows it), and the restart policy above.
      - |
        digest=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/{{.NAME}}:{{.IMAGE_TAG}}")
        [ -n "$digest" ] || { echo "no pushed image {{.NAME}}:{{.IMAGE_TAG}}: run task cloud:push first"; exit 1; }
        echo "launching {{.NAME}}@$digest (restart policy {{.RESTART_POLICY}})"
        gcloud compute instances create "shonin-{{.NAME}}-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --confidential-compute-type=TDX --machine-type="{{.MACHINE_TYPE}}" {{.BOOT_DISK}} \
          --maintenance-policy=TERMINATE --shielded-secure-boot \
          --image-project=confidential-space-images --image-family=confidential-space \
          --metadata="^~^tee-image-reference={{.GCP_REGISTRY}}/{{.NAME}}@${digest}~tee-container-log-redirect=true~tee-restart-policy={{.RESTART_POLICY}}" \
          --tags="shonin-{{.NAME}}" \
          --service-account="{{.WORKLOAD_ACCOUNT}}" \
          --scopes=cloud-platform
      # The waker may start (and, should one not power off, stop) the
      # machines that run on demand.
      - task: iam:prover-start
        vars: { NETWORK: "{{.NETWORK}}", INSTANCE: "{{.NAME}}" }
        if: 'case " {{.ON_DEMAND}} " in *" {{.NAME}} "*) exit 0 ;; *) exit 1 ;; esac'

  deploy:services:
    desc: "Create the services VM (Container-Optimized OS, e2-small): the API, the keeper, the tunnel and the waker, from the pushed api and keeper images' digests (NETWORK=testnet, TAG= the commit by default)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - &testnet
        sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "Only the testnet runs a services VM so far (NETWORK={{.NETWORK}})."
      - *project
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      - |
        api=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/api:{{.IMAGE_TAG}}")
        keeper=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/keeper:{{.IMAGE_TAG}}")
        [ -n "$api" ] && [ -n "$keeper" ] || { echo "push api and keeper first (task cloud:push NAME=api, NAME=keeper; TAG={{.IMAGE_TAG}})"; exit 1; }
        gcloud compute instances create "shonin-services-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --machine-type="{{.GCP_SERVICES_MACHINE_TYPE}}" \
          --image-project=cos-cloud --image-family=cos-stable \
          --boot-disk-size=10GB --boot-disk-type=pd-standard \
          --shielded-secure-boot --shielded-vtpm --shielded-integrity-monitoring \
          --tags=shonin-services \
          --service-account="{{.SERVICES_ACCOUNT}}" --scopes=cloud-platform \
          --metadata-from-file="startup-script={{.PATH_ROOT}}/deploy/gcp/services/startup.sh,shonin-waker={{.PATH_ROOT}}/deploy/gcp/services/waker.sh" \
          --metadata="^~^shonin-api-image={{.GCP_REGISTRY}}/api@${api}~shonin-keeper-image={{.GCP_REGISTRY}}/keeper@${keeper}~shonin-executor-url={{.CLOUD_URL_EXECUTOR}}~shonin-prover-instance={{.PROVER_INSTANCE}}~{{.WAKER_METADATA}}~shonin-keeper-secret={{.GCP_SECRET_TESTNET_KEEPER_KEY}}~shonin-keeper-solana-secret={{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}~shonin-tunnel-secret={{.GCP_SECRET_TESTNET_TUNNEL_TOKEN}}~shonin-rpc-secret={{.GCP_SECRET_TESTNET_RPC}}~enable-oslogin=TRUE"

  redeploy:services:
    desc: "Point the services VM at newly pushed api and keeper images (and the current scripts), and restart it (NETWORK=testnet, TAG= the commit by default)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      - |
        api=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/api:{{.IMAGE_TAG}}")
        keeper=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/keeper:{{.IMAGE_TAG}}")
        [ -n "$api" ] && [ -n "$keeper" ] || { echo "push api and keeper first (TAG={{.IMAGE_TAG}})"; exit 1; }
        gcloud compute instances add-metadata "shonin-services-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --metadata-from-file="startup-script={{.PATH_ROOT}}/deploy/gcp/services/startup.sh,shonin-waker={{.PATH_ROOT}}/deploy/gcp/services/waker.sh" \
          --metadata="^~^shonin-api-image={{.GCP_REGISTRY}}/api@${api}~shonin-keeper-image={{.GCP_REGISTRY}}/keeper@${keeper}~shonin-executor-url={{.CLOUD_URL_EXECUTOR}}~shonin-prover-instance={{.PROVER_INSTANCE}}~{{.WAKER_METADATA}}~shonin-keeper-solana-secret={{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}~shonin-rpc-secret={{.GCP_SECRET_TESTNET_RPC}}"
        # A stopped VM is started (it reads the new images at boot); a running
        # one is reset, since a reset needs a running VM.
        status=$(gcloud compute instances describe "shonin-services-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" --format='value(status)')
        case "$status" in
          TERMINATED|STOPPED|SUSPENDED) gcloud compute instances start "shonin-services-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" ;;
          *) gcloud compute instances reset "shonin-services-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" ;;
        esac

  deploy:prover:
    desc: "Create the prover's VM (on-demand, off when idle; the services VM's waker starts it) from the pushed prover image's digest, and let the services VM start it (NETWORK=testnet, TAG= the commit by default)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
      - sh: '[ -f "{{.PATH_ROOT}}/deploy/gcp/prover/startup.sh" ]'
        msg: "No deploy/gcp/prover/startup.sh: the prover's VM has nothing to run."
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      # On-demand, and on only while proving: the startup script runs the
      # prover and powers the VM off when it exits.
      - |
        prover=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/prover:{{.IMAGE_TAG}}")
        [ -n "$prover" ] || { echo "push the prover first (task cloud:push NAME=prover TAG={{.IMAGE_TAG}})"; exit 1; }
        gcloud compute instances create "shonin-prover-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --machine-type="{{.GCP_PROVER_MACHINE_TYPE}}" \
          --provisioning-model=STANDARD --maintenance-policy=TERMINATE \
          --image-project=cos-cloud --image-family=cos-stable \
          --boot-disk-size=30GB --boot-disk-type=pd-balanced \
          --shielded-secure-boot --shielded-vtpm --shielded-integrity-monitoring \
          --tags=shonin-prover \
          --service-account="{{.PROVER_ACCOUNT}}" --scopes=cloud-platform \
          --metadata-from-file="startup-script={{.PATH_ROOT}}/deploy/gcp/prover/startup.sh" \
          --metadata="^~^shonin-prover-image={{.GCP_REGISTRY}}/prover@${prover}~shonin-executor-url={{.CLOUD_URL_EXECUTOR}}~shonin-status-urls={{.PROVER_STATUS_URLS}}~enable-oslogin=TRUE"
      - task: iam:prover-start
        vars: { NETWORK: "{{.NETWORK}}", INSTANCE: "prover" }

  deploy:testnet-market:
    desc: "Create testnet-market's VM (Container-Optimized OS, e2-micro) from the pushed testnet-market image's digest, with its own key (task cloud:secrets:testnet-market) and the paid endpoints (NETWORK=testnet, TAG= the commit by default)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "testnet-market runs for the testnet alone (NETWORK={{.NETWORK}})."
      - *project
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      - |
        market=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/testnet-market:{{.IMAGE_TAG}}")
        [ -n "$market" ] || { echo "push testnet-market first (task cloud:images NAMES=testnet-market NETWORK=testnet TAG={{.IMAGE_TAG}})"; exit 1; }
        gcloud compute instances create "shonin-testnet-market-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --machine-type="{{.GCP_TESTNET_MARKET_MACHINE_TYPE}}" \
          --image-project=cos-cloud --image-family=cos-stable \
          --boot-disk-size=10GB --boot-disk-type=pd-standard \
          --shielded-secure-boot --shielded-vtpm --shielded-integrity-monitoring \
          --tags=shonin-testnet-market \
          --service-account="{{.TESTNET_MARKET_ACCOUNT}}" --scopes=cloud-platform \
          --metadata-from-file="startup-script={{.PATH_ROOT}}/deploy/gcp/testnet-market/startup.sh" \
          --metadata="^~^shonin-testnet-market-image={{.GCP_REGISTRY}}/testnet-market@${market}~shonin-testnet-market-secret={{.GCP_SECRET_TESTNET_MARKET_KEY}}~shonin-testnet-market-solana-secret={{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}~shonin-rpc-secret={{.GCP_SECRET_TESTNET_RPC}}~enable-oslogin=TRUE"

  redeploy:testnet-market:
    desc: "Point testnet-market's VM at a newly pushed testnet-market image (and the current startup script), and restart it (NETWORK=testnet, TAG= the commit by default)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - sh: '[ "{{.NETWORK}}" = "testnet" ]'
        msg: "testnet-market runs for the testnet alone (NETWORK={{.NETWORK}})."
      - *project
    vars:
      # The tag as this task was given it: file-level vars never see a caller's TAG.
      IMAGE_TAG: '{{.TAG | default .GIT_SHA}}'
    cmds:
      - |
        market=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/testnet-market:{{.IMAGE_TAG}}")
        [ -n "$market" ] || { echo "push testnet-market first (TAG={{.IMAGE_TAG}})"; exit 1; }
        gcloud compute instances add-metadata "shonin-testnet-market-{{.NETWORK}}" \
          --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
          --metadata-from-file="startup-script={{.PATH_ROOT}}/deploy/gcp/testnet-market/startup.sh" \
          --metadata="^~^shonin-testnet-market-image={{.GCP_REGISTRY}}/testnet-market@${market}~shonin-testnet-market-secret={{.GCP_SECRET_TESTNET_MARKET_KEY}}~shonin-testnet-market-solana-secret={{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}~shonin-rpc-secret={{.GCP_SECRET_TESTNET_RPC}}"
        status=$(gcloud compute instances describe "shonin-testnet-market-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" --format='value(status)')
        case "$status" in
          TERMINATED|STOPPED|SUSPENDED) gcloud compute instances start "shonin-testnet-market-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" ;;
          *) gcloud compute instances reset "shonin-testnet-market-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" ;;
        esac

  iam:
    desc: "The services' and the prover's accounts and their roles, and nothing more: idempotent (NETWORK=testnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
    cmds:
      - |
        set -e
        project="{{.GCP_PROJECT}}"
        for account in "{{.GCP_SERVICES_SERVICE_ACCOUNT}}" "{{.GCP_PROVER_SERVICE_ACCOUNT}}" "{{.GCP_TESTNET_MARKET_SERVICE_ACCOUNT}}"; do
          if ! gcloud iam service-accounts describe "$account@$project.iam.gserviceaccount.com" --project="$project" >/dev/null 2>&1; then
            gcloud iam service-accounts create "$account" --project="$project" --display-name="$account"
          fi
        done
        # Each pulls images and writes logs; nothing else project-wide.
        for member in "serviceAccount:{{.SERVICES_ACCOUNT}}" "serviceAccount:{{.PROVER_ACCOUNT}}" "serviceAccount:{{.TESTNET_MARKET_ACCOUNT}}"; do
          for role in roles/artifactregistry.reader roles/logging.logWriter; do
            gcloud projects add-iam-policy-binding "$project" --member="$member" --role="$role" \
              --condition=None --quiet >/dev/null
          done
        done
        # The services VM reads the keeper's two keys, the tunnel's token and
        # the paid endpoints, and no other secret.
        for secret in "{{.GCP_SECRET_TESTNET_KEEPER_KEY}}" "{{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}" "{{.GCP_SECRET_TESTNET_TUNNEL_TOKEN}}" "{{.GCP_SECRET_TESTNET_RPC}}"; do
          if gcloud secrets describe "$secret" --project="$project" >/dev/null 2>&1; then
            gcloud secrets add-iam-policy-binding "$secret" --project="$project" \
              --member="serviceAccount:{{.SERVICES_ACCOUNT}}" --role=roles/secretmanager.secretAccessor >/dev/null
          else
            echo "secret $secret does not exist yet: run task cloud:secrets, then this again"
          fi
        done
        # testnet-market's VM reads its own two keys and the paid endpoints,
        # and no other secret.
        for secret in "{{.GCP_SECRET_TESTNET_MARKET_KEY}}" "{{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}" "{{.GCP_SECRET_TESTNET_RPC}}"; do
          if gcloud secrets describe "$secret" --project="$project" >/dev/null 2>&1; then
            gcloud secrets add-iam-policy-binding "$secret" --project="$project" \
              --member="serviceAccount:{{.TESTNET_MARKET_ACCOUNT}}" --role=roles/secretmanager.secretAccessor >/dev/null
          else
            echo "secret $secret does not exist yet: run task cloud:secrets:testnet-market, then this again"
          fi
        done
        # A role that may start, stop and read an instance, bound below on
        # the prover's, the builder's and the reviewer's instances alone (the
        # waker stops a machine that exited and did not power off). An older
        # role is brought up to these permissions.
        if ! gcloud iam roles describe "{{.PROVER_STARTER_ROLE}}" --project="$project" >/dev/null 2>&1; then
          gcloud iam roles create "{{.PROVER_STARTER_ROLE}}" --project="$project" \
            --title="Start the on-demand machines" --description="Start, stop and read one instance (bound on the prover's, the builder's and the reviewer's alone)" \
            --permissions={{.PROVER_STARTER_PERMISSIONS}} --stage=GA
        else
          gcloud iam roles update "{{.PROVER_STARTER_ROLE}}" --project="$project" \
            --permissions={{.PROVER_STARTER_PERMISSIONS}} --quiet >/dev/null
        fi
      - for: [prover, builder, reviewer]
        task: iam:prover-start
        vars: { NETWORK: "{{.NETWORK}}", INSTANCE: "{{.ITEM}}" }

  iam:prover-start:
    internal: true
    requires:
      vars: [NETWORK, GCP_PROJECT, INSTANCE]
    cmds:
      # Bound on the instance itself: the services VM may start, stop and
      # read this instance and no other. An instance made again (a new image)
      # needs it bound again; deploy:machine and deploy:prover do so.
      - |
        if gcloud compute instances describe "shonin-{{.INSTANCE}}-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" >/dev/null 2>&1; then
          gcloud compute instances add-iam-policy-binding "shonin-{{.INSTANCE}}-{{.NETWORK}}" \
            --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" \
            --member="serviceAccount:{{.SERVICES_ACCOUNT}}" \
            --role="projects/{{.GCP_PROJECT}}/roles/{{.PROVER_STARTER_ROLE}}" >/dev/null
          echo "the services VM may start shonin-{{.INSTANCE}}-{{.NETWORK}}"
        else
          echo "no {{.INSTANCE}} instance yet: deploying it binds its starter"
        fi

  firewall:
    desc: "Assert the network's firewall: SSH from Google's IAP range only, no RDP, the executor's status port and the services' ports open to the VPC only, the builder's, the reviewer's and the API's internal port to the machines that use them alone, nothing public (NETWORK=testnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
    cmds:
      - |
        set -e
        project="{{.GCP_PROJECT}}"
        exists() { gcloud compute firewall-rules describe "$1" --project="$project" >/dev/null 2>&1; }
        if exists default-allow-rdp; then
          gcloud compute firewall-rules delete default-allow-rdp --project="$project" --quiet
        fi
        if exists default-allow-ssh; then
          gcloud compute firewall-rules update default-allow-ssh --project="$project" --source-ranges=35.235.240.0/20
        else
          exists shonin-allow-ssh-iap || gcloud compute firewall-rules create shonin-allow-ssh-iap --project="$project" \
            --network=default --direction=INGRESS --action=ALLOW --rules=tcp:22 --source-ranges=35.235.240.0/20
        fi
        exists shonin-executor-status || gcloud compute firewall-rules create shonin-executor-status --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_EXECUTOR}} \
          --source-ranges=10.128.0.0/9 --target-tags=shonin-executor
        exists shonin-services-internal || gcloud compute firewall-rules create shonin-services-internal --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_API}},tcp:{{.CLOUD_PORT_KEEPER}} \
          --source-ranges=10.128.0.0/9 --target-tags=shonin-services
        exists shonin-testnet-market-health || gcloud compute firewall-rules create shonin-testnet-market-health --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_TESTNET_MARKET}} \
          --source-ranges=10.128.0.0/9 --target-tags=shonin-testnet-market
        # The machines that run on demand: the builder answers the API (its
        # uploads, the waker) and the prover and keeper (its status); the
        # reviewer answers the builder, the waker, the prover and the keeper;
        # the API's internal port answers those two machines alone (the waker
        # asks it on the services VM itself).
        exists shonin-builder-port || gcloud compute firewall-rules create shonin-builder-port --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_BUILDER}} \
          --source-tags=shonin-services,shonin-prover --target-tags=shonin-builder
        exists shonin-reviewer-port || gcloud compute firewall-rules create shonin-reviewer-port --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_REVIEWER}} \
          --source-tags=shonin-builder,shonin-services,shonin-prover --target-tags=shonin-reviewer
        exists shonin-api-internal || gcloud compute firewall-rules create shonin-api-internal --project="$project" \
          --network=default --direction=INGRESS --action=ALLOW --rules=tcp:{{.CLOUD_PORT_API_INTERNAL}} \
          --source-tags=shonin-builder,shonin-reviewer --target-tags=shonin-services
        gcloud compute firewall-rules list --project="$project" \
          --format="table(name,direction,sourceRanges.list(),allowed[].map().firewall_rule().list(),targetTags.list())"
        # Anything but ping open to the whole internet (filtered here: the
        # list filter can't combine a range with a protocol's absence).
        open=$(gcloud compute firewall-rules list --project="$project" \
          --filter="direction=INGRESS" \
          --format="value(name,sourceRanges.list(),allowed[].map().firewall_rule().list())" \
          | awk -F'\t' '$2 ~ /(^|,)0\.0\.0\.0\/0(,|$)/ && $3 != "icmp" { print $1 }')
        [ -z "$open" ] || { echo "open to the world: $open"; exit 1; }

  secrets:
    desc: "Upload the keeper's testnet keys (derived here: account 4 of the EVM mnemonic, and the keeper's key of the Solana mnemonic, never the mnemonics) and the tunnel's token to Secret Manager, through stdin, and let the services VM read them (NETWORK=testnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
      - sh: 'command -v cast >/dev/null && command -v jq >/dev/null'
        msg: "cast (foundry) and jq are needed to derive and check the keeper's key."
      - sh: '[ -n "${SHONIN_TESTNET_EVM_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_EVM_MNEMONIC is empty in .env."
      - sh: '[ -n "${SHONIN_TESTNET_SOLANA_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_SOLANA_MNEMONIC is empty in .env."
      - sh: '[ -s "{{.PATH_DEPLOYMENTS_DIR}}/solana-devnet.json" ]'
        msg: "No {{.PATH_DEPLOYMENTS_DIR}}/solana-devnet.json: set devnet up first (task chains:solana-setup NETWORK=testnet); the keeper's Solana key is checked against it."
      - sh: '[ -n "${CLOUDFLARE_TUNNEL_TOKEN_TESTNET:-}" ]'
        msg: "CLOUDFLARE_TUNNEL_TOKEN_TESTNET is empty in .env."
      - sh: 'ls "{{.PATH_DEPLOYMENTS_DIR}}"/evm-*.json >/dev/null 2>&1'
        msg: "No deployment files in {{.PATH_DEPLOYMENTS_DIR}}: the keeper's address is checked against them."
    cmds:
      # Nothing secret is printed or put on a command line: the mnemonic goes
      # to cast in a file only this user can read, deleted on exit; each
      # value reaches gcloud on stdin.
      - |
        set -eu
        project="{{.GCP_PROJECT}}"
        # Only this user can enter the scratch directory (Task's shell has no
        # umask, so the directory's own mode keeps its files private).
        scratch=$(mktemp -d)
        chmod 700 "$scratch"
        trap 'rm -rf "$scratch"' EXIT
        printf '%s\n' "$SHONIN_TESTNET_EVM_MNEMONIC" >"$scratch/mnemonic"
        # The keeper is account 4. Its address, checked against every
        # deployment before its key goes anywhere.
        address=$(cast wallet address --mnemonic "$scratch/mnemonic" --mnemonic-index 4 | tr 'A-F' 'a-f')
        for file in "{{.PATH_DEPLOYMENTS_DIR}}"/evm-*.json; do
          keeper=$(jq -r '.roles.keeper // empty' "$file" | tr 'A-F' 'a-f')
          [ "$keeper" = "$address" ] || { echo "$(basename "$file") names another keeper ($keeper), not account 4 ($address)"; exit 1; }
        done
        ensure() {
          gcloud secrets describe "$1" --project="$project" >/dev/null 2>&1 ||
            gcloud secrets create "$1" --project="$project" --replication-policy=automatic
        }
        ensure "{{.GCP_SECRET_TESTNET_KEEPER_KEY}}"
        cast wallet private-key --mnemonic "$scratch/mnemonic" --mnemonic-index 4 | tr -d '\n' |
          gcloud secrets versions add "{{.GCP_SECRET_TESTNET_KEEPER_KEY}}" --project="$project" --data-file=-
        # The keeper's Solana key: its keypair file, written by the devnet
        # from the mnemonic into this scratch directory (it prints only the
        # address), its address checked against devnet's deployment.
        solana_address=$({{.DEVNET}} solana-keypair --role keeper --out "$scratch/keeper-solana.json")
        solana_keeper=$(jq -r '.roles.keeper // empty' "{{.PATH_DEPLOYMENTS_DIR}}/solana-devnet.json")
        [ "$solana_keeper" = "$solana_address" ] || { echo "solana-devnet.json names another keeper ($solana_keeper), not the mnemonic's ($solana_address)"; exit 1; }
        ensure "{{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}"
        tr -d '\n' <"$scratch/keeper-solana.json" |
          gcloud secrets versions add "{{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}" --project="$project" --data-file=-
        ensure "{{.GCP_SECRET_TESTNET_TUNNEL_TOKEN}}"
        printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN_TESTNET" |
          gcloud secrets versions add "{{.GCP_SECRET_TESTNET_TUNNEL_TOKEN}}" --project="$project" --data-file=-
        # The paid endpoints: every SHONIN_RPC_* override in .env, one per
        # line, for the API and the keeper (never an image: only committed
        # public endpoints go into one).
        rpc=$(env | grep -E '^SHONIN_RPC_[A-Z0-9_]+=.+' | sort || true)
        ensure "{{.GCP_SECRET_TESTNET_RPC}}"
        printf '%s\n' "$rpc" |
          gcloud secrets versions add "{{.GCP_SECRET_TESTNET_RPC}}" --project="$project" --data-file=-
        for secret in "{{.GCP_SECRET_TESTNET_KEEPER_KEY}}" "{{.GCP_SECRET_TESTNET_KEEPER_SOLANA_KEY}}" "{{.GCP_SECRET_TESTNET_TUNNEL_TOKEN}}" "{{.GCP_SECRET_TESTNET_RPC}}"; do
          gcloud secrets add-iam-policy-binding "$secret" --project="$project" \
            --member="serviceAccount:{{.SERVICES_ACCOUNT}}" --role=roles/secretmanager.secretAccessor >/dev/null
        done
        echo "uploaded the keeper's keys ($address, and $solana_address on Solana devnet), the tunnel's token and $(printf '%s' "$rpc" | grep -c . || true) paid endpoint(s); the services VM reads them at its next boot"

  secrets:testnet-market:
    desc: "Upload testnet-market's keys (derived here: account 101 of the EVM mnemonic, checked first against the mirror feeds it posts to, and key 111 of the Solana mnemonic; never the mnemonics) to Secret Manager, through stdin, and let its VM read them (NETWORK=testnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
      - sh: 'command -v cast >/dev/null && command -v jq >/dev/null'
        msg: "cast (foundry) and jq are needed to derive and check the market's key."
      - sh: '[ -n "${SHONIN_TESTNET_EVM_MNEMONIC:-}" ]'
        msg: "SHONIN_TESTNET_EVM_MNEMONIC is empty in .env."
      - sh: '[ -s "{{.PATH_DEPLOYMENTS_DIR}}/mirror-feeds-evm-46630.json" ]'
        msg: "No {{.PATH_DEPLOYMENTS_DIR}}/mirror-feeds-evm-46630.json: deploy the mirror feeds first (task chains:testnet-market-setup NETWORK=testnet STEPS=feeds)."
    cmds:
      - |
        set -eu
        project="{{.GCP_PROJECT}}"
        scratch=$(mktemp -d)
        chmod 700 "$scratch"
        trap 'rm -rf "$scratch"' EXIT
        printf '%s\n' "$SHONIN_TESTNET_EVM_MNEMONIC" >"$scratch/mnemonic"
        # The market is account 101. Its address, checked against every
        # mirror's updater before its key goes anywhere.
        address=$(cast wallet address --mnemonic "$scratch/mnemonic" --mnemonic-index 101 | tr 'A-F' 'a-f')
        rpc=$({{.DEVNET}} --vault-chain robinhood chain | head -1 | cut -d' ' -f1)
        for mirror in $(jq -r '.feeds[].address' "{{.PATH_DEPLOYMENTS_DIR}}/mirror-feeds-evm-46630.json"); do
          updater=$(cast call "$mirror" 'updater()(address)' --rpc-url "$rpc" | tr 'A-F' 'a-f')
          [ "$updater" = "$address" ] || { echo "the mirror $mirror takes rounds from $updater, not account 101 ($address)"; exit 1; }
        done
        gcloud secrets describe "{{.GCP_SECRET_TESTNET_MARKET_KEY}}" --project="$project" >/dev/null 2>&1 ||
          gcloud secrets create "{{.GCP_SECRET_TESTNET_MARKET_KEY}}" --project="$project" --replication-policy=automatic
        cast wallet private-key --mnemonic "$scratch/mnemonic" --mnemonic-index 101 | tr -d '\n' |
          gcloud secrets versions add "{{.GCP_SECRET_TESTNET_MARKET_KEY}}" --project="$project" --data-file=-
        gcloud secrets add-iam-policy-binding "{{.GCP_SECRET_TESTNET_MARKET_KEY}}" --project="$project" \
          --member="serviceAccount:{{.TESTNET_MARKET_ACCOUNT}}" --role=roles/secretmanager.secretAccessor >/dev/null
        echo "uploaded testnet-market's key ($address); its VM reads it at its next boot"
        # Its Solana keypair, key 111 of the Solana mnemonic, when it is set.
        if [ -n "${SHONIN_TESTNET_SOLANA_MNEMONIC:-}" ]; then
          solana_address=$({{.DEVNET}} solana-keypair --role market --out "$scratch/market-solana.json")
          gcloud secrets describe "{{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}" --project="$project" >/dev/null 2>&1 ||
            gcloud secrets create "{{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}" --project="$project" --replication-policy=automatic
          tr -d '\n' <"$scratch/market-solana.json" |
            gcloud secrets versions add "{{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}" --project="$project" --data-file=-
          gcloud secrets add-iam-policy-binding "{{.GCP_SECRET_TESTNET_MARKET_SOLANA_KEY}}" --project="$project" \
            --member="serviceAccount:{{.TESTNET_MARKET_ACCOUNT}}" --role=roles/secretmanager.secretAccessor >/dev/null
          echo "uploaded testnet-market's Solana key ($solana_address)"
        else
          echo "SHONIN_TESTNET_SOLANA_MNEMONIC is empty: no Solana key uploaded, and the market keeps no Solana pool"
        fi

  drain:
    desc: "Wait until the builder or the reviewer holds nothing a new image or a new root would lose: no paid job unfinished in the API's queue and, for the reviewer, no review waiting to be posted (NAME=builder|reviewer, NETWORK=testnet; DRAIN_MINUTES=60). Run before replacing either image or the executor"
    requires:
      vars: [NAME, NETWORK]
    preconditions:
      - *testnet
      - sh: '[ "{{.NAME}}" = "builder" ] || [ "{{.NAME}}" = "reviewer" ]'
        msg: "Only the builder and the reviewer are drained (NAME={{.NAME}})."
      - sh: 'command -v jq >/dev/null'
        msg: "jq is needed to read the queue."
    vars:
      DRAIN_MINUTES: '{{.DRAIN_MINUTES | default "60"}}'
    cmds:
      # The queue as the API last had it from the build service (it serves
      # that while the build service is off). A job paid for and not finished
      # is the builder's; a job built and still without its review is the
      # reviewer's to post.
      - |
        set -eu
        filter='[.[] | select(.state.state == "queued" or .state.state == "reviewing" or .state.state == "building"'
        {{if eq .NAME "reviewer"}}filter="$filter"' or ((.state.state == "ready" or .state.state == "activated") and .review == null)'{{end}}
        filter="$filter)] | length"
        deadline=$(( $(date +%s) + {{.DRAIN_MINUTES}} * 60 ))
        while :; do
          if left=$(curl -fsS -m 20 "{{.URL_API_TESTNET}}/api/jobs" | jq "$filter"); then
            if [ "$left" = 0 ]; then
              echo "the {{.NAME}} holds nothing unfinished"
              exit 0
            fi
            echo "the {{.NAME}} has $left job(s) unfinished; waiting"
          else
            echo "the queue could not be read; asking again"
          fi
          [ "$(date +%s)" -lt "$deadline" ] || { echo "still not drained after {{.DRAIN_MINUTES}} minutes"; exit 1; }
          sleep 30
        done

  reviewer:
    desc: "Bring a reviewer up for the network's current root: seal its model key to the root's reviewer-model purpose, build its image with that seal, propose it on every chain, drain and replace the reviewer's VM, then revoke the image it ran before. Run after every new root (NETWORK=testnet; KEY=<the model key's file>, claude-api-key at the root by default; SEALED=<dir for sealed.json>; TAG=)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *testnet
      - *project
      - sh: '[ -s "{{.KEY}}" ]'
        msg: "No model key at {{.KEY}}: put it there (it is gitignored and never staged), or pass KEY=<file>."
    vars:
      KEY: '{{.KEY | default (joinPath .PATH_ROOT "claude-api-key")}}'
      SEALED: '{{.SEALED | default (joinPath .PATH_NETWORK_STATE "reviewer-sealed")}}'
    cmds:
      # Sealed to the published key of the root the canonical chain records
      # (checked before anything is encrypted); the key itself never leaves
      # this machine, and only sealed.json is staged.
      - mkdir -p "{{.SEALED}}"
      - task rootkey:seal NETWORK={{.NETWORK}} PURPOSE=platform:reviewer-model IN="{{.KEY}}" OUT="{{.SEALED}}/sealed.json"
      # The image is the commit's and the seal's: a new seal is a new image.
      - |
        set -eu
        seal=$(shasum -a 256 "{{.SEALED}}/sealed.json" | cut -c1-8)
        tag="{{.TAG | default .GIT_SHA}}-sealed-$seal"
        old=$(gcloud compute instances describe "shonin-reviewer-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" --format=json 2>/dev/null |
          jq -r '.metadata.items[]? | select(.key == "tee-image-reference") | .value' | sed -n 's/.*@//p' || true)
        task cloud:images NETWORK={{.NETWORK}} NAMES=reviewer SEALED="{{.SEALED}}" TAG="$tag" SKIP_PUSHED=1
        digest=$({{.DIGEST_OF}} "{{.GCP_REGISTRY}}/reviewer:$tag")
        [ -n "$digest" ] || { echo "no reviewer image under $tag"; exit 1; }
        task chains:image NETWORK={{.NETWORK}} DIGEST="$digest" KIND=reviewer
        if [ "$old" = "$digest" ]; then
          echo "the reviewer already runs reviewer@$digest"
          exit 0
        fi
        # Confidential Space takes its image when the VM is made: a new image
        # is a new VM, once the old one holds nothing unfinished.
        if [ -n "$old" ]; then
          task cloud:drain NAME=reviewer NETWORK={{.NETWORK}}
          gcloud compute instances delete "shonin-reviewer-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" --quiet
        fi
        task cloud:deploy:machine NAME=reviewer NETWORK={{.NETWORK}} TAG="$tag"
        # The old image no longer gets the model key or the sealed sources.
        if [ -n "$old" ]; then
          task chains:revoke-image NETWORK={{.NETWORK}} DIGEST="$old"
        fi

  test-waker:
    desc: "Run the services VM's waker against a stand-in API, metadata server and Compute Engine, and check what it starts and stops (needs python3; nothing in the cloud is touched)"
    cmds:
      - '"{{.PATH_ROOT}}/deploy/gcp/services/waker-test.sh"'

  status:
    desc: "What runs in the network's project: the VMs, the secrets' names, the images (NETWORK=testnet|mainnet)"
    requires:
      vars: [NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
    cmds:
      - echo "Compute Engine instances in {{.GCP_PROJECT}} ({{.NETWORK}})"
      - gcloud compute instances list --project="{{.GCP_PROJECT}}" --filter="zone:{{.GCP_ZONE}}" --format="table(name,machineType.basename(),scheduling.provisioningModel,status,networkInterfaces[0].networkIP)"
      - echo "Secrets"
      - gcloud secrets list --project="{{.GCP_PROJECT}}" --format="table(name,createTime)"
      - echo "Images in {{.GCP_REGISTRY}}"
      - gcloud artifacts docker images list "{{.GCP_REGISTRY}}" --project="{{.GCP_PROJECT}}" --include-tags --format="table(package.basename(),version.basename(),tags,createTime)"

  logs:
    desc: "Recent logs (NAME=executor|builder|reviewer|unwinder|api|keeper|tunnel|waker|services|prover|testnet-market, NETWORK=..., FRESHNESS=30m): a machine's container from Cloud Logging, the services' containers from Cloud Logging, a plain VM's boot from its serial port"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
    cmds:
      - |
        project="{{.GCP_PROJECT}}"
        case " {{.MACHINES}} " in
          *" {{.NAME}} "*)
            # The launcher's log carries the container's own lines, each in
            # jsonPayload.MESSAGE.
            id=$(gcloud compute instances describe "shonin-{{.NAME}}-{{.NETWORK}}" --project="$project" --zone="{{.GCP_ZONE}}" --format='value(id)')
            gcloud logging read "resource.type=\"gce_instance\" AND resource.labels.instance_id=\"$id\" AND logName=\"projects/$project/logs/confidential-space-launcher\"" \
              --project="$project" --freshness="{{.LOGS_FRESHNESS}}" --order=asc --format='value(timestamp,jsonPayload.MESSAGE)'
            exit ;;
        esac
        case "{{.NAME}}" in
          api|keeper|tunnel|waker|testnet-market)
            gcloud logging read "logName=\"projects/$project/logs/gcplogs-docker-driver\" AND jsonPayload.container.name=\"/shonin-{{.NAME}}\"" \
              --project="$project" --freshness="{{.LOGS_FRESHNESS}}" --order=asc --format='value(timestamp,jsonPayload.data)' ;;
          services|prover)
            gcloud compute instances get-serial-port-output "shonin-{{.NAME}}-{{.NETWORK}}" \
              --project="$project" --zone="{{.GCP_ZONE}}" | tail -n 200 ;;
          *)
            echo "no logs for {{.NAME}}: executor, api, keeper, tunnel, waker, services, prover or testnet-market"; exit 1 ;;
        esac

  start:
    desc: "Start a stopped VM (NAME=executor|services|prover|builder|reviewer, NETWORK=...)"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
      - &vm
        sh: 'for n in {{.VMS}} {{.MACHINES}}; do [ "$n" = "{{.NAME}}" ] && exit 0; done; exit 1'
        msg: "No VM is called {{.NAME}}: {{.VMS}}"
    cmds:
      - gcloud compute instances start "shonin-{{.NAME}}-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}"

  stop:
    desc: "Stop a VM; its disk stays, and it bills only for that (NAME=executor|services|prover|builder|reviewer, NETWORK=...)"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
      - *vm
    cmds:
      - gcloud compute instances stop "shonin-{{.NAME}}-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}"

  delete:
    desc: "Delete a VM and its disk (NAME=executor|services|prover|builder|reviewer|unwinder, NETWORK=..., CONFIRM=yes)"
    requires:
      vars: [NAME, NETWORK, GCP_PROJECT]
    preconditions:
      - *network
      - *project
      - *vm
      - sh: '[ "{{.CONFIRM}}" = "yes" ]'
        msg: "Deleting shonin-{{.NAME}}-{{.NETWORK}} can't be undone: pass CONFIRM=yes."
    cmds:
      - gcloud compute instances delete "shonin-{{.NAME}}-{{.NETWORK}}" --project="{{.GCP_PROJECT}}" --zone="{{.GCP_ZONE}}" --quiet
