# Root Taskfile: orchestration only.
# Non-secret config: taskfiles/config.yml (single source of truth).
# Secrets: .env (gitignored; template in .env.example), loaded here so tasks can
# forward exactly the variables they need.
version: "3"
silent: true
dotenv: [".env"]

includes:
  config:
    taskfile: taskfiles/config.yml
    flatten: true
  frontend: taskfiles/frontend.yml
  docs: taskfiles/docs.yml
  contracts: taskfiles/contracts.yml
  chains: taskfiles/chains.yml
  services: taskfiles/services.yml
  cloud: taskfiles/cloud.yml
  store: taskfiles/store.yml
  rootkey: taskfiles/rootkey.yml
  deploy: taskfiles/deploy.yml

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: "Install tooling (pinned Rust toolchain, wrangler) and enable the commit guard"
    cmds:
      - rustup show active-toolchain || rustup toolchain install
      - npm install
      # The contracts' libraries are pinned submodules.
      - git submodule update --init --recursive
      # Commit guard: every commit runs .githooks/commit-msg (see CLAUDE.md).
      - git config core.hooksPath .githooks
      - |
        for bin in trunk anvil forge solana anchor surfpool gitleaks claude jq; do
          command -v "$bin" >/dev/null || echo "missing: $bin (see README.md)"
        done
        # Surfpool before 1.2.0 has no Ed25519 program offline, which every
        # signature the Solana programs check needs.
        if command -v surfpool >/dev/null; then
          version=$(surfpool --version | awk '{print $2}')
          case "$version" in
            0.*|1.0.*|1.1.*) echo "surfpool $version is too old: install 1.2.0 or later (see README.md)" ;;
          esac
        fi
        for f in .private/terms.txt .private/review.md; do
          [ -f "$f" ] || echo "missing: $f (commit guard input; commits are blocked until it exists)"
        done

  dev:
    desc: "The whole platform, locally: chains, contracts, machines, services, the app and the marketing site"
    deps:
      - chains:evm
      - chains:solana
      - services:devnet
      - services:builder
      - services:reviewer
      - services:api
      - services:indexer
      - services:executor
      - services:unwinder
      - services:keeper
      - frontend:app:dev
      - frontend:marketing:dev

  dev:services:
    desc: "Everything but the frontends: chains, contracts, machines and services"
    deps:
      - chains:evm
      - chains:solana
      - services:devnet
      - services:builder
      - services:reviewer
      - services:api
      - services:indexer
      - services:executor
      - services:unwinder
      - services:keeper

  build:
    desc: "Release builds of the frontends: tokens, the app, the marketing site"
    cmds:
      - task: frontend:build

  deploy:
    desc: "Build and deploy the app to Cloudflare: app.shonin.fi and shonin.fi"
    cmds:
      - task: frontend:deploy

  check:
    desc: "Compile everything: the contracts and programs, then the crates for each target they run on"
    cmds:
      - task: contracts:build
      - task: contracts:solana:check
      - cargo check --workspace --all-targets
      - cargo check {{.CARGO_WASM_PACKAGES}} --target wasm32-unknown-unknown
      - cargo check {{.CARGO_WASIP2_PACKAGES}} --target wasm32-wasip2

  lint:
    desc: "rustfmt --check and clippy -D warnings (native and wasm), forge fmt --check"
    cmds:
      - task: contracts:lint
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - task: lint:wasm

  lint:wasm:
    desc: "clippy -D warnings for the crates built for wasm: the web app and the crates it uses, and the strategy SDK"
    cmds:
      - cargo clippy {{.CARGO_WASM_PACKAGES}} --target wasm32-unknown-unknown -- -D warnings
      - cargo clippy {{.CARGO_WASIP2_PACKAGES}} --target wasm32-wasip2 -- -D warnings

  fmt:
    desc: "Format every crate and every contract"
    cmds:
      - cargo fmt --all
      - task: contracts:fmt

  test:
    desc: "Native tests and the contracts' tests"
    cmds:
      - task: contracts:test
      - cargo test --workspace

  clean:
    desc: "Remove build output and local chain state"
    cmds:
      - cargo clean
      - task: contracts:clean
      - rm -rf "{{.PATH_TRUNK_DIST}}"
      - rm -rf "{{.PATH_LOCAL_STATE}}"

  down:
    desc: "Kill stray local dev servers"
    cmds:
      - |
        for p in {{.PORTS_DEV}}; do
          lsof -ti tcp:$p | xargs kill -9 2>/dev/null || true
        done
