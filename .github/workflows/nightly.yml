# Nightly, and on demand: every CI job, regardless of what changed, plus the
# whole workspace's tests under plain `cargo test --workspace`, as `task test`
# runs them. That includes the keeper's and the executor's process suites
# (tests that start the service binaries against scripted nodes), which take
# too long for every pull request.
#
# A few tests need a local Solana cluster and pass, saying they skipped,
# without one (the chain crate's, the indexer's and the keeper's Solana
# cluster tests; the executor's is ignored unless asked for). No job here
# starts a cluster for them yet.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  workspace-tests:
    name: Workspace tests, with the process suites
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Room for the test build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Fresh program ids every run, as in CI (see ci.yml).
      - name: Fresh program ids
        run: bash .github/scripts/fresh-program-keypairs.sh

      - name: Test
        run: cargo test --workspace
