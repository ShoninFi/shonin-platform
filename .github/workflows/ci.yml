# Check, lint and test: the same `task check`, `task lint` and `task test` a
# change has to pass locally before it is opened as a pull request, plus a
# check that every contract fits the chain's contract-size limit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # rust-toolchain.toml pins the compiler, its components and targets;
      # the first cargo call installs them.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            contracts/solana

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.2.3

      # Compiling the contracts and their tests is most of the contract
      # steps' time; forge only rebuilds what changed since the cached run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not the saved fuzz and invariant counterexamples: a later run
          # replays them, and they belong to the code that produced them.
          path: |
            contracts/evm/out
            contracts/evm/cache
            !contracts/evm/cache/fuzz
            !contracts/evm/cache/invariant
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/evm/foundry.toml', 'contracts/evm/src/**/*.sol', 'contracts/evm/test/**/*.sol', 'contracts/evm/lib/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Compiling every contract and test through the IR pipeline at once
      # needs about 13 GB at its peak, more than the runner's memory beside
      # everything else; swap on the runner's spare disk carries the peak.
      - name: Swap for the contract build
        run: |
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Check
        run: task check

      - name: Contract sizes
        run: task contracts:sizes

      - name: Lint
        run: task lint

      - name: Test
        run: task test
