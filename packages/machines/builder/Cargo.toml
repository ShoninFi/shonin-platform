[package]
name = "shonin-builder"
description = "The build service: compiles submitted source into a signed bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "builder"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
# For its version only: the SDK the build service carries, which a lock may
# name from crates.io.
strategy-sdk.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
# Keys by attested exchange, and the launcher's socket.
shonin-rootkey = { path = "../../rootkey" }
# State kept off the machine is wiped from memory once written.
zeroize = "1.9.0"

[dev-dependencies]
# The service identity of a fixed seed, to seal state with in tests.
shonin-rootkey = { path = "../../rootkey", features = ["test-identity"] }

[lints]
workspace = true
