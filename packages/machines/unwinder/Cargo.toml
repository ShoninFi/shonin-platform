[package]
name = "shonin-unwinder"
description = "The attested unwinder: finishes the withdrawals the contracts can't finish alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unwinder"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
chain = { workspace = true, features = ["args"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
