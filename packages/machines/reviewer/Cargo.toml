[package]
name = "shonin-reviewer"
description = "The attested reviewer: scores whether a strategy's code is reasonable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "shonin_reviewer"
path = "src/lib.rs"

[[bin]]
name = "reviewer"
path = "src/main.rs"

# Compares the prose reviewer with the battery over the same strategies.
# Development tooling: it is not part of the reviewer image.
[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tar.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
