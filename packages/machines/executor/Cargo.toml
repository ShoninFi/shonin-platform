[package]
name = "shonin-executor"
description = "The attested Shonin executor: feeds, runner and signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "executor"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
strategy-sdk.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
ciborium.workspace = true
clap.workspace = true
fastnum.workspace = true
futures.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
# A paused clock, so a test can wait out a receipt timeout without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
