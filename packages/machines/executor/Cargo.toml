[package]
name = "shonin-executor"
description = "The attested Shonin executor: feeds, runner and signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "executor"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
strategy-sdk.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
hyperliquid.workspace = true
robinhood.workspace = true
lighter.workspace = true
ort.workspace = true
anyhow.workspace = true
axum.workspace = true
ciborium.workspace = true
clap.workspace = true
fastnum.workspace = true
futures.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The call hook times the host's work for each agent, which its fuel budget
# is charged for.
wasmtime = { workspace = true, features = ["call-hook"] }
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Keys made inside the enclave, from the operating system's randomness, and
# wiped from memory when dropped.
getrandom = "0.3.4"
zeroize = "1.9.0"
# Reading the claims of the attestation token the launcher hands out.
base64 = "0.22.1"
# The nonce an attestation token binds, as the attestation guest checks it.
shonin-attestation-core = { path = "../../attestation/core" }
# The root key: held here, served on the status port, passed to peers by
# attested exchange.
shonin-rootkey = { path = "../../rootkey" }

[dev-dependencies]
# A paused clock, so a test can wait out a receipt timeout without waiting.
tokio = { workspace = true, features = ["test-util"] }
# Asking the status port's routes without binding a port.
tower = { workspace = true, features = ["util"] }
# The attested path end to end (an ignored test): tokens signed by the
# fixture's test key, and the Confidential Space checker deployed.
shonin-attestation-core = { path = "../../attestation/core", features = ["fixture"] }
shonin-attestation-deploy = { path = "../../attestation/deploy" }

[lints]
workspace = true
