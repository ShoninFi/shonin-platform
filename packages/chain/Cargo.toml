[package]
name = "shonin-chain"
description = "Contract bindings and deployment addresses, for every target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "chain"

[features]
# Talking to a node. Native only: the web app encodes calls with this crate
# and sends them through the browser's own wallet.
rpc = ["dep:alloy", "dep:anyhow", "dep:tokio", "dep:tower", "dep:tracing", "dep:h2"]
# The arguments every service takes to choose its network and chain.
args = ["rpc", "solana", "dep:clap", "dep:tracing-subscriber"]
# Speaking to Solana: the programs' own crates for every account, instruction
# and event, and a JSON-RPC client for the node. Native only, like `rpc`.
solana = [
    "rpc",
    "dep:anchor-lang",
    "dep:anchor-spl",
    "dep:shonin-common",
    "dep:shonin-driver",
    "dep:shonin-registry",
    "dep:shonin-dev-verifier",
    "dep:shonin-cs-verifier",
    "dep:shonin-attestation-core",
    "dep:shonin-publishing",
    "dep:shonin-prices",
    "dep:shonin-profiles",
    "dep:shonin-station",
    "dep:shonin-vault",
    "dep:shonin-local-venue",
    "dep:shonin-local-driver",
    "dep:solana-transaction",
    "dep:solana-keypair",
    "dep:solana-signer",
    "dep:solana-compute-budget-interface",
    "dep:solana-ed25519-program",
    "dep:reqwest",
    "dep:bs58",
    "dep:base64",
    "dep:sha2",
    "dep:bincode",
    "dep:solana-message",
    "solana-message/bincode",
    "dep:solana-hash",
    "dep:solana-address-lookup-table-interface",
]
# Building the Solana programs' instructions and transactions on every
# target, the browser's included, without the programs' crates: their ids,
# addresses, instruction data and accounts, a transaction to sign. Each is
# checked against the programs' own crates by the tests. Program ids are
# compiled in as the programs compile theirs (`mainnet`, `devnet` or neither).
solana-ix = [
    "dep:solana-pubkey",
    "dep:solana-instruction",
    "dep:solana-message",
    "dep:solana-hash",
    "dep:borsh",
]
# Which network's program ids the programs' crates compile in (see
# contracts/solana/crates/shonin-program-id): with neither, the local deploy
# keypairs'; with one, the ids committed for that network. Set at most one,
# for a whole image. The stand-ins are never built for mainnet, so there they
# keep their local ids, which no mainnet deployment names.
mainnet = [
    "shonin-registry?/mainnet",
    "shonin-cs-verifier?/mainnet",
    "shonin-publishing?/mainnet",
    "shonin-prices?/mainnet",
    "shonin-profiles?/mainnet",
    "shonin-station?/mainnet",
    "shonin-vault?/mainnet",
]
devnet = [
    "shonin-registry?/devnet",
    "shonin-dev-verifier?/devnet",
    "shonin-cs-verifier?/devnet",
    "shonin-publishing?/devnet",
    "shonin-prices?/devnet",
    "shonin-profiles?/devnet",
    "shonin-station?/devnet",
    "shonin-vault?/devnet",
    "shonin-local-venue?/devnet",
    "shonin-local-driver?/devnet",
]

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
toml.workspace = true

alloy = { workspace = true, optional = true, features = ["json-rpc"] }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# The Solana programs' own crates, built for the host without their entry
# points: the single source of every account layout, instruction and event.
anchor-lang = { version = "0.32.1", optional = true }
anchor-spl = { version = "0.32.1", optional = true, default-features = false, features = ["token", "associated_token"] }
shonin-common = { path = "../../contracts/solana/crates/shonin-common", optional = true }
shonin-driver = { path = "../../contracts/solana/crates/shonin-driver", optional = true }
shonin-registry = { path = "../../contracts/solana/programs/shonin-registry", optional = true, features = ["no-entrypoint"] }
shonin-dev-verifier = { path = "../../contracts/solana/programs/shonin-dev-verifier", optional = true, features = ["no-entrypoint"] }
shonin-attestation-core = { path = "../attestation/core", optional = true }
shonin-cs-verifier = { path = "../../contracts/solana/programs/shonin-cs-verifier", optional = true, features = ["no-entrypoint"] }
shonin-publishing = { path = "../../contracts/solana/programs/shonin-publishing", optional = true, features = ["no-entrypoint"] }
shonin-prices = { path = "../../contracts/solana/programs/shonin-prices", optional = true, features = ["no-entrypoint"] }
shonin-profiles = { path = "../../contracts/solana/programs/shonin-profiles", optional = true, features = ["no-entrypoint"] }
shonin-station = { path = "../../contracts/solana/programs/shonin-station", optional = true, features = ["no-entrypoint"] }
shonin-vault = { path = "../../contracts/solana/programs/shonin-vault", optional = true, features = ["no-entrypoint"] }
shonin-local-venue = { path = "../../contracts/solana/programs/shonin-local-venue", optional = true, features = ["no-entrypoint"] }
shonin-local-driver = { path = "../../contracts/solana/programs/shonin-local-driver", optional = true, features = ["no-entrypoint"] }
solana-transaction = { version = "2.2", optional = true, features = ["bincode", "verify"] }
solana-keypair = { version = "2.2", optional = true }
solana-signer = { version = "2.2", optional = true }
solana-message = { version = "2.4", optional = true }
solana-hash = { version = "2.2", optional = true }
solana-address-lookup-table-interface = { version = "2.2", optional = true, features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = { version = "2.2", optional = true, features = ["borsh"] }
solana-ed25519-program = { version = "2.2", optional = true }
reqwest = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { workspace = true, optional = true }
bincode = { version = "1.3", optional = true }
solana-pubkey = { workspace = true, optional = true }
solana-instruction = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }

[build-dependencies]
shonin-program-id.workspace = true

[dev-dependencies]
http.workspace = true
bytes.workspace = true
# A paused clock, so a test can wait out a receipt timeout without waiting.
tokio = { workspace = true, features = ["test-util"] }
# What the `solana-ix` builders are checked against, byte for byte: the
# programs' own crates and the Solana SDK's own builders.
anchor-lang.workspace = true
anchor-spl.workspace = true
shonin-registry.workspace = true
shonin-publishing.workspace = true
shonin-prices.workspace = true
shonin-station.workspace = true
shonin-vault.workspace = true
shonin-local-venue.workspace = true
shonin-local-driver.workspace = true
solana-transaction.workspace = true
solana-compute-budget-interface.workspace = true
solana-ed25519-program.workspace = true
shonin-common.workspace = true
bincode.workspace = true
# The rules a station pins, which its account's layout carries.
shonin-driver = { path = "../../contracts/solana/crates/shonin-driver" }
# Log lines carry events in base64.
base64 = "0.22"

[lints]
workspace = true
