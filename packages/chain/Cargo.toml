[package]
name = "shonin-chain"
description = "Contract bindings and deployment addresses, for every target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "chain"

[features]
# Talking to a node. Native only: the web app encodes calls with this crate
# and sends them through the browser's own wallet.
rpc = ["dep:alloy", "dep:anyhow", "dep:tokio", "dep:tracing"]

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
serde.workspace = true
serde_json.workspace = true

alloy = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
