[package]
name = "shonin-api"
description = "The web app's server: runs the indexer in-process and serves the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
chain = { workspace = true, features = ["args"] }
indexer.workspace = true
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
