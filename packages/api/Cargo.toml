[package]
name = "shonin-api"
description = "The web app's server: runs the indexer in-process and serves the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
chain = { workspace = true, features = ["args"] }
indexer.workspace = true
# A purpose's canonical spelling, and which platform secrets are ever
# released, as the root key service decides them.
shonin-rootkey = { path = "../rootkey" }
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
time.workspace = true
# Asking the internal port's routes without binding a port.
tower = { workspace = true, features = ["util"] }
# Signing internal requests as a machine would.
shonin-rootkey = { path = "../rootkey", features = ["test-identity"] }

[lints]
workspace = true
