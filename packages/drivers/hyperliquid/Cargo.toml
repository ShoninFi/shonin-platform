[package]
name = "shonin-hyperliquid"
description = "Hyperliquid: the HyperCore API, its signing, and the driver's executor half"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Everything but the payload types: the API client, signing, the agent key's
# allowlist and the account's events. An agent built to WebAssembly turns the
# default off and uses only `payload`.
default = ["venue"]
venue = [
    "dep:alloy",
    "dep:anyhow",
    "dep:ciborium",
    "dep:futures",
    "dep:hex",
    "dep:reqwest",
    "dep:rmp-serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing",
]

[dependencies]
fastnum.workspace = true
serde.workspace = true

alloy = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
