[package]
name = "shonin-indexer"
description = "The reference indexer: reads the chain into the record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "indexer"

[[bin]]
name = "indexer"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
bs58.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
