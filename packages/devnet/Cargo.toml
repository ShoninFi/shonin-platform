[package]
name = "shonin-devnet"
description = "Deploys and drives the local development chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "devnet"
path = "src/main.rs"

[features]
# The network whose Solana program ids are compiled in; neither is local (see
# the chain crate's features).
mainnet = ["chain/mainnet"]
devnet = ["chain/devnet"]

[dependencies]
shared.workspace = true
hyperliquid.workspace = true
shonin-attestation-core = { path = "../attestation/core" }
shonin-attestation-deploy = { path = "../attestation/deploy" }
toml.workspace = true
chain = { workspace = true, features = ["args"] }
alloy.workspace = true
anyhow.workspace = true
bs58.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
