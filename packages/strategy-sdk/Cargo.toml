[package]
name = "shonin-strategy-sdk"
description = "Rust SDK for writing Shonin strategies as WASM components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
# Published on crates.io for authors to read and build against. The build
# service compiles every agent against its own copy of this crate.
publish = true
repository = "https://github.com/ShoninFi/shonin-platform"
homepage = "https://docs.shonin.fi/writing/"
readme = "README.md"
keywords = ["shonin", "wasm", "component", "trading", "agent"]
categories = ["wasm", "api-bindings"]

[lib]
name = "strategy_sdk"

[features]
# Each driver's typed payloads. They need nothing beyond what the SDK already
# uses, so they stay on by default; a driver's executor half turns off the
# rest.
default = ["hyperliquid", "lighter", "orca", "robinhood"]
hyperliquid = []
lighter = []
orca = []
robinhood = []

[dependencies]
ciborium.workspace = true
fastnum.workspace = true
futures.workspace = true
serde.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
