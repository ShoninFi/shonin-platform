[package]
name = "shonin-strategy-sdk"
description = "Rust SDK for writing Shonin strategies as WASM components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[lib]
name = "strategy_sdk"

[features]
# Each driver's typed payloads. They need nothing beyond what the SDK already
# uses, so they stay on by default; a driver's executor half turns off the
# rest.
default = ["hyperliquid", "lighter", "robinhood"]
hyperliquid = []
lighter = []
robinhood = []

[dependencies]
ciborium.workspace = true
fastnum.workspace = true
futures.workspace = true
serde.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
