[package]
name = "shonin-attestation"
description = "Proves a Confidential Space attestation in the zkVM, and checks such a proof."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "attestation-prover"
path = "src/bin/prover.rs"

[[bin]]
name = "attestation-fixture"
path = "src/bin/fixture.rs"
required-features = ["fixture"]

[features]
# Test tokens under a test key, and the binary that writes the contracts'
# Groth16 fixture.
fixture = ["shonin-attestation-core/fixture", "dep:sha3", "dep:base64"]

[dependencies]
shonin-attestation-core = { path = "../core" }
shonin-attestation-methods = { path = "../methods" }
# Proves through RISC Zero's `r0vm` (installed by `rzup`), so this crate
# builds without the prover's GPU kernels; `r0vm` wraps a Groth16 seal with
# RISC Zero's prover image in Docker.
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["client"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha3 = { version = "0.10.8", optional = true }
# The prover asks the executor's status port (plain HTTP inside the network).
ureq = { version = "3.4.2", default-features = false }
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
shonin-attestation-core = { path = "../core", features = ["fixture"] }
shonin-attestation-deploy = { path = "../deploy" }
