[package]
name = "shonin-app"
description = "The Shonin web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app"

# The app (wasm, built by Trunk).
[[bin]]
name = "app"
path = "src/main.rs"

# Build-time pre-render: per-route HTML, sitemap.xml, robots.txt and the
# Content-Security-Policy in _headers (native).
[[bin]]
name = "seo"
path = "src/bin/seo.rs"

[features]
# Dev-only pages (/_atoms). Only `task frontend:app:dev` turns it on; release
# builds never include them.
dev = []

[dependencies]
shared.workspace = true
ui.workspace = true
dominator.workspace = true
futures-signals.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "DomRect",
    "DomRectList",
    "DomTokenList",
    "Element",
    "EventTarget",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "Clipboard",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "FocusEvent",
    "Node",
    "NodeList",
    "Storage",
    "Url",
    "VisibilityState",
    "CssStyleDeclaration",
] }

# The pre-render runs natively at build time: it reads a snapshot over HTTP,
# hashes the loader it moves out of index.html and reads the chains' public
# endpoints for the policy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
futures.workspace = true
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
