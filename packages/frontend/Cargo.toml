[package]
name = "shonin-frontend"
description = "The Shonin web app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "frontend"

# The app (wasm, built by Trunk).
[[bin]]
name = "frontend"
path = "src/main.rs"

# Build-time SEO: per-route HTML, sitemap.xml, robots.txt (native).
[[bin]]
name = "seo"
path = "src/bin/seo.rs"

[dependencies]
shared.workspace = true
chain.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
dominator.workspace = true
futures-signals.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "FileList",
    "File",
    "DragEvent",
    "DataTransfer",
    "Navigator",
    "Clipboard",
    "KeyboardEvent",
    "MouseEvent",
    "Storage",
    "Url",
] }

# The pre-render runs natively at build time and reads a snapshot over HTTP,
# which the browser does through its own fetch instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }

[lints]
workspace = true
