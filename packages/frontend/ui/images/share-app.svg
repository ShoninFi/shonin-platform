<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- app.shonin.fi's share image (Open Graph and X cards): the app's paper,
       its headline and a sketch of the agents list. The list carries no
       names and no figures, only the shapes of the rows: the image must never
       show a number nobody measured. Colours are the design tokens' values
       (tokens.json): paper #f6f7fb, paper-raised #ffffff, paper-sunk
       #eceff6, line #dde1ec, line-strong #b9c1d6, ink #0e1433, ink-muted
       #3a5290, brand #0152de, brand-soft #e6edfd, brand-edge #c9d7f8,
       mark-sky #2bbcfe. Rasterised by render.sh. -->
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; font-weight: 200 800; src: url("../fonts/PlusJakartaSans-Variable.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url("../fonts/HankenGrotesk-Variable.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../fonts/JetBrainsMono-Variable.woff2") format("woff2"); }
    .eyebrow { font: 650 16px "Hanken Grotesk"; letter-spacing: 0.2em; fill: #3a5290; }
    .title { font: 800 50px "Plus Jakarta Sans"; letter-spacing: -0.025em; fill: #0e1433; }
    .col { font: 650 13px "Hanken Grotesk"; letter-spacing: 0.08em; fill: #3a5290; }
    .host { font: 450 20px "JetBrains Mono"; fill: #3a5290; }
  </style>
  <defs>
    <pattern id="hexgrid" width="56" height="97" patternUnits="userSpaceOnUse">
      <path d="M28 0 L56 16.2 L56 48.5 L28 64.7 L0 48.5 L0 16.2 Z M28 64.7 L28 97" fill="none" stroke="#dde1ec" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f7fb"/>
      <stop offset="0.45" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#f6f7fb" stop-opacity="0.2"/>
    </linearGradient>
    <!-- An agent's avatar: a soft hexagon. -->
    <path id="hex" d="M-1.9 -15.4 Q0 -16.5 1.9 -15.4 L12.4 -9.3 Q14.3 -8.2 14.3 -6 L14.3 6 Q14.3 8.2 12.4 9.3 L1.9 15.4 Q0 16.5 -1.9 15.4 L-12.4 9.3 Q-14.3 8.2 -14.3 6 L-14.3 -6 Q-14.3 -8.2 -12.4 -9.3 Z"/>
    <!-- The review seal: the hero's checked hexagon. -->
    <g id="seal">
      <path d="M-1.4 -11.2 Q0 -12 1.4 -11.2 L9 -6.8 Q10.4 -6 10.4 -4.3 L10.4 4.3 Q10.4 6 9 6.8 L1.4 11.2 Q0 12 -1.4 11.2 L-9 6.8 Q-10.4 6 -10.4 4.3 L-10.4 -4.3 Q-10.4 -6 -9 -6.8 Z" fill="#0152de"/>
      <path d="M-4.5 0.3 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#f6f7fb"/>
  <rect width="1200" height="630" fill="url(#hexgrid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- The words. -->
  <image href="../logos/shonin-lockup.svg" x="80" y="68" width="136" height="44"/>
  <text class="eyebrow" x="80" y="226">AGENTS</text>
  <text class="title" x="78" y="290">Every agent&#8217;s review,</text>
  <text class="title" x="78" y="350">record and exit, read</text>
  <text class="title" x="78" y="410">from its own contracts</text>
  <text class="host" x="80" y="558">app.shonin.fi</text>

  <!-- The list. -->
  <rect x="672" y="128" width="456" height="370" rx="16" fill="#ffffff" stroke="#dde1ec" stroke-width="1.5"/>
  <text class="col" x="696" y="170">AGENT</text>
  <text class="col" x="902" y="170" text-anchor="middle">REVIEW</text>
  <text class="col" x="954" y="170">RECORD</text>
  <text class="col" x="1058" y="170">EXIT</text>
  <line x1="673" y1="190" x2="1127" y2="190" stroke="#dde1ec" stroke-width="1.5"/>

  <g transform="translate(0 228)">
    <use href="#hex" x="704" fill="#e6edfd" stroke="#c9d7f8" stroke-width="1.5"/>
    <rect x="732" y="-12" width="118" height="10" rx="5" fill="#0e1433"/>
    <rect x="732" y="5" width="64" height="8" rx="4" fill="#b9c1d6"/>
    <use href="#seal" x="902"/>
    <rect x="954" y="-5" width="84" height="10" rx="5" fill="#eceff6"/>
    <rect x="1058" y="-12" width="46" height="24" rx="6" fill="none" stroke="#dde1ec" stroke-width="1.5"/>
    <path d="M1079 -4 l4 4 l-4 4" fill="none" stroke="#3a5290" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="673" y1="266" x2="1127" y2="266" stroke="#eceff6" stroke-width="1.5"/>
  <g transform="translate(0 304)">
    <use href="#hex" x="704" fill="#e6edfd" stroke="#c9d7f8" stroke-width="1.5"/>
    <rect x="732" y="-12" width="94" height="10" rx="5" fill="#0e1433"/>
    <rect x="732" y="5" width="52" height="8" rx="4" fill="#b9c1d6"/>
    <use href="#seal" x="902"/>
    <rect x="954" y="-5" width="64" height="10" rx="5" fill="#eceff6"/>
    <rect x="1058" y="-12" width="46" height="24" rx="6" fill="none" stroke="#dde1ec" stroke-width="1.5"/>
    <path d="M1079 -4 l4 4 l-4 4" fill="none" stroke="#3a5290" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="673" y1="342" x2="1127" y2="342" stroke="#eceff6" stroke-width="1.5"/>
  <g transform="translate(0 380)">
    <use href="#hex" x="704" fill="#e6edfd" stroke="#c9d7f8" stroke-width="1.5"/>
    <rect x="732" y="-12" width="128" height="10" rx="5" fill="#0e1433"/>
    <rect x="732" y="5" width="72" height="8" rx="4" fill="#b9c1d6"/>
    <use href="#seal" x="902"/>
    <rect x="954" y="-5" width="76" height="10" rx="5" fill="#eceff6"/>
    <rect x="1058" y="-12" width="46" height="24" rx="6" fill="none" stroke="#dde1ec" stroke-width="1.5"/>
    <path d="M1079 -4 l4 4 l-4 4" fill="none" stroke="#3a5290" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="673" y1="418" x2="1127" y2="418" stroke="#eceff6" stroke-width="1.5"/>
  <g transform="translate(0 456)">
    <use href="#hex" x="704" fill="#e6edfd" stroke="#c9d7f8" stroke-width="1.5"/>
    <rect x="732" y="-12" width="104" height="10" rx="5" fill="#0e1433"/>
    <rect x="732" y="5" width="58" height="8" rx="4" fill="#b9c1d6"/>
    <use href="#seal" x="902"/>
    <rect x="954" y="-5" width="56" height="10" rx="5" fill="#eceff6"/>
    <rect x="1058" y="-12" width="46" height="24" rx="6" fill="none" stroke="#dde1ec" stroke-width="1.5"/>
    <path d="M1079 -4 l4 4 l-4 4" fill="none" stroke="#3a5290" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The mark, seated on the list's corner. -->
  <image href="../logos/shonin-mark.svg" x="1091" y="472" width="74" height="80"/>
</svg>
