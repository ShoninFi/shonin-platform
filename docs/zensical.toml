# The public documentation site (docs.shonin.fi).
#
# Content lives in `content/`, the built site in `site/` (gitignored). Both are
# relative to this file, which is the project root as far as Zensical is
# concerned. `task docs:dev` serves it; `task docs:deploy` publishes it.
#
# This site is public. It describes how Shonin works and what is left to
# build. Anything that is not a mechanism a reader can check belongs in the
# handbook instead.

[project]
site_name = "Shonin Docs"
site_description = "How Shonin works: verifiable trading strategies, pooled vaults, and attested execution"
site_author = "Shonin"
site_url = "https://docs.shonin.fi/"
copyright = "Copyright &copy; 2026 Shonin"
docs_dir = "content"
site_dir = "site"
extra_css = ["stylesheets/theme.css"]
extra_javascript = ["javascripts/diagrams.js"]
# No repo_url yet: the repository is not public, so a header link would be a
# 404 for every reader, and the theme would fetch its stats on every page.
nav = [
    {"Start here" = "index.md"},
    {"Putting money in" = "depositors.md"},
    {"Publishing a strategy" = "authors.md"},
    {"Verify it yourself" = "verify.md"},
    {"Technical deep-dive" = [
        {"The whole system" = "how-it-works/index.md"},
        {"Vaults" = "how-it-works/vaults.md"},
        {"Strategies" = "how-it-works/strategies.md"},
        {"Publishing" = "how-it-works/publishing.md"},
        {"The review" = "how-it-works/review.md"},
        {"Attested execution" = "how-it-works/execution.md"},
        {"The record" = "how-it-works/record.md"},
    ]},
    {"Run it locally" = "run-locally.md"},
    {"Build checklist" = "checklist.md"},
    {"Reference" = [
        {"Parameters" = "reference/parameters.md"},
        {"The API" = "reference/api.md"},
        {"Glossary" = "reference/glossary.md"},
    ]},
]

[project.extra]
generator = false

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    # Our own class, not the theme's: its Mermaid integration empties the
    # block without drawing into it, so javascripts/diagrams.js draws them.
    { name = "mermaid", class = "shonin-diagram", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
