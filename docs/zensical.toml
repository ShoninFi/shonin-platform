# The public documentation site (docs.shonin.fi).
#
# Content lives in `content/`, the built site in `site/` (gitignored). Both are
# relative to this file, which is the project root as far as Zensical is
# concerned. `task docs:dev` serves it; `task docs:deploy` publishes it.
#
# This site is public. It describes how Shonin works and what is left to
# build. Anything that is not a mechanism a reader can check belongs in the
# handbook instead.

[project]
site_name = "Shonin Docs"
site_description = "How Shonin works: trading agents you can read, pooled vaults, and attested execution"
site_author = "Shonin"
site_url = "https://docs.shonin.fi/"
copyright = "These docs describe the platform as designed; the <a href=\"/checklist/\">build checklist</a> records what is built. &middot; Copyright &copy; 2026 Shonin"
docs_dir = "content"
site_dir = "site"
extra_css = ["stylesheets/theme.css"]
extra_javascript = ["javascripts/diagrams.js", "javascripts/flow-sim.js"]
# The theme's source-repository slot is used for a permanent header link to
# the main site (overrides/partials/source.html retitles it). It is not a
# GitHub URL, so the theme fetches no repository stats for it.
repo_url = "https://shonin.fi/"
repo_name = "shonin.fi"
nav = [
    {"Welcome" = "index.md"},
    {"Using Shonin" = [
        {"Depositors" = "depositors.md"},
        {"Authors" = "authors.md"},
    ]},
    {"System Overview" = [
        {"Trading agents" = "basics/trading-agents.md"},
        {"AI Review" = "basics/ai-review.md"},
        {"Attested machines" = "basics/attested-machines.md"},
        {"Trade-only keys" = "basics/trade-only-keys.md"},
        {"Smart contracts" = "basics/smart-contracts.md"},
        {"The tank" = "tank.md"},
        {"Fees" = "fees.md"},
        {"Money flow" = "flow.md"},
        {"Verification" = "verify.md"},
    ]},
    {"Writing an Agent" = [
        {"Getting started" = "writing/getting-started.md"},
        {"Configuration" = "writing/configuration.md"},
        {"Services" = "writing/services.md"},
        {"Example: a rebalancer" = "writing/rebalancer.md"},
        {"Publishing" = "writing/publishing.md"},
    ]},
    {"Under the hood" = [
        {"How the machines work" = "under-the-hood/machines.md"},
        {"The vault contract" = "under-the-hood/vaults.md"},
    ]},
    {"Reference" = [
        {"Supported venues" = "reference/venues.md"},
        {"The API" = "reference/api.md"},
        {"Glossary" = "reference/glossary.md"},
    ]},
    {"Build checklist" = "checklist.md"},
]

[project.extra]
generator = false

[project.theme]
custom_dir = "overrides"
language = "en"
icon.repo = "lucide/globe"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

# Light only: a single palette, so the theme shows no switcher.
[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    # Our own class, not the theme's: its Mermaid integration empties the
    # block without drawing into it, so javascripts/diagrams.js draws them.
    { name = "mermaid", class = "shonin-diagram", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
