# The images, built in Google Cloud Build rather than cross-built on a
# laptop: `task cloud:push NAME=<name|all> NETWORK=testnet BUILDER=cloud`
# stages the source (tracked files only, never .env, .shonin or a target
# directory), the network's public deployment files (`_deployments/`) and,
# for the prover, the reproducibly built guest (`_guest/`), and submits this.
#
# Each image is built by BuildKit on a high-CPU worker (the largest the
# project's quota allows: 8 CPUs, one build at a time). Its compiled
# dependencies are an image of their own in the registry
# (`<registry>/deps-<name>:<what they are made from>`, cloudbuild/build.sh),
# so a build whose Cargo.lock and manifests are unchanged compiles only the
# platform's own crates. The images named in `_NAMES` build side by side;
# the others are passed over.
#
# The images are pushed as plain image manifests (no provenance index), as
# `docker push` would: the executor is launched and attested by its digest.

substitutions:
  _NAMES: "api keeper executor prover"
  _TAG: "scratch"
  _REGISTRY: "europe-west4-docker.pkg.dev/shonin-testnet/shonin"
  _NETWORK: "testnet"
  _NETWORK_FEATURE: "none"
  _WITHOUT_SOLANA: "1"
  _STORE_URL: ""
  _API_URL: ""
  _EXECUTOR_URL: ""

steps:
  # A BuildKit builder of its own (the steps share it: they run on one
  # worker's Docker), so the images' common stages are built once.
  - id: builder
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        docker buildx version
        docker buildx create --name shonin --driver docker-container --bootstrap --use

  - id: api
    waitFor: [builder]
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [deploy/gcp/cloudbuild/build.sh, api]
    env: &settings
      - NAMES=${_NAMES}
      - TAG=${_TAG}
      - REGISTRY=${_REGISTRY}
      - NETWORK=${_NETWORK}
      - NETWORK_FEATURE=${_NETWORK_FEATURE}
      - WITHOUT_SOLANA=${_WITHOUT_SOLANA}
      - STORE_URL=${_STORE_URL}
      - API_URL=${_API_URL}
      - EXECUTOR_URL=${_EXECUTOR_URL}

  - id: keeper
    waitFor: [builder]
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [deploy/gcp/cloudbuild/build.sh, keeper]
    env: *settings

  - id: executor
    waitFor: [builder]
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [deploy/gcp/cloudbuild/build.sh, executor]
    env: *settings

  - id: prover
    waitFor: [builder]
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: [deploy/gcp/cloudbuild/build.sh, prover]
    env: *settings

serviceAccount: projects/shonin-testnet/serviceAccounts/shonin-cloudbuild@shonin-testnet.iam.gserviceaccount.com
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
