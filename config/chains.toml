# Every chain the platform knows, keyed "kind:id": an EVM chain by its chain
# id, a Solana cluster by its name. Nothing here is secret.
#
# Endpoint overrides come from .env as SHONIN_RPC_<KIND>_<ID> and
# SHONIN_WS_<KIND>_<ID>, the id upper-cased with anything but letters and
# digits turned into "_" (SHONIN_RPC_EVM_8453, SHONIN_RPC_SOLANA_MAINNET_BETA).
# Paid RPC URLs carry keys, so they only ever go there.
#
# `logs_rpc` (optional, space-separated like `rpc`) names endpoints for log
# queries alone: every eth_getLogs goes through a failover over them, and
# nothing else does. `log_range` (optional, a positive whole number) is the
# most blocks one log query may span, both ends included; a range is read in
# windows of at most that many. The width belongs to the list log queries go
# to (`logs_rpc`, or `rpc` without it), not to one endpoint, since the
# failover picks the endpoint beneath each query: it must suit every endpoint
# in that list. Without them, logs use `rpc` and a range is asked for whole,
# halved when an endpoint refuses it as too wide. Both are overridden from
# .env as SHONIN_LOGS_RPC_<KIND>_<ID> and SHONIN_LOG_RANGE_<KIND>_<ID>.
#
# An endpoint that answers a read by saying it no longer keeps the state asked
# for (pruned, "historical state ... is not available") counts as failing, and
# the read goes on to the next endpoint in the list.
#
# `dollar` is the stablecoin a vault on that chain settles in.
#
# `native_usd` is what the chain's coin is taken to be worth, for billing an
# author the gas their agent's key spends. On the local chains it is a stand-in
# and a testnet's coin is free. A chain without one bills no gas at all, and
# the executor says so in its log: an author never pays for gas nobody priced.
#
# `confirmations` is how many blocks deep a payment must be before the build
# service reads it: 12 where none is given. The local anvils never reorg and
# answer from one node, so they read payments at the head.

# --- Local: what `task dev` starts (ports match taskfiles/config.yml) --------

# Reader cadences and resource bounds, in milliseconds unless otherwise named.
# The keeper must separately check vault timer compatibility before work;
# these limits alone do not prove that a valuation window can be met.
[rpc.defaults]
# Head and event checks retain the existing two-second round cadence.
head_poll_ms = 2000
event_scan_ms = 2000
# Lookahead covers both observation cadences and the header read budget.
# Ordinary action preparation/landing needs a separate timer check.
due_lookahead_ms = 5000
# Bounds optional header observations; it never cancels a money transaction.
read_budget_ms = 1000
# Optional quiet proofs run away from action loops. Failed/slow proofs leave
# ordinary active reads in place; this retry affects savings, not money wakes.
quiet_probe_budget_ms = 10000
quiet_probe_retry_ms = 60000
# Solana rate-limit retries retain their established 5s-to-2min backoff.
# Shorter waits may recover sooner; limits refuse a longer inherited wait.
keeper_rate_limit_initial_ms = 5000
keeper_rate_limit_max_ms = 120000
keeper_rate_limit_backoff_factor = 2
# Active record reads retain their current cadence; idle backoff is bounded.
indexer_poll_ms = 2000
indexer_idle_max_ms = 60000
# The dated record becomes unhealthy after this much time without a whole
# read. At least two maximum idle intervals leave room for a missed refresh.
indexer_stale_ms = 180000
indexer_backoff_factor = 2
# Counts trigger earlier Solana discovery. Zero requests a scan every look.
solana_rescan_ms = 300000
# Key relay/stocking keep their independent polling and existing look cadence.
# Key cadences may shorten the established wait; longer values are refused
# until their expiry and gas-funding margins have a separate proof.
key_poll_ms = 2000
key_look_ms = 15000
# Catch-up work is bounded per pass; unfinished cursors continue next pass.
history_page_reads = 48
# Each selected-head comparison and historical ancestry pass gets this many
# bounded reads. Exhaustion keeps the record dated; sparse progress is retained.
ancestry_reads = 64
# Sparse checkpoints and recently walked headers; eviction affects catch-up
# cost only. Keep at least a complete configured log page plus its anchors.
ancestry_cache_headers = 8192
# One refresh may share these bounded, numbered log observations. Wider or
# uncovered requests use their ordinary incremental reads instead.
log_batch_addresses = 256
log_batch_blocks = 2000
log_batch_logs = 10000
solana_history_transactions = 64
# Read-only aggregation must fall back on unsupported/oversized/failed views.
# These are item, byte and gas limits, not permission to cache a money read.
view_batch_reads = 64
view_batch_input_bytes = 262144
view_result_bytes = 16384
view_inner_gas = 100000
view_outer_gas = 10000000

# Override individual values under [rpc.chains."kind:id"] when a chain needs
# another policy; omitted values continue to use the configured defaults.

[chains."evm:31337"]
label = "Base (local)"
