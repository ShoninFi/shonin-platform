# Every chain the platform knows, keyed "kind:id": an EVM chain by its chain
# id, a Solana cluster by its name. Nothing here is secret.
#
# Endpoint overrides come from .env as SHONIN_RPC_<KIND>_<ID> and
# SHONIN_WS_<KIND>_<ID>, the id upper-cased with anything but letters and
# digits turned into "_" (SHONIN_RPC_EVM_8453, SHONIN_RPC_SOLANA_MAINNET_BETA).
# Paid RPC URLs carry keys, so they only ever go there.
#
# `logs_rpc` (optional, space-separated like `rpc`) names endpoints for log
# queries alone: every eth_getLogs goes through a failover over them, and
# nothing else does. `log_range` (optional, a positive whole number) is the
# most blocks one log query may span, both ends included; a range is read in
# windows of at most that many. The width belongs to the list log queries go
# to (`logs_rpc`, or `rpc` without it), not to one endpoint, since the
# failover picks the endpoint beneath each query: it must suit every endpoint
# in that list. Without them, logs use `rpc` and a range is asked for whole,
# halved when an endpoint refuses it as too wide. Both are overridden from
# .env as SHONIN_LOGS_RPC_<KIND>_<ID> and SHONIN_LOG_RANGE_<KIND>_<ID>.
#
# An endpoint that answers a read by saying it no longer keeps the state asked
# for (pruned, "historical state ... is not available") counts as failing, and
# the read goes on to the next endpoint in the list.
#
# `dollar` is the stablecoin a vault on that chain settles in.
#
# `native_usd` is what the chain's coin is taken to be worth, for billing an
# author the gas their agent's key spends. On the local chains it is a stand-in
# and a testnet's coin is free. A chain without one bills no gas at all, and
# the executor says so in its log: an author never pays for gas nobody priced.
#
# `confirmations` is how many blocks deep a payment must be before the build
# service reads it: 12 where none is given. The local anvils never reorg and
# answer from one node, so they read payments at the head.

# --- Local: what `task dev` starts (ports match taskfiles/config.yml) --------

[chains."evm:31337"]
label = "Base (local)"
rpc = "http://127.0.0.1:19100"
dollar = "USDC"
native_usd = 2500.0
confirmations = 0

[chains."evm:31338"]
label = "Hyperliquid (local)"
rpc = "http://127.0.0.1:19101"
dollar = "USDC"
native_usd = 25.0
confirmations = 0

[chains."evm:31339"]
label = "Robinhood Chain (local)"
rpc = "http://127.0.0.1:19102"
dollar = "USDG"
native_usd = 2500.0
confirmations = 0

[chains."solana:localnet"]
label = "Solana (local)"
rpc = "http://127.0.0.1:19110"
ws = "ws://127.0.0.1:19111"
dollar = "USDC"

# --- Testnets ----------------------------------------------------------------

# Base's own endpoint allows 25 requests a second from one address and log
# ranges of 500 blocks; the services on one machine pass that, so two more
# public endpoints share the load.
[chains."evm:84532"]
label = "Base Sepolia"
rpc = "https://sepolia.base.org https://base-sepolia-rpc.publicnode.com https://base-sepolia.drpc.org"
dollar = "USDC"
native_usd = 0.0

# Every free public endpoint for HyperEVM's testnet limits how fast one
# address may ask, and a whole stack on one machine passes any one of their
# limits within minutes, so the testnet names three: the client sends each
# request to whichever has answered best lately and moves off one that starts
# refusing. A browser is handed the first.
#
# drpc's is first: asked an account's nonce at a past block, it answers as of
# that block, while Hyperliquid's own and Chainlink's answer any block with
# the head's state (measured October 2026). The client sends no read pinned to
# a past block to an endpoint it finds doing that, and asks one it couldn't
# check only after those it found honouring the block.
[chains."evm:998"]
label = "Hyperliquid testnet"
rpc = "https://hyperliquid-testnet.drpc.org https://rpc.hyperliquid-testnet.xyz/evm https://rpcs.chain.link/hyperevm/testnet"
dollar = "USDC"
native_usd = 0.0

[chains."evm:46630"]
label = "Robinhood Chain testnet"
rpc = "https://rpc.testnet.chain.robinhood.com"
dollar = "USDG"
native_usd = 0.0

[chains."solana:devnet"]
label = "Solana devnet"
rpc = "https://api.devnet.solana.com"
ws = "wss://api.devnet.solana.com"
dollar = "USDC"

# --- Mainnets ----------------------------------------------------------------

[chains."evm:8453"]
label = "Base"
rpc = "https://mainnet.base.org"
dollar = "USDC"

[chains."evm:999"]
label = "Hyperliquid"
rpc = "https://rpc.hyperliquid.xyz/evm"
dollar = "USDC"

[chains."evm:4663"]
label = "Robinhood Chain"
rpc = "https://rpc.mainnet.chain.robinhood.com"
dollar = "USDG"

[chains."solana:mainnet-beta"]
label = "Solana"
rpc = "https://api.mainnet-beta.solana.com"
ws = "wss://api.mainnet-beta.solana.com"
dollar = "USDC"

# --- Networks: which chain each vault chain means ----------------------------
# Choose one with SHONIN_NETWORK (or --network / NETWORK=). The names on the
# left are the vault chains a strategy's shonin.toml names.
#
# `root` names the vault chain canonical for the root key: its
# AttestationRegistry holds the root key's record (`rootKey()`), and its
# allowlist decides which attested images may be given the root or a key
# derived from it. It must be one of the network's EVM chains. Mainnet names
# none yet, so it has no root key.

[networks.local]
base = "evm:31337"
hyperliquid = "evm:31338"
robinhood = "evm:31339"
solana = "solana:localnet"
root = "base"

[networks.testnet]
base = "evm:84532"
hyperliquid = "evm:998"
robinhood = "evm:46630"
solana = "solana:devnet"
root = "base"

[networks.mainnet]
base = "evm:8453"
hyperliquid = "evm:999"
robinhood = "evm:4663"
solana = "solana:mainnet-beta"

# --- RPC settings: how often the services read a chain, and how much at once -
# Whole milliseconds unless a name says otherwise. [rpc.defaults] holds every
# setting for every chain; [rpc.chains."kind:id"] changes only the settings it
# lists, for a chain configured above. A value outside its range, or an
# unknown name, stops the service at startup with the setting named. The
# keeper also checks each vault's timers against these at startup.

# One queue and one connection-discovery loop serve the whole process.
[rpc.service]
# How soon a queued job is picked up, against one read per poll. 1000..=2000.
indexer_queue_poll_ms = 2000
# How soon a new connection is found, against one read per poll. 1000..=2000.
indexer_discovery_poll_ms = 2000

[rpc.defaults]
# --- Keeper (EVM)
# Pace when no bounded schedule applies: unbounded, landing, or after a failed
# observation. Faster reacts sooner, at more reads. 250..=2000.
keeper_active_round_ms = 2000
# Longest gap between observations, so how soon an outsider's transaction is
# seen, against a read per observation. keeper_active_round_ms..=60000.
keeper_notice_ms = 5000
# Backstop scan for facts only logs carry, against a log read per scan.
# keeper_notice_ms..=3600000.
keeper_log_scan_ms = 300000
# How soon a landed transaction is known, against receipt reads. 100..=7000.
receipt_poll_ms = 2000
# Wait after a node fails to simulate: first wait, longest wait and growth
# per failure. Shorter recovers sooner, at more reads. 1000..=5000,
# keeper_simulation_initial_ms..=300000 (and at least 1000), 1..=2.
keeper_simulation_initial_ms = 5000
keeper_simulation_max_ms = 300000
keeper_simulation_backoff_factor = 2
# Wait after an endpoint rate-limits a request: first wait, longest wait and
# growth per refusal. Shorter recovers sooner, at the risk of further refusals.
# 1..=5000, keeper_rate_limit_initial_ms..=120000, 1..=2.
keeper_rate_limit_initial_ms = 5000
keeper_rate_limit_max_ms = 120000
keeper_rate_limit_backoff_factor = 2
# How soon a key request is relayed, against one read per poll. 250..=2000.
key_poll_ms = 2000
# How often keys are looked over for renewal and stocking, against reads per
# look. 250..=15000.
key_look_ms = 15000
# The keeper says at warn, at most every six hours, when its own account on a
# chain holds less than a week's spending at its rate since its last top-up,
# or less than this floor, whichever is higher: millionths of the chain's
# coin. Zero leaves only the week's spending. 0..=1000000000000.
keeper_balance_floor_micro = 0

# --- Chain clock and observation
# How old a head may be and still be scheduled from; an older one sends the
# keeper to the active pace. 500..=30000.
head_lag_max_ms = 3000
# How far a head's time may run ahead of the local clock before it is taken
# as skew. 0..=10000.
head_ahead_max_ms = 2000
# Agreeing observations needed before leaving the active pace: steadier
# against a jittery clock, slower to settle. 1..=20.
clock_settle_observations = 3
# The time one observation may take; the startup checks count on it.
# 100..=10000.
read_budget_ms = 1000
# Reads in one batched call: fewer means more calls. 1..=512.
view_batch_reads = 256
# Gas for one batched call, and for each read inside it; split to fit an
# endpoint's cap. 1000000..=100000000, 21000..=1000000.
view_outer_gas = 30000000
view_inner_gas = 1000000
# Bytes of input one batched call may send. 1024..=1048576.
view_batch_input_bytes = 262144
# Bytes one read inside a batch may return; a longer answer is read alone.
# 32..=16384.
view_result_bytes = 1024
# Bytes one batched call may return in all. 65536..=1048576.
view_output_bytes = 400000
# Deepest reorganisation rolled back block by block; a deeper one is a full
# re-read. 1..=256.
max_reorg_blocks = 256

# --- Record
# How fresh the public record is, against reads per refresh per chain.
# 2000..=300000.
record_refresh_ms = 30000
# Time without a whole refresh before the record reports itself unhealthy.
# At least 2 * the slower refresh + read_budget_ms, at most 86400000.
record_stale_ms = 180000
# Blocks in one log page, and pages read per refresh: catch-up speed against
# the size of each read. 1..=10000, 1..=100.
record_page_blocks = 2000
record_pages_per_refresh = 25
# Newest blocks read again on each refresh, to catch a shallow
# reorganisation. 0..=max_reorg_blocks.
record_overlap_blocks = 32
# Checkpoints kept: memory, against how deep a reorganisation can be undone
# without a full re-read. 2..=256.
record_checkpoints = 16
# Most addresses in one log filter: fewer means more log reads. 1..=1024.
log_batch_addresses = 256
# Entries and bytes of settled facts kept in memory instead of read again;
# zero keeps none. 0..=65536, 0..=67108864.
immutable_cache_entries = 1024
immutable_cache_bytes = 1048576

# --- Solana
# Pace and longest gap between observations, as their EVM counterparts.
# 250..=2000, solana_active_round_ms..=60000.
solana_active_round_ms = 2000
solana_notice_ms = 5000
# How fresh the public record is for a Solana cluster. 2000..=300000.
solana_record_refresh_ms = 30000
# Longest gap between full scans for new accounts; zero scans on every look.
# 0..=86400000.
solana_rescan_ms = 300000
# Rounds between checks for rent to reclaim: sooner returns rent, at more
# reads. 1..=30.
solana_rent_poll_rounds = 30
# Transactions read per history page. 1..=4096.
solana_history_transactions = 64

# Per chain: receipts are polled at the block interval, and a head's allowed
# age and lead follow how the chain produces and reports blocks, and the
# keeper says at warn when its own account holds less than its floor.

[rpc.chains."evm:31337"]
head_lag_max_ms = 4000

[rpc.chains."evm:31338"]
receipt_poll_ms = 1000

[rpc.chains."evm:31339"]
receipt_poll_ms = 500

[rpc.chains."solana:localnet"]
head_lag_max_ms = 10000
head_ahead_max_ms = 5000

[rpc.chains."evm:84532"]
head_lag_max_ms = 4000
keeper_balance_floor_micro = 2000

[rpc.chains."evm:998"]
receipt_poll_ms = 1000
keeper_balance_floor_micro = 100000

[rpc.chains."evm:46630"]
receipt_poll_ms = 500
keeper_balance_floor_micro = 2000

[rpc.chains."solana:devnet"]
head_lag_max_ms = 10000
head_ahead_max_ms = 5000
keeper_balance_floor_micro = 200000

[rpc.chains."evm:8453"]
head_lag_max_ms = 4000

[rpc.chains."evm:999"]
receipt_poll_ms = 1000

[rpc.chains."evm:4663"]
receipt_poll_ms = 500

[rpc.chains."solana:mainnet-beta"]
head_lag_max_ms = 10000
head_ahead_max_ms = 5000
