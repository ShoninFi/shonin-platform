# What `task chains:fund NETWORK=testnet` tops each role account up to, in the
# chain's own coin, from the funder (the EVM mnemonic's account
# m/44'/60'/0'/0/100). A role already holding its amount is left alone, so the
# task is safe to run again. `default` covers every role not named.
#
# The funder keeps `reserve` for itself and funds nothing past it: a role it
# can't fully top up is reported, not half-funded.
#
# `market` is testnet-market's account (m/44'/60'/0'/0/101 of the EVM
# mnemonic, not a role), on the chains whose pools it keeps: a month of its
# mirror posts (one each time a mainnet feed moves) and its swaps (with a
# dollar mint before a buy where the dollar is mintable), at the chain's
# usual gas price. `task chains:fund` tops it up with the roles.
#
# The executor holds no role account: the keeper relays every blessing the
# executor publishes and, once the chain shows a vault's key blessed, stakes
# that key with gas: 0.0005 of the chain's coin on a public chain, or three
# of the key's worst-case sends if that is more. So the keeper's amount
# covers a stake for every vault key a run makes (the full seed activates
# four; a handover makes one more), the blessings it relays (a Groth16 check
# is a few hundred thousand gas, renewed every day or so) and its own sends,
# or a vault is taken on by nobody and its agent never starts. The executor
# role is given nothing.

[testnet."evm:84532"] # Base Sepolia, ETH
reserve = 0.01
default = 0.004
admin = 0.03
executor = 0
keeper = 0.02
author = 0.008
market = 0.005

[testnet."evm:998"] # Hyperliquid testnet's HyperEVM, HYPE
reserve = 0.05
default = 0.03
admin = 0.4
executor = 0
keeper = 0.2
author = 0.06

# The funder here is thin (a few hundredths of an ETH at most), so only
# what the live vaults need for about two weeks unattended: the keeper's
# vault-key stakes (one more for a handover), the blessings and its own
# sends; and the market operator's posts, every ten minutes, at about
# 0.00014 ETH a day.
[testnet."evm:46630"] # Robinhood Chain testnet, ETH
reserve = 0.0015
default = 0.0003
admin = 0.004
executor = 0
keeper = 0.006
operator = 0.002
author = 0.001
market = 0.005

# Solana devnet, SOL. The funder is the deployer (m/44'/501'/0'/0' of the
# Solana mnemonic), which paid for the programs; `task chains:solana-setup
# NETWORK=testnet` tops each role up by transfer (devnet's faucet is
# rate-limited), and its own set-up's rent and fees come out of the reserve.
# Each amount is 0.001 SOL or more, or 0. Enough for a week of sends at
# 5,000 lamports a signature, with room for the rent the keys put into
# accounts: the keeper's lookup tables, the blessings it relays and the
# vault keys it stocks (0.05 SOL each, once the registry vouches for them; a
# handover makes one more); the author's activations (a vault, its station,
# their dollar accounts); the operator's market listings and its posts every
# ten minutes. The executor, the platform and the attestor sign no
# transaction there: the executor's keys are made in the enclave and stocked
# by the keeper.
#
# `market` is testnet-market's Solana account (m/44'/501'/111'/0'): a month
# of its swaps in Orca's pool and its seed's resets (a few thousand
# lamports each), the tick arrays a walk to Pyth's price makes (about 0.07
# SOL each, a handful once), and the SOL side of its seed and of what it
# trades with (about a dollar's worth of SOL for each devnet USDC it holds).
[testnet."solana:devnet"]
reserve = 1
default = 0.2
admin = 0.5
operator = 0.25
keeper = 2
executor = 0
author = 1
platform = 0
attestor = 0
market = 3

# On Hyperliquid testnet the funder holds dollars on HyperCore and no HYPE on
# HyperEVM, so the task buys HYPE on HyperCore's spot market and sends it to
# HyperEVM itself, never paying more than `max_price` dollars a HYPE or buying
# more than `max_per_run` HYPE in one run. The deploying account (the admin)
# is given `activation_usd` on HyperCore so it exists there, and switched to
# big blocks, since some contracts are larger than a small block's 2M gas.
[hyperliquid]
max_price = 60.0
max_per_run = 3.0
activation_usd = 2.0
