# What `task chains:fund NETWORK=testnet` tops each role account up to, in the
# chain's own coin, from the funder (the EVM mnemonic's account
# m/44'/60'/0'/0/100). A role already holding its amount is left alone, so the
# task is safe to run again. `default` covers every role not named, but for
# the operator: it posts the stand-in venue's prices, no test network has the
# stand-in venue, so it is never funded here (and the file may not name it).
#
# Each amount lasts a month or more at the role's burn, written beside it a
# month: one run of the task a month keeps every role going, and the Testnet
# watch says a week ahead when one would run out sooner. A role with no burn
# beside it sends nothing of its own (the builder's and the reviewer's role
# accounts, say: their attested keys are the keeper's to stock).
#
# The funder keeps `reserve` for itself and funds nothing past it: a role it
# can't fully top up is reported, not half-funded.
#
# `market` is testnet-market's account (m/44'/60'/0'/0/101 of the EVM
# mnemonic, not a role), on the chains whose pools it keeps: a month of its
# mirror posts (one each time a mainnet feed moves) and its swaps (with a
# dollar mint before a buy where the dollar is mintable), at the chain's
# usual gas price. `task chains:fund` tops it up with the roles. Its burn is
# estimated from its rounds.
#
# The executor holds no role account: the keeper relays every blessing the
# executor publishes and, once the chain shows a vault's key blessed, stakes
# that key with gas: 0.0005 of the chain's coin on a public chain, or three
# of the key's worst-case sends if that is more. So the keeper's amount
# covers a stake for every vault key a run makes (the full seed activates
# four; a handover makes one more), the blessings it relays (a Groth16 check
# is a few hundred thousand gas, renewed every day or so) and its own sends,
# or a vault is taken on by nobody and its agent never starts. The executor
# role is given nothing. The keeper says at warn when its own account runs
# low (its floors are in config/chains.toml).

# Base Sepolia.
[testnet."evm:84532"] # Base Sepolia, ETH
reserve = 0.01
default = 0.004
admin = 0.03     # deploys and proposals only: none in the last week
executor = 0
keeper = 0.02    # 0.0045 a month: its sends 0.0005 (about 15 a day), the rest vault-key stakes and blessings
author = 0.008   # activations only: none in the last week
market = 0.005   # about 0.0015 a month (estimated): a post and a swap each time a feed moves

# Hyperliquid testnet's HyperEVM. The funder buys the HYPE on HyperCore (see
# [hyperliquid] below) with its HyperCore dollars, which the faucet tops up.
[testnet."evm:998"] # Hyperliquid testnet's HyperEVM, HYPE
reserve = 0.05
default = 0.03
admin = 0.4      # deploys on big blocks only: none in the last week
executor = 0
keeper = 0.5     # about 0.4 a month: its sends 0.008 (0.00028 a day), the rest vault-key stakes, sized by the fee estimate of the moment
author = 0.06    # activations only: a few a week

# Robinhood Chain testnet. Its public
# endpoint keeps no past state, so the keeper's burn here is estimated from
# Base Sepolia's, at this chain's 0.01 gwei.
[testnet."evm:46630"] # Robinhood Chain testnet, ETH
reserve = 0.0015
default = 0.0003
admin = 0.004    # deploys and proposals only
executor = 0
keeper = 0.006   # about 0.003 a month (estimated): its sends 0.0015, vault-key stakes 0.0005 each
author = 0.001   # activations only
market = 0.005   # about 0.003 a month (estimated): four mirror feeds' posts and the swaps after them

# Solana devnet, SOL. The funder is the deployer (m/44'/501'/0'/0' of the
# Solana mnemonic), which paid for the programs; `task chains:solana-setup
# NETWORK=testnet` tops each role up by transfer, and its own set-up's rent
# and fees come out of the reserve. Each amount is 0.001 SOL or more, or 0.
# Sends cost 5,000 lamports a signature; the rest is the rent the keys put
# into accounts: the keeper's lookup tables, the blessings it relays and the
# vault keys it stocks (0.05 SOL each, once the registry vouches for them; a
# handover makes one more); the author's activations (a vault, its station,
# their dollar accounts). The executor, the platform and the attestor sign no
# transaction there: the executor's keys are made in the enclave and stocked
# by the keeper.
#
# `market` is testnet-market's Solana account (m/44'/501'/111'/0'): most of
# its amount is held, not spent: the SOL side of its seed in Orca's pool (as
# much SOL by value as the devnet USDC it seeds there, so tied to the pool's
# depth: about 0.7 SOL for 75 USDC), the tick arrays a walk to Pyth's price
# makes (about 0.07 SOL each, a handful once), and what it trades with.
[testnet."solana:devnet"]
reserve = 1
default = 0.2
admin = 0.5      # deploys and set-ups only
keeper = 2       # about 0.3 a month: some 20 signatures a day, lookup tables, 0.05 for each vault key stocked
executor = 0
author = 1       # activations' rent only
platform = 0
attestor = 0
market = 3       # about 1.2 held once (its seed's SOL side and tick arrays), and its swaps' fees, about 0.01 a month (estimated)

# On Hyperliquid testnet the funder holds dollars on HyperCore and no HYPE on
# HyperEVM, so the task buys HYPE on HyperCore's spot market and sends it to
# HyperEVM itself, never paying more than `max_price` dollars a HYPE or buying
# more than `max_per_run` HYPE in one run. The HYPE the funder buys for the
# Hyperliquid vaults' station accounts is under the same `max_price`. The cap
# only guards testnet play money against a broken book: it sits well above
# where testnet HYPE trades, so a top-up isn't refused when the price moves.
# The deploying account (the admin) is given `activation_usd` on HyperCore so
# it exists there, and switched to big blocks, since some contracts are larger
# than a small block's 2M gas.
[hyperliquid]
max_price = 250.0
max_per_run = 3.0
activation_usd = 2.0
