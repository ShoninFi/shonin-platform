# The published list of drivers and bridges: the only names a `shonin.toml`
# may use under `[drivers.<name>]` and `[bridges.<name>]`. The builder refuses
# a manifest naming anything else, and so does the executor. It is compiled
# into every machine image, so which drivers an image accepts is part of what
# its attestation measures.
#
# For each driver:
#   label       what a depositor sees: the venue, never the driver
#   chain       the vault-chain name its station lives on, or "vault" for a
#               stand-in that runs on whichever chain the vault is on
#   networks    the networks it is offered on today; empty until its driver is
#               built and approved
#   restricted  who its venue's terms exclude, as short codes: ISO 3166 country
#               codes, ISO 3166-2 subdivision codes (CA-ON), or SANCTIONED.
#               Every vault using it refuses deposits from them, on top of the
#               platform's own US and SANCTIONED
#   custody     venue (the venue enforces it) or station (the station does)
#   exit        contract (the contracts close positions alone, in the leaver's
#               transaction), delayed (the contracts close them alone, but the
#               venue acts after the transaction, so a close is proved and
#               swept in a later one), or unwinder
#   valuation   on-chain, or attested-read
#
# For each bridge: label, networks.

[drivers.local]
label = "Local venue"
chain = "vault"
networks = ["local", "testnet"]
restricted = []
custody = "venue"
exit = "contract"
valuation = "on-chain"

[drivers.hyperliquid]
label = "Hyperliquid"
chain = "hyperliquid"
networks = ["testnet"]
# What the driver contract's `restricted()` answers, from Hyperliquid's terms:
# read them again before it is approved on mainnet.
restricted = ["CA-ON", "SANCTIONED", "US"]
custody = "venue"
# The venue acts on the station's orders after the transaction: a close is
# placed, then proved and swept home in later blocks.
exit = "delayed"
valuation = "on-chain"

[drivers.robinhood]
label = "Robinhood Chain stock tokens"
chain = "robinhood"
# Its listings are mainnet tokens: a testnet one would have nothing to trade.
networks = []
restricted = ["CA", "CH", "GB", "SANCTIONED", "US"]
custody = "station"
exit = "contract"
valuation = "on-chain"

[drivers.lighter]
label = "Lighter"
chain = "robinhood"
# Lighter has no exchange on Robinhood Chain's testnet.
networks = []
restricted = ["CA", "CN", "GB", "RU", "SANCTIONED", "UA", "US"]
custody = "venue"
exit = "delayed"
valuation = "attested-read"

[drivers.orca]
label = "Orca"
chain = "solana"
networks = []
restricted = ["SANCTIONED"]
custody = "station"
exit = "contract"
valuation = "on-chain"

[bridges.local-bridge]
label = "Local bridge"
networks = ["local", "testnet"]

[bridges.cctp]
label = "Circle CCTP"
networks = []

[bridges.across]
label = "Across"
networks = []
