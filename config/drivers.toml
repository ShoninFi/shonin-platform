# The published list of drivers and bridges: the only names a `shonin.toml`
# may use under `[drivers.<name>]` and `[bridges.<name>]`. The builder refuses
# a manifest naming anything else, and so does the executor. It is compiled
# into every machine image, so which drivers an image accepts is part of what
# its attestation measures.
#
# For each driver:
#   label       what a depositor sees: the venue, never the driver
#   chain       the vault-chain name its station lives on, or "vault" for a
#               stand-in that runs on whichever chain the vault is on
#   networks    the networks it is offered on today; empty until its driver is
#               built and approved
#   restricted  who its venue's terms exclude, as short codes: ISO 3166 country
#               codes, or SANCTIONED. Every vault using it refuses deposits from
#               them, on top of the platform's own US and SANCTIONED
#   custody     venue (the venue enforces it) or station (the station does)
#   exit        contract (the contracts close positions alone) or unwinder
#   valuation   on-chain, or attested-read
#
# For each bridge: label, networks.

[drivers.local]
label = "Local venue"
chain = "vault"
networks = ["local", "testnet"]
restricted = []
custody = "venue"
exit = "contract"
valuation = "on-chain"

[drivers.hyperliquid]
label = "Hyperliquid"
chain = "hyperliquid"
networks = []
# Taken from Hyperliquid's terms when its driver is approved.
restricted = []
custody = "venue"
exit = "contract"
valuation = "on-chain"

[drivers.robinhood-stocks]
label = "Stock tokens on Robinhood Chain"
chain = "robinhood"
networks = []
restricted = ["CA", "CH", "GB", "US"]
custody = "station"
exit = "contract"
valuation = "on-chain"

[drivers.lighter]
label = "Lighter"
chain = "robinhood"
networks = []
restricted = ["CA", "CN", "GB", "RU", "SANCTIONED", "UA", "US"]
custody = "venue"
exit = "contract"
valuation = "attested-read"

[drivers.orca]
label = "Orca"
chain = "solana"
networks = []
restricted = ["SANCTIONED"]
custody = "station"
exit = "contract"
valuation = "on-chain"

[bridges.local-bridge]
label = "Local bridge"
networks = ["local", "testnet"]

[bridges.cctp]
label = "Circle CCTP"
networks = []

[bridges.across]
label = "Across"
networks = []
