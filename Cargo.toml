[workspace]
resolver = "3"
members = [
    "packages/shared",
    "packages/chain",
    "packages/frontend/app",
    "packages/frontend/ui",
    "packages/frontend/marketing",
    "packages/indexer",
    "packages/api",
    "packages/machines/executor",
    "packages/machines/builder",
    "packages/machines/reviewer",
    "packages/machines/unwinder",
    "packages/keeper",
    "packages/devnet",
    "packages/fuelbench",
    "packages/fuelbench/guest",
    "packages/strategy-sdk",
    "packages/drivers/hyperliquid",
    "packages/drivers/robinhood",
    "packages/drivers/lighter",
    "packages/attestation/core",
    "packages/attestation/methods",
    "packages/attestation/host",
    "packages/attestation/deploy",
    "packages/rootkey",
]
# The Solana programs are their own workspace, built with Anchor.
exclude = ["contracts/solana"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Business Source License 1.1; see LICENSE. packages/strategy-sdk overrides
# this with Apache-2.0 because its code is compiled into authors' strategies.
license = "BUSL-1.1"
publish = false

[workspace.dependencies]
# Local crates
shared = { path = "packages/shared", package = "shonin-shared" }
hyperliquid = { path = "packages/drivers/hyperliquid", package = "shonin-hyperliquid" }
robinhood = { path = "packages/drivers/robinhood", package = "shonin-robinhood" }
lighter = { path = "packages/drivers/lighter", package = "shonin-lighter" }
chain = { path = "packages/chain", package = "shonin-chain" }
strategy-sdk = { path = "packages/strategy-sdk", package = "shonin-strategy-sdk" }
indexer = { path = "packages/indexer", package = "shonin-indexer" }
ui = { path = "packages/frontend/ui", package = "shonin-ui" }

# Common
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
ciborium = "0.2.2"
toml = "1.1.6"
sha2 = "0.11.0"
hex = "0.4.3"
rmp-serde = "1"
url = "2.5.8"
time = { version = "0.3.55", features = ["serde"] }
futures = "0.3.34"
tracing = "0.1.44"

# Native services (the machines, api, indexer, keeper, devnet)
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio-tungstenite = "0.30.0"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower = "0.5.3"
tar = "0.4.46"
rand = "0.10.3"
# Signalling a build's whole process group, which the standard library
# cannot, without unsafe code of our own.
rustix = { version = "1.1.5", features = ["process"] }

# Strategy runtime (WASM component model). The executor hosts components with
# wasmtime's async component model; strategies are built for wasm32-wasip2 and
# bind the shonin:strategy world with wit-bindgen.
wasmtime = { version = "48.0.2", features = ["component-model-async"] }
wasmtime-wasi = "48.0.2"
# An agent's outbound requests: wasi:http, sent by the executor's own client
# so every request is checked and counted (no default sender).
wasmtime-wasi-http = { version = "48.0.2", default-features = false, features = ["p2"] }
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
h2 = "0.4.19"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
# TLS ended in the executor, against the roots compiled into the image.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
tokio-stream = { version = "0.1.19", features = ["sync"] }
wit-bindgen = { version = "0.62.0", features = ["async", "futures-stream"] }

# The decimal a strategy and an adapter agree on, on both sides of the
# component boundary.
fastnum = { version = "0.7.5", default-features = false, features = ["std", "serde"] }

# Chains and keys. The alloy-core crates (1.x) encode calls and decode events
# and build for every target, including wasm32-unknown-unknown, so `chain` is
# dual-target. The `alloy` meta-crate (2.x) adds providers and signers and is
# used only by native services.
alloy = { version = "2.4.2", features = ["full", "signer-mnemonic"] }
alloy-primitives = "1.7.3"
alloy-sol-types = "1.7.3"
k256 = "0.14.0"
# The web app's recovery-phrase wallet: a key derived from the phrase in the
# browser's memory signs locally (EIP-1559 transactions and the deposit
# statement). These build for wasm32-unknown-unknown; `getrandom` needs its
# `js` backend there.
alloy-signer = "2.4.2"
alloy-signer-local = { version = "2.4.2", default-features = false, features = ["mnemonic"] }
alloy-consensus = { version = "2.4.2", default-features = false, features = ["k256"] }
alloy-eips = { version = "2.4.2", default-features = false }
getrandom = "0.2.17"
# Lighter's transaction signing (Poseidon2 over Goldilocks, Schnorr on
# ECgFp5), offline only: no client, no network.
lighters = { version = "0.1.1", default-features = false }
# The inference host: ONNX Runtime on the CPU, its prebuilt library fetched
# at build time and pinned with the crate.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs"] }
ed25519-dalek = "3.0.0"
bs58 = "0.5.1"

# Frontend (wasm32-unknown-unknown via Trunk).
# The wasm-bindgen family is pinned EXACTLY: Trunk downloads the wasm-bindgen CLI
# matching the version in Cargo.lock, and these crates must move together.
dominator = "0.5.38"
futures-signals = "0.3.34"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = "=0.3.105"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
