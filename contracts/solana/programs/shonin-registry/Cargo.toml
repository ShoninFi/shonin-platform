[package]
name = "shonin-registry"
version = "0.1.0"
description = "The Shonin registry, on Solana"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Build with the committed mainnet id (mainnet-id) instead of the local keypair's.
mainnet = []

[dependencies]
anchor-lang = "0.32.1"

[build-dependencies]
bs58 = "0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
