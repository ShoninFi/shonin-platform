[package]
name = "shonin-registry"
version = "0.1.0"
description = "Which code may hold a key, and which keys it holds: the attestation registry, on Solana"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Build with the committed mainnet id (mainnet-id) instead of the local keypair's.
mainnet = []
# Build with the committed devnet id (devnet-id), derived from the team's mnemonic.
devnet = []

[dependencies]
anchor-lang = { workspace = true }
shonin-common = { workspace = true }

[build-dependencies]
shonin-program-id = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
