[package]
name = "shonin-test-hostile-venue"
version = "0.1.0"
description = "For tests only: the stand-in venue's code replaced by its upgrade authority with code that turns the station's signature on its own token accounts"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_test_hostile_venue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Never set for this program: it is refused for mainnet at build time.
mainnet = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }

[build-dependencies]
shonin-program-id = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
