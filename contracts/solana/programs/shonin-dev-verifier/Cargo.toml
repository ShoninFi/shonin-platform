[package]
name = "shonin-dev-verifier"
version = "0.1.0"
description = "What a development chain trusts instead of an enclave"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_dev_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Never set for this program: it is refused for mainnet at build time.
mainnet = []
# Build with the committed devnet id (devnet-id): the stand-in stack runs on devnet.
devnet = []

[dependencies]
anchor-lang = { workspace = true }
shonin-common = { workspace = true }

[build-dependencies]
shonin-program-id = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
