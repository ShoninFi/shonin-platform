[package]
name = "shonin-local-driver"
version = "0.1.0"
description = "The stand-in venue's driver: values a station's account there and prepares its closes"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_local_driver"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "shonin-driver/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Never set for this program: it is refused for mainnet at build time.
mainnet = []
# Build with the committed devnet id (devnet-id): the stand-in stack runs on devnet.
devnet = ["shonin-local-venue/devnet"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
shonin-driver = { path = "../../crates/shonin-driver" }
shonin-local-venue = { path = "../shonin-local-venue", features = ["no-entrypoint"] }

[build-dependencies]
shonin-program-id = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
