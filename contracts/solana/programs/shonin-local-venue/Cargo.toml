[package]
name = "shonin-local-venue"
version = "0.1.0"
description = "The stand-in venue for local chains and tests: markets, spot and perp positions, dollars in and out"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "shonin_local_venue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Never set for this program: it is refused for mainnet at build time.
mainnet = []
# Build with the committed devnet id (devnet-id): the stand-in stack runs on devnet.
devnet = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
shonin-common = { workspace = true }

[build-dependencies]
shonin-program-id = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
