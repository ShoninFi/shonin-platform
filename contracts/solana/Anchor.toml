# The Solana programs, built with Anchor. A skeleton for now: the toolchain
# and the local validator are wired in, and the program does nothing yet.
[features]
resolution = true
skip-lint = false

# Program ids are not written here. A program's address is its keypair's
# (target/deploy, never committed), or, built with `--features mainnet`, the
# committed id in programs/<name>/mainnet-id; see its build.rs.

# The local validator `task dev` starts (see taskfiles/config.yml for ports).
[provider]
cluster = "http://127.0.0.1:19110"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
