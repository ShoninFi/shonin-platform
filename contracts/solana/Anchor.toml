# The Solana programs, built with Anchor. A skeleton for now: the toolchain
# and the local validator are wired in, and the program does nothing yet.
[features]
resolution = true
skip-lint = false

# Only a program's mainnet id is ever committed, here and in its declare_id!
# (see config/deployments/README.md). Local and devnet ids come from the
# keypair Anchor writes under target/deploy, which never leaves the machine.
[programs.localnet]
shonin_registry = "Bn5t8rYJnsd86vE1DRA7xwfG6Qiz7sw3AoGaM4WrpAs6"

# The local validator `task dev` starts (see taskfiles/config.yml for ports).
[provider]
cluster = "http://127.0.0.1:19110"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"
