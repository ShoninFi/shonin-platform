# The Solana programs are their own Cargo workspace: they build for Solana's
# own target with Anchor's toolchain, and the root workspace excludes them.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
